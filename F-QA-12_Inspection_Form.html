aquHsD3+bY9CdnsNqGo2axqCzFtqYtPWI+23yTWps7O0N59b/A34ZqAiCWXi/AAAAAElFTkSuQmCC";
// Process colours for the final report: [soft background, accent]. Print-safe flat tints.
const FR_PROC_COLORS = {
  "030":["#fef3c7","#b45309"], "040":["#dbeafe","#1d4ed8"], "050":["#ede9fe","#6d28d9"],
  "060":["#cffafe","#0e7490"], "070":["#e2e8f0","#334155"], "080":["#fce7f3","#be185d"],
  "090":["#dcfce7","#15803d"], "100":["#ffedd5","#c2410c"], "120":["#e0e7ff","#4338ca"], "130":["#d1fae5","#047857"]
};
function frCellClass(v) {
  const t = String(v === null || v === undefined ? "" : v).trim();
  if (!t) return "fr-empty";
  if (/NG|FAIL|✗/.test(t)) return "fr-ng";
  if (t === "No Run") return "fr-nr";
  if (/^OK\b/.test(t) || /^Photo\b/.test(t)) return "fr-ok";
  return "";
}
function frDate(iso) { const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : (iso || ""); }

function rFinalSheet() {
  const rows = (closedBatchGroups()[S.finalSheetBase]) || [];
  const back = `<button class="btn-outline no-print" onclick="S.screen='setup';render()">← Back</button>`;
  if (!rows.length) return `<div class="header"><h1>📄 Final report</h1></div>${back}<div class="alert">Final report not found — go back and refresh.</div>`;
  const f = rows[0];
  const product = PRODUCTS[f.Product];
  const procs = product ? buildProcesses(f.Product) : [];
  const byShift = {}; rows.forEach(r => { byShift[r["Shift / Sample"]] = r; });
  const shifts = ROUND_LABELS.filter(l => byShift[l]);
  const cell = v => (v === null || v === undefined || v === "") ? "—" : v;
  let lineCount = 0;
  const body = [];
  procs.forEach(proc => {
    const [bg, ac] = FR_PROC_COLORS[proc.no] || ["#f1f5f9", "#475569"];
    const lines = [];
    const add = (label, getter) => {
      lines.push(`<tr><td class="fr-l" style="border-left:3px solid ${ac};">${label}</td>${shifts.map(sh => { const v = getter(byShift[sh]); return `<td class="${frCellClass(v)}">${cell(v === null || v === undefined || v === "" ? v : String(v).replace(/ · No Run (\d+)/, " · NR $1"))}</td>`; }).join("")}</tr>`);
    };
    if (proc.type === "braiding") {
      const n = product.braiding.machines;
      for (let i = 1; i <= n; i++) {
        const col = `BR-${String(i).padStart(2, "0")} O.D.`;
        if (!shifts.some(sh => !isBlankCell(byShift[sh][col]))) continue;
        add(`${col.replace(" O.D.", "")} O.D.`, r => r[col]);
      }
    } else {
      proc.checks.forEach(c => {
        const photoOnly = proc.no === "120" ? ({ "Pressure Testing":"Pressure Testing Photo (P120)", "Fitting Load Test":"Fitting Load Test Photo (P120)", "Air Leakage":"Air Leakage Photo (P120)" })[c.key] : null;
        add(c.key, r => { const v = vrSheetValue(r, proc.no, c.key); return v || (photoOnly ? r[photoOnly] : v); });
      });
    }
    if (!lines.length) return;
    lineCount += lines.length + 1;
    body.push(`<tr class="fr-proc"><td colspan="${shifts.length + 1}" style="background:${bg};color:${ac};border-left:3px solid ${ac};">P${proc.no} · ${proc.machine && proc.machine !== "—" ? proc.machine + " — " : ""}${proc.name}</td></tr>`);
    body.push(...lines);
  });
  const inv = groupInvoice(rows);
  const dates = String(f["Work Dates"] || "").split(",").map(x => x.trim()).filter(Boolean);
  const dateText = dates.length > 1 ? `${frDate(dates[0])} → ${frDate(dates[dates.length - 1])}` : frDate(dates[0] || "");
  const dense = lineCount > 58 ? " fr-dense" : "";
  const chip = (k, v, c) => `<div class="fr-chip" style="border-top:3px solid ${c};"><div class="fr-k">${k}</div><div class="fr-v">${v}</div></div>`;
  return `
  <div class="fr-root${dense}">
    <table class="fr-tbl">
      <thead>
        <tr><td class="fr-bare" colspan="${shifts.length + 1}">
          <div class="fr-banner">
            <img class="fr-logo" src="${KONNECKT_LOGO}" alt="Konneckt Hoses">
            <div class="fr-title"><div class="fr-t1">FINAL INSPECTION REPORT</div><div class="fr-t2">Averaged across all days worked · ready for Pre-Dispatch Inspection</div></div>
            <table class="fr-fmt">
              <tr><td>Fmt. No.</td><td>F-QA-12</td><td>Rev. No.</td><td>01</td></tr>
              <tr><td>Org. Date</td><td>01.04.19</td><td>Eff. Date</td><td>01.09.2026</td></tr>
              <tr><td>Doc. Ref.</td><td colspan="3">${S.finalSheetBase}</td></tr>
            </table>
          </div>
        </td></tr>
        <tr><th class="fr-l">Check</th>${shifts.map(sh => `<th>${sh}</th>`).join("")}</tr>
      </thead>
      <tbody>
        <tr><td class="fr-bare" colspan="${shifts.length + 1}">
          <div class="fr-chips">
            ${chip("Product", f.Product, "#dc2626")}
            ${chip("Batch No.", S.finalSheetBase, "#2563eb")}
            ${chip("Days worked", `${f["Days Worked"] || "—"} · ${dateText}`, "#0d9488")}
            ${chip("Shifts covered", shifts.length + " of " + ROUND_LABELS.length, "#7c3aed")}
            ${chip("Closed", `${frDate((f["Closed At"] || "").slice(0, 10))} · ${f["Closed By"] || "—"}`, "#d97706")}
            ${chip("Invoice no.", inv || "<span style='color:#c2410c'>not entered</span>", "#16a34a")}
          </div>
        </td></tr>
        ${body.join("")}
        <tr><td class="fr-bare" colspan="${shifts.length + 1}">
          <div class="fr-legend">
            Measured values: <b>average (days run / days worked)</b> · pass/fail checks: <b>OK count</b> · NR = No Run on some days ·
            <span class="fr-sw fr-ok">all OK</span> <span class="fr-sw fr-ng">any NG</span> <span class="fr-sw fr-nr">No Run</span>

// Builds one full Block-A row (all SHEET_DATA_COLS columns, in the exact SHEET_HEADERS
// order above) from a round's entries. Shared by buildSheetRows() (all rounds, unwindowed,
// for xlsx export) and buildSheetRow() (current round only, windowed for Sheet submission)
// below — this is the single source of truth for "what goes in which column" now, instead
// of that logic being duplicated (and able to drift out of sync) across four separate
// functions the way it used to be.
function buildBlockARow(p, rd, shiftLabel, windowed) {
  const g = windowed || ((no, key) => rd.entries[pkey(no, key)] || {});
  const brLabels = Array.from({length:18}, (_, bi) => {
    const m = `BR-${String(bi+1).padStart(2,"0")}`;
    return (rd.braiding[m] && rd.braiding[m].label) || "";
  });
  const brPhotos = Array.from({length:18}, (_, bi) => {
    const m = `BR-${String(bi+1).padStart(2,"0")}`;
    return (rd.braiding[m] && rd.braiding[m].photo) || "";
  });
  const braidPhotosLegacy = Object.keys(rd.braiding)
    .filter(m => rd.braiding[m] && rd.braiding[m].photo)
    .map(m => `${m}: ${rd.braiding[m].photo}`)
    .join("; ");

  return [
    // meta
    S.date, p.label, S.batchNo || "", shiftLabel, S.procOperators["040"] || S.operator,
    S.operator || "", S.supName, S.finalisedAt,
    // 030
    g("030","Hardness").label || "", g("030","Tensile").label || "", g("030","Button Weight").label || "",
    g("030","TS2").label || "", g("030","TC90").label || "",
    // 040
    p.extruder.od, g("040","O.D.").label || "", g("040","O.D.").photo || "",
    p.extruder.id, g("040","I.D.").label || "", g("040","I.D.").photo || "",
    g("040","Appearance").label || "",
    // 050
    g("050","Pressure").label || "", g("050","Pressure").photo || "",
    // 060
    g("060","Leakage").label || "", g("060","Pressure").label || "",
    // 070
    ...brLabels, ...brPhotos, braidPhotosLegacy,
    // 080
    g("080","O.D. (Ring Die)").label || "", g("080","Wire Cut").label || "", g("080","Appearance").label || "",
    // 090
    g("090","Length").label || "", g("090","Length").photo || "", g("090","Wire Cut").label || "", g("090","Appearance").label || "",
    // 100
    g("100","Assembly").label || "",
    // 120
    g("120","Crimp O.D.").label || "", g("120","Crimp O.D.").photo || "",
    // These three have a photo column but no separate reading column, so "No Run" has to be
    // written into the photo column itself or the Sheet would show nothing for them.
    g("120","Pressure Testing").photo || noRunText(g("120","Pressure Testing")),
    g("120","Fitting Load Test").photo || noRunText(g("120","Fitting Load Test")),
    g("120","Air Leakage").photo || noRunText(g("120","Air Leakage")),
    // 130
    g("130","Appearance").label || ""
  ];
}

// Local/export snapshot — shows the FULL current picture across all rounds, unwindowed.
// Used only by exportToLog(); the actual Sheet submission uses buildSheetRow() below.
function buildSheetRows() {
  const p = PRODUCTS[S.product];
  if (!p) return [];
  return S.roundData.map((rd, i) => {
    if (!rd || !Object.keys(rd.entries).length) return null;
    return buildBlockARow(p, rd, ROUND_LABELS[i]);
  }).filter(Boolean);
}

// Sheet-submission row — CURRENT round only, windowed to just what's new since the last
// save (pause or finalise) for this round, so a same-day update never re-writes stale data.
// Produces the FULL Block A row (meta + every process 030..130, data and photos alike) in
// one array — submitToSheet() writes this as a single atomic range, replacing what used to
// be the main row plus three separate best-effort follow-up writes.
function noRunText(entry) { return entry && entry.result === "NO_RUN" ? "No Run" : ""; }
function buildSheetRow() {
  const p = PRODUCTS[S.product];
  if (!p) return null;
  const rd = S.roundData[S.currentRound];
  if (!rd || (!Object.keys(rd.entries).length && !Object.keys(rd.braiding || {}).length)) return null;

  const procs = buildProcesses(S.product);
  const procOrder = {};
  procs.forEach((pr, i) => { procOrder[pr.no] = i; });
  const reportedThru = S.reportedThroughIdx || 0;
  const braidProc = procs.find(pr => pr.type === "braiding");
  const braidIdx  = braidProc ? procOrder[braidProc.no] : -1;
  const braidWindowedOut = braidIdx >= 0 && braidIdx < reportedThru;

  const g = (no, key) => {
    if ((procOrder[no] ?? 0) < reportedThru) return {};
    return rd.entries[pkey(no, key)] || {};
  };
  // Windowed copy of rd for the braiding block, so buildBlockARow's brLabels/brPhotos/
  // braidPhotosLegacy come back blank too when braiding was already reported earlier today
  // — same behavior as before, just expressed through the shared builder instead of a
  // separate braidWindowedOut branch duplicated in three places.
  const rdForBraid = braidWindowedOut ? { entries: rd.entries, braiding: {} } : rd;

  return buildBlockARow(p, rdForBraid, ROUND_LABELS[S.currentRound], g);
}

// A row number cached in S.dayRowNum / the batch registry can go stale if someone deletes
// or inserts rows directly in the Sheet UI (every row below the edit point shifts). Before
// trusting a cached row number for an update, re-check it against a fresh read: if the row
// no longer has this batch's Batch No. + Shift, search for the row that actually does; if no
// row anywhere still matches, return null so the caller appends a fresh row instead of
// silently overwriting whatever unrelated data now sits at the stale row number.
async function locateRow(rowNum, expectBatchNo, expectShift, expectDate) {
  try {
    const res = await fetch(`/api/log?date=${encodeURIComponent(expectDate || "")}`, { cache: "no-store" });
    if (!res.ok) return rowNum || null; // can't verify — fall back to trusting the cached number
    const data = await res.json();
    const rows = (data && data.rows) || [];
    const matches = r => (r["Batch No."] || "") === expectBatchNo && (r["Shift / Sample"] || "") === expectShift;
    if (rowNum) {
      const atRow = rows.find(r => r.__row === rowNum);
      if (atRow && matches(atRow)) return rowNum; // still correct — nothing shifted
    }
    const found = rows.find(matches);
    return found ? found.__row : null;
  } catch (e) {
    return rowNum || null; // network hiccup — don't block the save, fall back to old behavior
  }
}

// Duplicate-row guard. When this session has no remembered row for the shift (new tab, lost
// local data, other phone, Setup used instead of Continue), look the Sheet up BEFORE
// appending: if a row for this exact Batch No. + Shift + Date already exists, reuse it
// instead of creating a second one. Cells this session left blank keep what the existing
// row already had, so a fresher-but-emptier session can never wipe filled data.
async function findExistingRow(batchNo, shift, date) {
  try {
    const res = await fetch(`/api/log?date=${encodeURIComponent(date || "")}`, { cache: "no-store" });
    if (!res.ok) return null;
    const data = await res.json();
    const rows = (data && data.rows) || [];
    const hits = rows.filter(r => (r["Batch No."] || "") === batchNo && (r["Shift / Sample"] || "") === shift);
    return hits.length ? hits[hits.length - 1] : null;
  } catch (e) { return null; }
}
function mergeKeepingExisting(row, existing) {
  return row.map((v, i) => {
    const blank = (v === "" || v === null || v === undefined);
    if (!blank) return v;
    const old = existing[SHEET_HEADERS[i]];
    return (old === undefined || old === null) ? v : old;
  });
}

// The Sheet's row 1 must actually contain "Last Saved At" at LAST_SAVED_COL for
// /api/log's name-keyed row-object mapping to expose that column at all — an unlabeled
// column would read back keyed under "" instead. This codebase's convention for schema
// setup (see api/submit.js's grow/createSheet modes) is a one-time administrative step, not
// something the app grows unprompted at runtime — so this only ever WRITES the header text
// into a cell that must already exist in the grid; it does not expand the sheet's column
// count itself. Gated to once per page session (writing the same text repeatedly is wasted
// traffic, not wasted correctness); a failed attempt simply retries on the next page load.
let lastSavedHeaderEnsured = false;
async function ensureLastSavedHeader() {
  if (lastSavedHeaderEnsured) return;
  try {
    // Block C (Last Saved At + the three gauge readings) sits past Block B. Make sure the
    // first tab's grid is wide enough for it (appending columns never moves existing data),
    // then write the header cells.
    const need = SHEET_HEADERS.length;
    try {
      const meta = await sheetApi({ mode: "meta" });
      const first = (meta.sheets || []).slice().sort((a, b) => a.index - b.index)[0];
      const have = first && first.gridProperties && first.gridProperties.columnCount;
      if (first && have && have < need) await sheetApi({ mode: "grow", sheetId: first.sheetId, addColumns: need - have });
    } catch (e) { /* best-effort — the header write below reports its own failure */ }
    await fetch("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: "update", range: `${LAST_SAVED_COL}1:${BLOCK_C_END_COL}1`, rows: [[LAST_SAVED_COL_NAME, ...GAUGE_COLS]] })
    });
  } catch (e) { /* best-effort — see comment above */ }
  finally { lastSavedHeaderEnsured = true; }
}

// The three Process 120 gauge readings, windowed exactly like Block A (a process already
// reported earlier the same day is blank, so a later save doesn't re-write it).
function buildGaugeCols() {
  const rd = S.roundData[S.currentRound];
  const procs = buildProcesses(S.product);
  const idx = procs.findIndex(p => p.no === "120");
  if (!rd || idx < 0 || idx < (S.reportedThroughIdx || 0)) return ["", "", ""];
  return ["Pressure Testing", "Fitting Load Test", "Air Leakage"].map(k => (rd.entries[pkey("120", k)] || {}).label || "");
}

// Which Sheet row did an append just create? Google's append reply carries the range under
// updates.updatedRange (the server passes that through both nested in `result` and at the top
// level as `updates`); the older code only looked at result.updatedRange, which an append reply
// never has — so the new row's number was lost, the Block C write went to "CBnull", and a
// second save of the same shift appended a duplicate row. Read every place it can be, and if
// the reply still doesn't say, look the row up by batch + shift + date.
async function rowFromAppend(data, batchNo, shift, date) {
  const cands = [
    data && data.updates && data.updates.updatedRange,
    data && data.result && data.result.updates && data.result.updates.updatedRange,
    data && data.result && data.result.updatedRange
  ];
  for (const c of cands) {
    const m = c && String(c).match(/![A-Z]+(\d+)/);
    if (m) return parseInt(m[1], 10);
  }
  const ex = await findExistingRow(batchNo, shift, date);
  return ex && ex.__row ? ex.__row : null;
}

// Silent, non-blocking checkpoint to the Sheet — fired when the camera is about to open (and
// again once a photo finishes uploading). Mobile Chrome can kill this tab while the camera
// app is in front; if the phone also wipes the tab's local storage, everything since the
// last Pause is gone. This puts a copy on the Sheet first. It never waits (the caller does
// not await it, so the camera opens instantly), never changes the screen, S.submitStatus or
// any alert, and swallows its own failures — it's an extra safety net on top of the local
// autosave, not a replacement for Pause/Review. Same upsert rules as submitToSheet(): the
// first save of the day appends and remembers the row number, later ones update that row.
let silentPushPromise = null;
function silentCheckpoint() {
  if (silentPushPromise) return silentPushPromise;      // one at a time
  if (S.screen !== "process" || !S.batchBase) return null;
  if (S.submitStatus === "loading") return null;        // a real submit is already running
  let ok = false;
  try { ok = hasNewProgressToReport() && !!buildSheetRow(); } catch (e) { ok = false; }
  if (!ok) return null;
  silentPushPromise = (async () => {
    try {
      const row = buildSheetRow();
      if (!row) return;
      const roundIdx = S.currentRound, batchNo = S.batchNo, date = S.date, base = S.batchBase;
      let rowNum = S.dayRowNum || null;
      if (rowNum) {
        const verified = await locateRow(rowNum, batchNo, ROUND_LABELS[roundIdx], date);
        if (verified !== rowNum) { rowNum = verified; S.dayRowNum = rowNum; }
      }
      const post = (body) => fetch("/api/submit", {
        method: "POST", keepalive: true,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      let rowOut = row;
      if (!rowNum) {
        const ex = await findExistingRow(batchNo, ROUND_LABELS[roundIdx], date);
        if (ex && ex.__row) { rowNum = ex.__row; S.dayRowNum = rowNum; rowOut = mergeKeepingExisting(row, ex); }
      }
      let res;
      if (rowNum) {
        res = await post({ mode: "update", range: `A${rowNum}:${colLetter(SHEET_DATA_COLS)}${rowNum}`, rows: [rowOut] });
      } else {
        res = await post({ rows: [row] });
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error("silent checkpoint failed");
      if (!rowNum) {
        rowNum = await rowFromAppend(data, batchNo, ROUND_LABELS[roundIdx], date);
        if (rowNum) S.dayRowNum = rowNum;
      }
      if (rowNum) {
        registerBatchDay(base, {
          product: S.product, batchLastDay: S.batchDay, batchLastDate: date,
          roundIdx, roundRowNum: rowNum, roundLastDate: date
        });
        await ensureLastSavedHeader();
        await post({ mode: "update", range: `${LAST_SAVED_COL}${rowNum}:${BLOCK_C_END_COL}${rowNum}`, rows: [[new Date().toISOString(), ...buildGaugeCols()]] });
        saveState();
      }
    } catch (e) {
      console.warn("Silent checkpoint skipped:", e && e.message);
    } finally {
      silentPushPromise = null;
    }
  })();
  return silentPushPromise;
}

// Same-day upsert: the FIRST save of a given calendar day for this round appends a fresh
// row (and remembers its row number); any LATER save on that SAME calendar date updates
// that exact row in place instead of appending another one. A genuinely new calendar
// date (continuing tomorrow, etc.) always appends a fresh row via continueBatch().
let submitInFlight = false;
async function submitToSheet(isRetry) {
  if (!isRetry && (submitInFlight || S.submitStatus === "loading")) return; // double-tap guard
  if (!isRetry) { S.submitStatus = "loading"; S.submitError = ""; render(); }
  // If a silent checkpoint is mid-flight, let it finish first so it can't append a second
  // row for the same round/day (it records S.dayRowNum when it creates one).
  if (silentPushPromise) { try { await silentPushPromise; } catch (e) {} }
  try {
    const row = buildSheetRow();
    if (!row) throw new Error("No data to submit for this round yet.");

    let rowNum = S.dayRowNum || null;
    if (rowNum) {
      const verified = await locateRow(rowNum, S.batchNo, ROUND_LABELS[S.currentRound], S.date);
      if (verified !== rowNum) { rowNum = verified; S.dayRowNum = rowNum; }
    }
    let data;
    let rowOut = row;
    if (!rowNum) {
      const ex = await findExistingRow(S.batchNo, ROUND_LABELS[S.currentRound], S.date);
      if (ex && ex.__row) { rowNum = ex.__row; S.dayRowNum = rowNum; rowOut = mergeKeepingExisting(row, ex); }
    }
    if (rowNum) {
      const range = `A${rowNum}:${colLetter(SHEET_DATA_COLS)}${rowNum}`;
      const res = await fetch("/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: "update", range, rows: [rowOut] })
      });
      data = await res.json();
      if (!res.ok) {
        const msg = (data && data.error && (data.error.error?.message || data.error)) || "Submit failed";
        throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
      }
    } else {
      const res = await fetch("/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rows: [row] })
      });
      data = await res.json();
      if (!res.ok) {
        const msg = (data && data.error && (data.error.error?.message || data.error)) || "Submit failed";
        throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
      }
      rowNum = await rowFromAppend(data, S.batchNo, ROUND_LABELS[S.currentRound], S.date);
      if (rowNum) S.dayRowNum = rowNum;
    }
    if (!rowNum) throw new Error("The row was saved but its position couldn't be confirmed. Tap Retry.");

    // Persist the row number + resume point into the registry for this round so a later
    // same-day save (or a same-day re-open) can find and update the same row.
    if (S.batchBase && rowNum) {
      registerBatchDay(S.batchBase, {
        product: S.product,
        batchLastDay: S.batchDay,
        batchLastDate: S.date,
        roundIdx: S.currentRound,
        roundRowNum: rowNum,
        roundLastDate: S.date
      });
    }

    // Records this save's own timestamp in Block C (see SHEET_HEADERS), so "Continue
    // Existing Batch" can show a real last-worked TIME, not just a date. Deliberately a
    // SEPARATE, AWAITED write rather than folded into Block A's array — Block C sits past
    // Block B specifically so adding it never touches Block A's/Block B's column math (see
    // the Block C comment on SHEET_HEADERS). This is not the fire-and-forget pattern the
    // comment above warns about: it's confirmed before continuing, and same as the main row
    // write above, its failure falls through to this function's existing retry/error path
    // rather than failing silently.
    await ensureLastSavedHeader(); // makes sure Sheet1 has the Block C columns + headers before writing them
    const lastSavedRes = await fetch("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: "update", range: `${LAST_SAVED_COL}${rowNum}:${BLOCK_C_END_COL}${rowNum}`, rows: [[new Date().toISOString(), ...buildGaugeCols()]] })
    });
    if (!lastSavedRes.ok) {
      const lastSavedData = await lastSavedRes.json().catch(() => ({}));
      const msg = (lastSavedData && lastSavedData.error && (lastSavedData.error.error?.message || lastSavedData.error)) || "Couldn't record save time";
      throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
    }
    await ensureLastSavedHeader(); // best-effort, see its own comment — never blocks this save

    // Device ID, the per-machine braiding photos, and the 030/050/060/080/100/130 checks
    // used to each be separate fire-and-forget follow-up requests after the main row —
    // that fragmentation is what caused real data loss in production (2026-08-11: Device ID
    // and 12 of 13 extra checks came back blank on finalised, even verified rows, because
    // those follow-ups fired but were never confirmed before the app moved on). buildSheetRow()
    // now returns the complete Block A row in one array, written above as a single awaited
    // request — there's nothing left to do here.

    // NOTE: reportedThroughIdx is deliberately NOT advanced here — it represents "start of
    // today" for this round and must stay fixed across multiple same-day saves, since each
    // save now UPDATES the same row (a full snapshot of today's work), not just an increment.
    // It only moves forward when a genuinely new calendar day begins (see continueBatch()).
    S.submitStatus = "done";
    render();
  } catch (err) {
    if (!isRetry) {
      setTimeout(() => submitToSheet(true), 4000);
      return;
    }
    S.submitStatus = "error";
    S.submitError = err.message;
    render();
  }
}

function exportToLog() {
  const rows = buildSheetRows();
  if (!rows.length) { alert("No rounds have data to export."); return; }
  const ws = XLSX.utils.aoa_to_sheet([SHEET_HEADERS, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Inspection");
  XLSX.writeFile(wb, `F-QA-12_${S.product}_${S.date}.xlsx`);
}

// Maps a (process no, check key) pair to its photo column in the Sheet — mirrors the
// photo columns buildSheetRow() writes. Used by rLogDetail() to show a photo link next
// to each reading, same idea as vrSheetValue() does for the reading itself.
function logPhotoValue(procNo, checkKey, row) {
  const col = {
    "040|O.D.": "O.D. Photo", "040|I.D.": "I.D. Photo",
    "050|Pressure": "Pressure Photo (P050)",
    "090|Length": "Length Photo (P090)",
    "120|Crimp O.D.": "Crimp O.D. Photo (P120)",
    "120|Pressure Testing": "Pressure Testing Photo (P120)",
    "120|Fitting Load Test": "Fitting Load Test Photo (P120)",
    "120|Air Leakage": "Air Leakage Photo (P120)"
  }[`${procNo}|${checkKey}`];
  const v = col ? (row[col] || "") : "";
  return /^https?:/i.test(v) ? v : ""; // "No Run" text in a photo column is not a photo
}

// A machine's photo, preferring its own dedicated "BR-xx Photo" column; falls back to
// parsing the legacy packed "Braiding Photos" cell for rows submitted before that column
// existed.
function logBraidPhoto(row, m) {
  const dedicated = row[`${m} Photo`];
  if (dedicated) return dedicated;
  const packed = row["Braiding Photos"] || "";
  const hit = packed.split(";").map(s => s.trim()).find(s => s.startsWith(`${m}:`));
  return hit ? hit.split(":").slice(1).join(":").trim() : "";
}

// ═══════════════════════════════════════════════
// BATCH REPORT — all 6 shifts of one batch-day, side by side on one printable page.
// Pulls live from the Sheet (not S.roundData) so it works regardless of which device(s)
// did which shift. One page per batch-DAY: a batch that ran 3 days gets 3 separate
// reports (matching the paper form, which is per-day), not one page cramming every day.
// ═══════════════════════════════════════════════
async function openBatchReport(base, day, fromScreen) {
  S.batchReportFrom = fromScreen || S.screen;
  S.batchReportBase = base;
  S.batchReportDay = day;
  S.batchReportRows = null;
  S.batchReportLoading = true;
  S.batchReportError = "";
  S.screen = "batchreport";
  render();

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 20000);
  try {
    const res = await fetch(`/api/log?search=${encodeURIComponent(base)}`, { cache: "no-store", signal: controller.signal });
    const data = await res.json();
    if (!res.ok) {
      const msg = (data && data.error && (data.error.error?.message || data.error)) || "Couldn't load this batch.";
      throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
    }
    // The search above is a broad substring match server-side; narrow to rows whose
    // Batch No. parses to exactly this base+day (a day-2+ batch no. contains the base as
    // a substring too, so this exact check is what actually pins down the right day).
    S.batchReportRows = (data.rows || []).filter(r => {
      const parsed = parseBatchNo(r["Batch No."]);
      return parsed.base === base && parsed.day === day;
    });
  } catch (err) {
    S.batchReportError = err.name === "AbortError"
      ? "Timed out reaching the Sheet (it may just be waking up) — try again."
      : err.message;
  } finally {
    clearTimeout(timer);
  }
  S.batchReportLoading = false;
  render();
}

// Reads the batch selected in the "Continue Existing Batch" dropdown and opens its report.
// Prompts for which day if the batch has run more than one (rare — most batches finish in
// a single day), since each day is its own page.
function viewBatchReportClicked() {
  const base = S.selectedBatch;
  if (!base) { alert("Please select a batch from the list first."); return; }
  const info = mergedBatchRegistry()[base];
  const lastDay = (info && info.lastDay) || 1;
  let day = 1;
  if (lastDay > 1) {
    const input = prompt(`This batch has ${lastDay} day(s) of work. Which day's report do you want to view? (1-${lastDay})`, String(lastDay));
    if (input === null) return;
    day = parseInt(input, 10);
    if (!Number.isInteger(day) || day < 1 || day > lastDay) { alert("Please enter a valid day number."); return; }
  }
  openBatchReport(base, day, "setup");
}

function rBatchReport() {
  const base = S.batchReportBase;
  const day  = S.batchReportDay;
  const dayLbl = day > 1 ? ` · Day ${day}` : "";
  const backTarget = S.batchReportFrom === "log" ? "log" : "setup";
  const backBtn = `<button class="btn-back" onclick="S.screen='${backTarget}';render()">← Back</button>`;

  if (S.batchReportLoading) {
    return `<div class="header"><h1>📄 Batch Report</h1><p>${esc(base)}${dayLbl}</p></div>
      <div class="card" style="text-align:center;padding:24px;color:#64748b;font-size:13px;">Loading…</div>
      <div class="nav-row no-print">${backBtn}</div>`;
  }
  if (S.batchReportError) {
    return `<div class="header"><h1>📄 Batch Report</h1><p>${esc(base)}${dayLbl}</p></div>
      <div class="card"><div class="alert">⚠ ${esc(S.batchReportError)} · <span style="text-decoration:underline;cursor:pointer;" onclick="openBatchReport('${esc(base)}',${day},'${backTarget}')">Retry</span></div></div>
      <div class="nav-row no-print">${backBtn}</div>`;
  }

  const rowsData = S.batchReportRows || [];
  if (!rowsData.length) {
    return `<div class="header"><h1>📄 Batch Report</h1><p>${esc(base)}${dayLbl}</p></div>
      <div class="card" style="text-align:center;padding:24px;color:#94a3b8;font-size:13px;">No submitted rounds found for this batch-day yet.</div>
      <div class="nav-row no-print">${backBtn}</div>`;
  }

  const byShift = {};
  rowsData.forEach(r => {
    const idx = ROUND_LABELS.indexOf(r["Shift / Sample"]);
    if (idx >= 0) byShift[idx] = r;
  });
  const first = rowsData[0];
  const product = PRODUCTS[first.Product];
  const procs = product ? buildProcesses(first.Product) : [];

  let totalNG = 0;
  const rowsHtml = procs.map((proc) => {
    if (proc.type === "braiding") {
      const n = product.braiding.machines;
      const ms = Array.from({length:n}, (_,i) => `BR-${String(i+1).padStart(2,"0")}`);
      const obsCells = ROUND_LABELS.map((_, i) => {
        const r = byShift[i];
        if (!r) return `<td>—</td>`;
        const detail = ms.map(m => r[`${m} O.D.`]).filter(Boolean).join("  ·  ");
        return `<td style="font-size:9px;">${esc(detail)||"—"}</td>`;
      }).join("");
      const jdgCells = ROUND_LABELS.map((_, i) => {
        const r = byShift[i];
        if (!r) return `<td>—</td>`;
        const vals = ms.map(m => r[`${m} O.D.`]).filter(Boolean);
        if (!vals.length) return `<td>—</td>`;
        const f = vals.filter(v => /FAIL|✗/.test(v)).length;
        const allNoRun = vals.every(v => v === "No Run");
        const cls = allNoRun ? "b-na" : f===0 ? "b-ok" : "b-ng";
        const lbl = allNoRun ? "No Run" : f===0 ? "OK" : "NG";
        if (f > 0) totalNG += f;
        return `<td><span class="badge ${cls}">${lbl}</span></td>`;
      }).join("");
      return `<tr class="first">
        <td style="font-weight:700;color:#1e3a5f;">070</td>
        <td>Wire Braiding</td><td>Wire Braiding</td>
        <td>O.D.</td><td>${esc(product.braiding.od)}</td><td>Vernier Caliper</td>
        ${obsCells}${jdgCells}
      </tr>`;
    }
    return proc.checks.map((c, ci) => {
      const obsCells = ROUND_LABELS.map((_, i) => {
        const r = byShift[i];
        const val = r ? vrSheetValue(r, proc.no, c.key) : null;
        return `<td>${esc(val||"—")}</td>`;
      }).join("");
      const jdgCells = ROUND_LABELS.map((_, i) => {
        const r = byShift[i];
        const val = r ? vrSheetValue(r, proc.no, c.key) : null;
        if (!val) return `<td>—</td>`;
        const j = vrJudge(val);
        if (j.lbl === "NG") totalNG++;
        return `<td><span class="badge ${j.cls}">${j.lbl}</span></td>`;
      }).join("");
      return `<tr ${ci===0?"class='first'":""}>
        <td ${ci===0?`style="font-weight:700;color:#1e3a5f;"`:""}>${ci===0?proc.no:""}</td>
        <td>${ci===0?esc(proc.machine):""}</td>
        <td>${ci===0?esc(proc.name):""}</td>
        <td>${esc(c.key)}</td><td>${esc(c.spec)}</td><td>${esc(c.method)}</td>
        ${obsCells}${jdgCells}
      </tr>`;
    }).join("");
  }).join("");

  const preparedBy = [...new Set(rowsData.map(r => r["Device ID"]).filter(Boolean))].join(", ") || "—";
  const verifiedBy = [...new Set(rowsData.map(r => r["Verified By"]).filter(Boolean))].join(", ") || "—";

  return `
    <div class="alert ${totalNG===0?"green":""}" style="margin-bottom:14px;">
      ${totalNG===0 ? `✅ All submitted checks OK so far` : `⚠ ${totalNG} check(s) flagged NG`}
      · ${rowsData.length} of ${ROUND_LABELS.length} shifts submitted
    </div>
    <div class="card">
      <div style="font-size:16px;font-weight:800;color:#1e3a5f;">INPROCESS INSPECTION REPORT</div>
      <div style="font-size:11px;color:#94a3b8;margin-bottom:14px;">Fmt. No.: F-QA-12 · Rev.01 · Eff. Date: 01.09.2026</div>
      <div class="report-meta">
        <div class="meta-item"><div class="meta-lbl">Product</div><div class="meta-val">${esc(first.Product)}</div></div>
        <div class="meta-item"><div class="meta-lbl">Batch No.</div><div class="meta-val">${esc(first["Batch No."]||base)}</div></div>
        <div class="meta-item"><div class="meta-lbl">Date</div><div class="meta-val">${esc(first.Date)}</div></div>
        <div class="meta-item"><div class="meta-lbl">Prepared By (Device ID)</div><div class="meta-val">${esc(preparedBy)}</div></div>
        <div class="meta-item"><div class="meta-lbl">Verified By</div><div class="meta-val">${esc(verifiedBy)}</div></div>
      </div>
      <div style="overflow-x:auto;">
        <table class="report-table">
          <thead><tr>
            <th rowspan="2">Proc.</th><th rowspan="2">Machine</th><th rowspan="2">Process</th>
            <th rowspan="2">Characteristic</th><th rowspan="2">Spec.</th><th rowspan="2">Method</th>
            <th colspan="${ROUND_LABELS.length}" style="text-align:center;">Observation</th>
            <th colspan="${ROUND_LABELS.length}" style="text-align:center;">OK / NG</th>
          </tr><tr>
            ${ROUND_LABELS.map(l=>`<th style="font-size:10px;font-weight:600;">${l}</th>`).join("")}
            ${ROUND_LABELS.map(l=>`<th style="font-size:10px;font-weight:600;">${l}</th>`).join("")}
          </tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>
    <div class="nav-row no-print">
      ${backBtn}
      <button class="btn-outline" onclick="window.print()">🖨 Print / Save PDF</button>
    </div>`;
}

async function runLogSearch() {
  const dateEl = document.getElementById("log-date");
  const productEl = document.getElementById("log-product");
  const searchEl = document.getElementById("log-search");
  S.logFilters = {
    date: dateEl ? dateEl.value : S.logFilters.date,
    product: productEl ? productEl.value : S.logFilters.product,
    search: searchEl ? searchEl.value.trim() : S.logFilters.search
  };
  S.logLoading = true; S.logError = ""; render();
  // Same cold-start exposure noted on refreshSheetBatches()/loadVrList() above — a search
  // with no filters set hits /api/log bare, so it gets the same bound.
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 20000);
  try {
    const params = new URLSearchParams();
    if (S.logFilters.date) params.set("date", S.logFilters.date);
    if (S.logFilters.product && PRODUCTS[S.logFilters.product]) params.set("product", PRODUCTS[S.logFilters.product].label);
    if (S.logFilters.search) params.set("search", S.logFilters.search);
    const res = await fetch(`/api/log?${params.toString()}`, { cache: "no-store", signal: controller.signal });
    const data = await res.json();
    if (!res.ok) {
      const msg = (data && data.error && (data.error.error?.message || data.error)) || "Search failed";
      throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
    }
    S.logResults = data;
  } catch (err) {
    S.logError = err.name === "AbortError" ? "Timed out reaching the Sheet (it may just be waking up) — try Search again." : err.message;
  } finally {
    clearTimeout(timer);
  }
  S.logLoading = false;
  render();
}

function esc(s) { return (s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

// ═══════════════════════════════════════════════
// VERIFY REPORTS — separate, PIN-gated, cross-device sign-off
// The preparer of a report must not be the one who verifies it. This flow works purely
// against the Google Sheet (via /api/log and /api/submit) so it works fine even when the
// verifier is on a completely different device than the operator who did the inspection.
// It writes ONLY to the "Verified By"/"Verified At" columns (appended after all data
// columns), so it can never collide with an operator's own in-progress row updates.
// ═══════════════════════════════════════════════
const VERIFY_PIN = "8396";

function openVerifyReports() {
  S.vrPin = ""; S.vrName = ""; S.vrRows = null; S.vrLoading = false; S.vrError = "";
  S.screen = "vrpin"; render();
}

function rVrPin() {
  return `
    <div class="header"><h1>🔒 Verify Reports</h1><p>Enter PIN to continue</p></div>
    <div class="card">
      <label>PIN</label>

        onkeydown="if(event.key==='Enter')checkVrPin()" placeholder="••••">
      <button class="btn-primary" onclick="checkVrPin()">Continue →</button>
      <button class="btn-outline" onclick="S.screen='setup';render()">← Back to Home</button>
    </div>`;
}
function checkVrPin() {
  const pin = document.getElementById("vr-pin").value;
  if (pin !== VERIFY_PIN) { alert("Incorrect PIN."); return; }
  S.screen = "vrname"; render();
}

function rVrName() {
  const opts = DEVICE_USERS.map(s => `<option value="${s}">${s}</option>`).join("");
  return `
    <div class="header"><h1>🔒 Verify Reports</h1><p>Who is verifying?</p></div>
    <div class="card">
      <label>Your Name</label>
      <select id="vr-name"><option value="">— Select name —</option>${opts}</select>
      <label>PIN</label>
      <input type="password" inputmode="numeric" id="vr-name-pin" placeholder="Your PIN"
        onkeydown="if(event.key==='Enter')chooseVrName()"
        style="width:100%;padding:13px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px;outline:none;">
      <button class="btn-primary" onclick="chooseVrName()">Continue →</button>
      <button class="btn-outline" onclick="S.screen='vrpin';render()">← Back</button>
    </div>`;
}
async function chooseVrName() {
  const name = document.getElementById("vr-name").value;
  const pin  = document.getElementById("vr-name-pin").value;
  if (!name) { alert("Please select your name."); return; }
  if (!pin)  { alert("Please enter your PIN."); return; }
  if (!(await verifyDevicePin(name, pin))) return;
  S.vrName = name;
  loadVrList();
}

async function loadVrList() {
  S.vrLoading = true; S.vrError = ""; render();
  // Same cold-start exposure as refreshSheetBatches() above — a slow/stuck first call to
  // /api/log after backend idle time left this stuck on "Loading…" with no way to tell it
  // needed a retry. Bounded to 20s for the same reason.
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 20000);
  try {
    const res = await fetch("/api/log", { cache: "no-store", signal: controller.signal });
    const data = await res.json();
    if (!res.ok) {
      const msg = (data && data.error && (data.error.error?.message || data.error)) || "Search failed";
      throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
    }
    // Actionable here means "there's new data beyond whatever was verified last time" —
    // NOT just "never verified at all". Verification is cumulative (see "Verified Thru
    // Process" / highestFilledProcess()): a row already verified through Process 030 that's
    // since gained Process 040-070 still needs another pass, just for the new part. A row
    // with nothing filled in yet, or with no new progress since its last verification,
    // doesn't need attention.
    S.vrRows = (data.rows || []).filter(r => {
      const highest = highestFilledProcess(r, r.Product);
      if (!highest) return false;
      return highest !== (r["Verified Thru Process"] || null);
    });
  } catch (err) {
    S.vrError = err.name === "AbortError" ? "Timed out reaching the Sheet (it may just be waking up) — tap Refresh." : err.message;
  } finally {
    clearTimeout(timer);
  }
  S.vrLoading = false;
  S.screen = "vrlist"; render();
}

function rVrList() {
  let bodyHtml;
  if (S.vrLoading) {
    bodyHtml = `<div style="text-align:center;padding:24px;color:#64748b;font-size:13px;">Loading…</div>`;
  } else if (S.vrError) {
    bodyHtml = `<div class="alert">⚠ ${esc(S.vrError)}</div>`;
  } else if (!S.vrRows || !S.vrRows.length) {
    bodyHtml = `<div style="text-align:center;padding:24px;color:#94a3b8;font-size:13px;">Nothing waiting on verification 🎉</div>`;
  } else {
    bodyHtml = S.vrRows.map(r => {
      // Self-verification is blocked by DEVICE, not by shop-floor Operator — "Operator" is
      // the OPERATORS-list worker who ran the process, which is a separate namespace from
      // the DEVICE_USERS person doing the preparing/verifying (see "Device ID" column).
      // Rishab (Admin) is exempt — see SELF_VERIFY_EXEMPT.
      const isOwn = S.vrName !== SELF_VERIFY_EXEMPT && r["Device ID"] && r["Device ID"] === S.vrName;
      const prevThru = r["Verified Thru Process"] || null;
      const progressNote = prevThru
        ? `Previously verified thru Process ${prevThru} — new progress since then`
        : "Not verified yet";
      return `<div class="ver-row">
        <div class="ver-info">
          <div class="sum-proc">${esc(r["Batch No."] || "—")} · ${esc(r.Product||"")}</div>
          <div class="sum-char">${esc(r.Date||"")} · ${esc(r["Shift / Sample"]||"")}</div>
          <div class="sum-obs">Prepared by ${esc(r["Device ID"]||r.Operator||"—")} · ${progressNote}${r["Finalised At"] ? "" : " · not yet finalised"}</div>
        </div>
        <button class="ver-btn" ${isOwn?"disabled":""} onclick="${isOwn?"":"openVrDetail("+r.__row+")"}">
          ${isOwn ? "Own work" : "Review →"}
        </button>
      </div>`;
    }).join("");
  }
  return `
    <div class="header"><h1>🔒 Verify Reports</h1><p>Signed in as ${esc(S.vrName)}</p></div>
    <div class="card">
      <button class="btn-outline" style="margin-bottom:10px;" onclick="loadVrList()">↻ Refresh</button>
      ${bodyHtml}
    </div>
    <button class="btn-outline" onclick="S.screen='setup';render()">← Back to Home</button>`;
}

// Opens the read-through checklist for one Sheet row — reconstructed entirely from the
// row's own column values (plus the shared, static PRODUCTS/buildProcesses spec data),
// since this device never had the operator's in-browser session state to begin with.
function openVrDetail(rowNum) {
  const row = (S.vrRows || []).find(r => r.__row === rowNum);
  if (!row) { alert("Row not found — try refreshing the list."); return; }
  if (S.vrName !== SELF_VERIFY_EXEMPT && row["Device ID"] && row["Device ID"] === S.vrName) {
    alert("You prepared this report — someone else needs to verify it.");
    return;
  }
  S.vrDetailRow = row;
  S.vrJustVerified = false;
  S.vrApprovals = {}; // per-process Approve/Not Approve state for THIS review pass — see rVrDetail()/setVrApproval()
  S.vrPhotosSeen = {}; // photo URLs the verifier has opened this pass — Approve stays locked until they have
  S.screen = "vrdetail";
  render();
  vrReadAllPhotos(row);
}

// ── Verifier photo review ──
// Every photo-bearing reading on a 🆕 New process is listed with the recorded value. The
// verifier must OPEN each photo before that process's Approve unlocks; a missing photo (on a
// reading that isn't No Run) blocks Approve too. Caliper photos are also read by the same
// vision service operators see (/api/readcaliper) and compared with the recorded band — a
// mismatch is flagged in red and approving it needs an explicit confirmation.
// Photo evidence is only enforced for rows dated on/after this day — older rows predate the
// mandatory-photo rule and would otherwise be un-approvable.
const PHOTO_RULE_FROM = "2026-10-14";
function vrProcPhotos(row, proc) {
  const out = [];
  const enforce = String(row.Date || "") >= PHOTO_RULE_FROM;
  if (proc.type === "braiding") {
    const n = (PRODUCTS[row.Product] || {braiding:{machines:0}}).braiding.machines;
    for (let i = 1; i <= n; i++) {
      const m = `BR-${String(i).padStart(2,"0")}`;
      const val = row[`${m} O.D.`];
      if (!val) continue;
      out.push({ label: m, url: logBraidPhoto(row, m), val, caliper: true, required: enforce && val !== "No Run" });
    }
    return out;
  }
  proc.checks.forEach(c => {
    if (!c.photo) return;
    const val = vrSheetValue(row, proc.no, c.key);
    const url = logPhotoValue(proc.no, c.key, row);
    if (!url && (val === null || val === "")) return;
    out.push({ label: c.key, url, val: val || "", caliper: c.method === "Vernier Caliper", required: enforce && val !== "No Run" });
  });
  return out;
}
function vrPhotoIssue(it) {
  if (!it.url) return it.required ? "Photo missing" : "";
  if (!it.caliper) return "";
  const r = (S.vrPhotoReads || {})[it.url];
  if (!r || r.pending || r.unavailable) return "";
  if (!r.readable || r.confidence === "low") return "Photo unreadable — check it by eye";
  const range = parseSelectedRange(it.val);
  if (!range) return "";
  const tol = 0.006;
  if (r.reading >= range.lo - tol && r.reading <= range.hi + tol) return "";
  return `Photo reads ${r.reading.toFixed(2)} but recorded ${it.val}`;
}
function vrProcReady(items) {
  return items.every(it => !it.required || (it.url && (S.vrPhotosSeen || {})[it.url]));
}
function vrMarkSeen(url) {
  if (!S.vrPhotosSeen) S.vrPhotosSeen = {};
  S.vrPhotosSeen[url] = true;
  setTimeout(render, 150); // after the new tab opens, so the Approve button unlocks when they return
}
function vrPhotoHtml(items) {
  if (!items.length) return "";
  const seen = S.vrPhotosSeen || {};
  const rowsHtml = items.map(it => {
    const issue = vrPhotoIssue(it);
    const read = it.url && it.caliper ? (S.vrPhotoReads || {})[it.url] : null;
    const link = it.url
      ? `<a href="${esc(it.url)}" target="_blank" rel="noopener" onclick="vrMarkSeen('${esc(it.url)}')" style="font-size:12px;font-weight:700;color:#2563eb;">${seen[it.url] ? "✓ Viewed" : "📷 Open photo"}</a>`
      : (it.required ? `<span style="font-size:12px;font-weight:700;color:#dc2626;">❌ Photo missing</span>` : `<span style="font-size:12px;color:#94a3b8;">No Run</span>`);
    const readTxt = read && read.pending ? ` <span style="font-size:11px;color:#64748b;">reading photo…</span>` : "";
    const warn = issue ? `<div style="font-size:12px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:4px 8px;margin-top:4px;">⚠ ${esc(issue)}</div>` : "";
    return `<div style="padding:4px 0;"><div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;"><span>${esc(it.label)} · ${esc(it.val || "—")}</span><span>${link}${readTxt}</span></div>${warn}</div>`;
  }).join("");
  return `<div style="margin-top:8px;border-top:1px dashed #d8b4fe;padding-top:6px;"><div style="font-size:11px;font-weight:700;color:#7c3aed;">PHOTO EVIDENCE — open each before approving</div>${rowsHtml}</div>`;
}
async function vrReadAllPhotos(row) {
  if (!S.vrPhotoReads) S.vrPhotoReads = {};
  const procs = PRODUCTS[row.Product] ? buildProcesses(row.Product) : [];
  const urls = [];
  procs.forEach(p => vrProcPhotos(row, p).forEach(it => { if (it.url && it.caliper && !S.vrPhotoReads[it.url]) urls.push(it.url); }));
  for (const url of urls) {
    S.vrPhotoReads[url] = { pending: true };
    render();
    try {
      const res = await fetch("/api/readcaliper", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ imageUrl: url }) });
      const data = await res.json();
      S.vrPhotoReads[url] = (res.ok && typeof data.readable === "boolean")
        ? { readable: data.readable, reading: data.reading, confidence: data.confidence }
        : { unavailable: true };
    } catch (e) { S.vrPhotoReads[url] = { unavailable: true }; }
    if (S.screen === "vrdetail") render();
  }
}

// Records the verifier's Approve/Not Approve choice for one process on the review screen.
// Keyed by process number, reset fresh every time a row is opened (see openVrDetail()) so a
// stale choice from a previous row's review can never leak into this one.
function setVrApproval(procNo, approved) {
  if (!S.vrApprovals) S.vrApprovals = {};
  if (approved) {
    const proc = buildProcesses(S.vrDetailRow.Product).find(p => p.no === procNo);
    const items = proc ? vrProcPhotos(S.vrDetailRow, proc) : [];
    if (!vrProcReady(items)) { alert("Open every photo for this process first (a missing photo can't be approved)."); return; }
    const issues = items.map(vrPhotoIssue).filter(Boolean);
    if (issues.length && !confirm("Photo check flagged:\n\n" + issues.join("\n") + "\n\nApprove anyway?")) return;
  }
  S.vrApprovals[procNo] = approved;
  render();
}

// Sheet column -> (process, check) mapping, mirroring buildSheetRow()'s g() calls — only
// these checks are captured in the current sheet schema; everything else shows as "—".
function vrSheetValue(row, procNo, checkKey) {
  if (procNo === "030" && checkKey === "Hardness")        return row["Hardness (P030)"] || "";
  if (procNo === "030" && checkKey === "Tensile")         return row["Tensile (P030)"] || "";
  if (procNo === "030" && checkKey === "Button Weight")   return row["Button Weight (P030)"] || "";
  if (procNo === "030" && checkKey === "TS2")             return row["TS2 (P030)"] || "";
  if (procNo === "030" && checkKey === "TC90")            return row["TC90 (P030)"] || "";
  if (procNo === "040" && checkKey === "O.D.")        return row["O.D. Measured"] || "";
  if (procNo === "040" && checkKey === "I.D.")        return row["I.D. Measured"] || "";
  if (procNo === "040" && checkKey === "Appearance")  return row["Appearance"] || "";
  if (procNo === "050" && checkKey === "Pressure")        return row["Pressure (P050)"] || "";
  if (procNo === "060" && checkKey === "Leakage")         return row["Leakage (P060)"] || "";
  if (procNo === "060" && checkKey === "Pressure")        return row["Pressure (P060)"] || "";
  if (procNo === "080" && checkKey === "O.D. (Ring Die)") return row["O.D. Ring Die (P080)"] || "";
  if (procNo === "080" && checkKey === "Wire Cut")        return row["Wire Cut (P080)"] || "";
  if (procNo === "080" && checkKey === "Appearance")      return row["Appearance (P080)"] || "";
  if (procNo === "090" && checkKey === "Length")      return row["Length"] || "";
  if (procNo === "090" && checkKey === "Wire Cut")    return row["Wire Cut"] || "";
  if (procNo === "090" && checkKey === "Appearance")  return row["Appearance (P090)"] || "";
  if (procNo === "100" && checkKey === "Assembly")        return row["Assembly (P100)"] || "";
  if (procNo === "120" && checkKey === "Crimp O.D.")  return row["Crimp O.D. Measured (P120)"] || "";
  if (procNo === "130" && checkKey === "Appearance")      return row["Appearance (P130)"] || "";
  // Process 120 gauge checks: the reading itself lives in its own column now (older rows only
  // have the photo column, which holds "No Run" when skipped).
  if (procNo === "120" && GAUGE_COL_BY_CHECK[checkKey]) {
    const v = String(row[GAUGE_COL_BY_CHECK[checkKey]] || "").trim();
    if (v) return v;
    const photoCol = { "Pressure Testing":"Pressure Testing Photo (P120)", "Fitting Load Test":"Fitting Load Test Photo (P120)", "Air Leakage":"Air Leakage Photo (P120)" }[checkKey];
    return row[photoCol] === "No Run" ? "No Run" : null;
  }
  return null; // not tracked in the sheet schema
}
function vrJudge(label) {
  if (!label) return { cls:"", lbl:"—" };
  if (label === "No Run") return { cls:"b-na", lbl:"No Run" };
  if (/FAIL|✗|Not Smooth/.test(label)) return { cls:"b-ng", lbl:"NG" };
  return { cls:"b-ok", lbl:"OK" };
}

// The highest process (by pipeline order, e.g. "070") that has ANY data filled in on this
// Sheet row. This is what "reached" means for both the V-XXX display and the progressive
// shift gate — processes are worked sequentially, so the last one with data is treated as
// the frontier. Returns null if the row has no tracked data at all yet.
function highestFilledProcess(row, productKey) {
  const product = PRODUCTS[productKey];
  if (!product) return null;
  const procs = buildProcesses(productKey);

  // Every process (030 through 130, plus braiding) now has its own tracked Sheet column —
  // see vrSheetValue() and buildBlockARow() — so scanning columns alone sees
  // partial, unfinalized progress on all of them, not just 040/090/120 as before. The
  // "Finalised At" short-circuit below is kept as a safety net for rows submitted before
  // this expansion (030/050/060/080/100/130 will permanently read blank on those older
  // rows even though the round genuinely finished) and is otherwise harmless going forward.
  if (row["Finalised At"]) return procs.length ? procs[procs.length - 1].no : null;

  let highest = null;
  procs.forEach(proc => {
    let hasData;
    if (proc.type === "braiding") {
      const n = product.braiding.machines;
      hasData = Array.from({length:n}, (_,i) => row[`BR-${String(i+1).padStart(2,"0")} O.D.`]).some(Boolean);
    } else {
      hasData = proc.checks.some(c => {
        const v = vrSheetValue(row, proc.no, c.key);
        return v !== null && v !== "";
      });
    }
    if (hasData) highest = proc.no;
  });
  return highest;
}

function rVrDetail() {
  const row = S.vrDetailRow;
  if (!row) return `<div class="header"><h1>🔒 Verify Reports</h1></div>
    <button class="btn-outline" onclick="S.screen='vrlist';render()">← Back</button>`;

  const product = PRODUCTS[row.Product];
  const procs = product ? buildProcesses(row.Product) : [];
  // Verification is cumulative — anything at or before this point was already signed off
  // on a previous pass; everything after it is new since then and is what this review is
  // actually for. See highestFilledProcess()/"Verified Thru Process".
  const prevThru = row["Verified Thru Process"] || null;
  const prevThruIdx = prevThru ? procs.findIndex(p => p.no === prevThru) : -1;
  if (!S.vrApprovals) S.vrApprovals = {};

  // Every process actually shown as 🆕 New (i.e. has something on this row to review) needs
  // an explicit Approve tap before verification is allowed — see the button block below.
  // Already-verified processes are just shown for reference; nothing to decide there.
  const newProcNos = [];

  const rows = procs.map((proc, procIdx) => {
    const isNew = procIdx > prevThruIdx;

    let detailHtml, hasData;
    if (proc.type === "braiding") {
      const n = product.braiding.machines;
      const vals = Array.from({length:n}, (_,i) => row[`BR-${String(i+1).padStart(2,"0")} O.D.`]).filter(Boolean);
      hasData = vals.length > 0;
      if (!hasData) {
        detailHtml = `<div class="ver-row" style="opacity:.55;">
          <div class="ver-info"><div class="sum-char">Wire Braiding</div></div>
          <span class="badge" style="background:#f1f5f9;color:#94a3b8;">—</span>
        </div>`;
      } else {
        const anyFail  = vals.some(v => /FAIL|✗/.test(v));
        const allNoRun = vals.every(v => v === "No Run");
        const cls = allNoRun ? "b-na" : anyFail ? "b-ng" : "b-ok";
        const lbl = allNoRun ? "No Run" : anyFail ? "NG" : "OK";
        detailHtml = `<div class="ver-row" style="${isNew?"":"opacity:.55;"}">
          <div class="ver-info">
            <div class="sum-char">Wire Braiding</div>
            <div class="sum-obs">${esc(vals.join(", "))}</div>
          </div>
          <span class="badge ${cls}">${lbl}</span>
        </div>`;
      }
    } else {
      // Only checks this sheet schema actually tracks (vrSheetValue returns non-null for
      // those) are worth showing at all. Separately — and this is the actual fix — a check
      // being TRACKED but blank (val === "") used to still count as "this process has
      // something to review", which let fully-untouched downstream processes (e.g. 100/120/
      // 130 on a batch only filled through 090) show up as "🆕 New" with live Approve/Not
      // Approve buttons. hasData now requires an actual non-empty value, matching the same
      // rule highestFilledProcess() already uses to decide what's really been "reached".
      const tracked = proc.checks.filter(c => vrSheetValue(row, proc.no, c.key) !== null);
      if (!tracked.length) return "";
      hasData = tracked.some(c => { const v = vrSheetValue(row, proc.no, c.key); return v !== null && v !== ""; });
      detailHtml = tracked.map(c => {
        const val = vrSheetValue(row, proc.no, c.key);
        const j = vrJudge(val);
        return `<div class="ver-row" style="${isNew?"":"opacity:.55;"}">
          <div class="ver-info">
            <div class="sum-char">${esc(c.key)}</div>
            <div class="sum-obs">Spec: ${esc(c.spec||"—")}</div>
          </div>
          <span class="badge ${j.cls}">${j.lbl} · ${esc(val||"—")}</span>
        </div>`;
      }).join("");
    }

    if (!isNew) {
      return `<div style="margin-bottom:10px;">
        <div class="sum-proc">Process ${proc.no} · ${esc(proc.machine)} <span class="badge b-na" style="opacity:.6;">✓ Already verified</span></div>
        ${detailHtml}
      </div>`;
    }

    if (!hasData) {
      // Visible so the verifier can see what's still pending, but there's nothing to
      // approve yet — doesn't get an Approve/Not Approve control and doesn't block
      // verifying whatever IS actually filled in (see canVerify below).
      return `<div style="margin-bottom:10px;opacity:.6;">
        <div class="sum-proc">Process ${proc.no} · ${esc(proc.machine)} <span class="badge" style="background:#f1f5f9;color:#94a3b8;">Not yet done</span></div>
        ${detailHtml}
      </div>`;
    }

    newProcNos.push(proc.no);
    const state = S.vrApprovals[proc.no]; // true = Approved, false = Not Approved, undefined = undecided
    const items = vrProcPhotos(row, proc);
    const ready = vrProcReady(items);
    const photoHtml = vrPhotoHtml(items);
    return `<div style="margin-bottom:10px;border:1px solid #e9d5ff;border-radius:10px;padding:10px 12px;background:#faf5ff;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
        <div class="sum-proc">Process ${proc.no} · ${esc(proc.machine)} <span class="badge b-na" style="background:#fff;color:#7c3aed;">🆕 New</span></div>
        <div style="display:flex;gap:6px;">
          <button type="button" ${ready ? "" : "disabled"} onclick="setVrApproval('${proc.no}', true)"
            style="${ready ? "" : "opacity:.45;cursor:not-allowed;"}padding:6px 12px;border-radius:8px;border:1.5px solid ${state===true?"#16a34a":"#cbd5e1"};background:${state===true?"#dcfce7":"#fff"};color:${state===true?"#15803d":"#475569"};font-size:12px;font-weight:700;cursor:pointer;">✓ Approve</button>
          <button type="button" onclick="setVrApproval('${proc.no}', false)"
            style="padding:6px 12px;border-radius:8px;border:1.5px solid ${state===false?"#dc2626":"#cbd5e1"};background:${state===false?"#fee2e2":"#fff"};color:${state===false?"#b91c1c":"#475569"};font-size:12px;font-weight:700;cursor:pointer;">✗ Not Approve</button>
        </div>
      </div>
      ${detailHtml}
      ${photoHtml}
    </div>`;
  }).join("");

  // Verifying is only allowed once every 🆕 New process above has been explicitly tapped
  // Approve — "Not Approve" and "undecided" both block it, same as we discussed: this is a
  // hard gate, not a partial/out-of-order verification (that would need a bigger data model
  // change, since "Verified Thru Process" is still a single cumulative high-water mark).
  const canVerify = newProcNos.length > 0 && newProcNos.every(no => S.vrApprovals[no] === true);

  const confirmBlock = S.vrJustVerified ? `
    <div class="alert green" style="margin-bottom:14px;">✅ Verified by <strong>${esc(S.vrName)}</strong> thru Process ${esc(row["Verified Thru Process"]||"—")} · ${esc(row["Verified At"]||"")}</div>
    <div class="nav-row no-print">
      <button class="btn-outline" onclick="window.print()">🖨 Print / Save PDF</button>
      <button class="btn-primary" style="margin-top:0;" onclick="S.screen='vrlist';loadVrList()">Done → Back to List</button>
    </div>` : `
    <div class="nav-row no-print">
      <button class="btn-back" onclick="S.screen='vrlist';render()">← Back</button>
      <button class="btn-next purple" ${canVerify ? "" : "disabled"}
        style="${canVerify ? "" : "opacity:.5;cursor:not-allowed;"}"
        onclick="verifyVrRow(${row.__row}, '${esc(row["Device ID"]||"")}')">✓ Verify Approved Progress</button>
    </div>
    ${newProcNos.length && !canVerify ? `<div style="font-size:12px;color:#7c3aed;text-align:center;margin-top:6px;">Tap "✓ Approve" on every 🆕 New process above before you can verify.</div>` : ""}`;

  return `
    <div class="header sup"><h1>🔍 Review Before Verifying</h1><p>${prevThru ? `Previously verified thru Process ${prevThru} — review the 🆕 New items below` : "Go through every entry, then verify"}</p></div>
    <div class="card">
      <div class="report-meta">
        <div class="meta-item"><div class="meta-lbl">Product</div><div class="meta-val">${esc(row.Product)}</div></div>
        <div class="meta-item"><div class="meta-lbl">Batch No.</div><div class="meta-val">${esc(row["Batch No."]||"—")}</div></div>
        <div class="meta-item"><div class="meta-lbl">Date</div><div class="meta-val">${esc(row.Date)}</div></div>
        <div class="meta-item"><div class="meta-lbl">Prepared By (Device ID)</div><div class="meta-val">${esc(row["Device ID"]||row.Operator||"—")}</div></div>
        <div class="meta-item"><div class="meta-lbl">Shift</div><div class="meta-val">${esc(row["Shift / Sample"])}</div></div>
        <div class="meta-item"><div class="meta-lbl">Finalised</div><div class="meta-val" style="font-size:12px;">${esc(row["Finalised At"]||"not yet")}</div></div>
        <div class="meta-item"><div class="meta-lbl">Verified By</div><div class="meta-val">${esc(row["Verified By"]||"—")}</div></div>
        <div class="meta-item"><div class="meta-lbl">Verified Device ID</div><div class="meta-val">${esc(row["Verified Device ID"]||"—")}</div></div>
      </div>
      ${rows || `<div style="text-align:center;padding:16px;color:#94a3b8;font-size:13px;">No tracked readings on this row yet.</div>`}
    </div>
    ${confirmBlock}`;
}

async function verifyVrRow(rowNum, deviceId) {
  if (S.vrName !== SELF_VERIFY_EXEMPT && deviceId && deviceId === S.vrName) {
    alert("You prepared this report — someone else needs to verify it.");
    return;
  }
  const row = S.vrDetailRow;
  if (!row) { alert("Row not found — try refreshing the list."); return; }
  try {
    const newThru = highestFilledProcess(row, row.Product);
    // Block B — Verified By, Verified At, Verified Device ID, Verified Thru Process — is
    // exactly 4 contiguous columns right after Block A (see SHEET_HEADERS), written here as
    // ONE atomic range. This used to be 2 separate requests (Verified By/At awaited, then
    // Verified Device ID and Verified Thru Process as unawaited fire-and-forget follow-ups
    // after render() had already moved the screen on) — the same class of race that was
    // silently dropping data on the operator side. One write, fully awaited before
    // vrJustVerified flips the screen, closes that gap here too.
    const startCol = colLetter(SHEET_DATA_COLS + 1); // "Verified By"
    const endCol   = colLetter(SHEET_DATA_COLS + 4); // "Verified Thru Process"
    const range = `${startCol}${rowNum}:${endCol}${rowNum}`;
    const verifiedAt = new Date().toLocaleString("en-IN");
    const res = await fetch("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: "update", range, rows: [[S.vrName, verifiedAt, S.vrName || "", newThru || ""]] })
    });
    const data = await res.json();
    if (!res.ok) {
      const msg = (data && data.error && (data.error.error?.message || data.error)) || "Verify failed";
      throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
    }

    S.vrRows = (S.vrRows || []).filter(r => r.__row !== rowNum);
    if (S.vrDetailRow) {
      S.vrDetailRow["Verified At"] = verifiedAt;
      S.vrDetailRow["Verified By"] = S.vrName;
      S.vrDetailRow["Verified Device ID"] = S.vrName;
      S.vrDetailRow["Verified Thru Process"] = newThru;
    }
    S.vrJustVerified = true;
    S.vrApprovals = {}; // this pass is done — a future re-open of this row starts clean
    render();
  } catch (err) {
    alert("Couldn't save verification: " + err.message);
  }
}

// ═══════════════════════════════════════════════
// RESUME PROMPT (shown once at boot if unfinished work is found)
// ═══════════════════════════════════════════════
function fmtSavedAt(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    return d.toLocaleString("en-IN", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" });
  } catch (e) { return iso; }
}

// An upload that was in flight when the tab died can never finish — its JS is gone — but its
// saved "uploading" status would otherwise show forever with nothing to tap. Photos are now
// compulsory, so turn those into a retryable "failed" state on resume.
function clearStaleUploads() {
  (S.roundData || []).forEach(rd => {
    [rd && rd.entries, rd && rd.braiding].forEach(group => {
      Object.values(group || {}).forEach(e => {
        if (e && e.photoStatus === "uploading") { e.photoStatus = "error"; e.photoError = "Interrupted"; }
        if (e && e.photoRead && e.photoRead.pending) delete e.photoRead;   // check was interrupted
      });
    });
  });
}

function resumeSession(saved) {
  S = saved;
  clearStaleUploads();
  render();
  if ((S.screen === "submitted" || S.screen === "report" || S.screen === "paused") && S.submitStatus !== "done") {
    submitToSheet();
  }
}
function discardSession() {
  clearState();
  render();
}

// ── Hardware / gesture Back guard ──
// Android's Back button and iOS's swipe-back navigate away from the entire page, and this
// app never pushed a history entry — so mid-inspection they unloaded everything in memory.
// The operator then landed on a fresh boot() whose "Discard & Start Fresh" button, or the
// Setup screen's "Begin Inspection", destroyed the session in one tap.
//
// We keep one spare history entry parked at all times and translate a Back press into the
// same in-app navigation the on-screen Back button performs, so the page itself is never
// left while there is work in flight. Screens absent from this map (setup, submitted,
// report) have nothing to protect: we don't re-park there, so a second press leaves
// normally and the operator can still close the tab or navigate away.
const BACK_TARGETS = {
  process:     () => navBack(),
  review:      () => { S.processIdx = buildProcesses(S.product).length - 1; S.screen = "process"; render(); },
  log:         () => { S.screen = "setup"; render(); },
  logdetail:   () => { S.screen = "log"; render(); },
  batchreport: () => { S.screen = S.batchReportFrom || "setup"; render(); },
  vrpin:       () => { S.screen = "setup"; render(); },
  vrname:      () => { S.screen = "vrpin"; render(); },
  vrlist:      () => { S.screen = "setup"; render(); },
  vrdetail:    () => { S.screen = "vrlist"; render(); },
  paused:      () => { S.screen = "setup"; render(); }
};

function parkHistoryEntry() {
  try { history.pushState({ fqa12: true }, ""); } catch (e) {}
}

function installBackGuard() {
  parkHistoryEntry();
  window.addEventListener("popstate", () => {
    const handler = BACK_TARGETS[S.screen];
    if (!handler) return;      // let the press through — nothing in flight on this screen
    parkHistoryEntry();        // re-park first, so the page is never actually left
    handler();
  });

  // A phone can background or kill this tab at any moment — incoming call, app switch, low
  // memory. pagehide and visibilitychange are the only events that fire reliably on mobile
  // for that (beforeunload does not), so flush on the way out.
  window.addEventListener("pagehide", saveState);
  document.addEventListener("visibilitychange", () => { if (document.hidden) saveState(); });
}

function boot() {
  installBackGuard();
  loadLiveProducts(); // fire-and-forget: upgrades PRODUCTS in place + re-renders when ready
  const saved = loadState();
  if (hasMeaningfulProgress(saved)) {
    window.__resumeData = saved;
    document.getElementById("app").innerHTML = `
      <div class="header">
        <h1>Unfinished Inspection Found</h1>
        <p>Konneckt Hoses \u00b7 Quality Control</p>
      </div>
      <div class="card">
        <div style="font-size:17px;font-weight:800;margin-bottom:4px;">Resume where you left off?</div>
        <div style="font-size:13px;color:#64748b;margin-bottom:16px;">
          ${saved.product ? `Product <strong>${saved.product}</strong> \u00b7 ` : ""}Last saved ${fmtSavedAt(saved.savedAt)}.
        </div>
        <button class="btn-primary" onclick="resumeSession(window.__resumeData)">Resume Inspection \u2192</button>
        <button class="btn-outline" onclick="discardSession()">Discard &amp; Start Fresh</button>
      </div>
      <div style="text-align:center;font-size:11px;color:#94a3b8;margin-top:4px;">F-QA-12 Rev.01 \u00b7 Eff. 01.09.2026</div>`;
  } else if (stateLoadCorrupted) {
    // This device had SOMETHING saved but it couldn't be read back \u2014 don't silently land on
    // a blank Setup screen as if nothing had happened (see loadState()). The Sheet itself is
    // very likely still fine: anything saved up through the last Pause/Review on this batch
    // already made it there independent of this device's local copy \u2014 "Continue Existing
    // Batch" on the next screen reads from the Sheet, not from what just failed to load here.
    render();
    document.getElementById("app").innerHTML = `
      <div class="alert" style="background:#fef2f2;color:#991b1b;border-color:#dc2626;">
        \u26a0 <strong>This device had saved progress that couldn't be read</strong> (it may have
        been interrupted while saving). Nothing on the Sheet is affected \u2014 if you were
        continuing a batch, use "\u21bb Continue Existing Batch" below to pick up from wherever it
        was last saved there.
      </div>` + document.getElementById("app").innerHTML;
  } else {
    render();
  }
}

boot();
</script>
</body>
