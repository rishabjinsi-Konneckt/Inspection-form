  if (S.batchReportError) {
    return `<div class="header"><h1>📄 Batch Report</h1><p>${esc(base)}${dayLbl}</p></div>
      <div class="card"><div class="alert">⚠ ${esc(S.batchReportError)} · <span style="text-decoration:underline;cursor:pointer;" onclick="openBatchReport('${esc(base)}',${day},'${backTarget}')">Retry</span></div></div>
      <div class="nav-row no-print">${backBtn}</div>`;
  }

  const rowsData = S.batchReportRows || [];
  if (!rowsData.length) {
    return `<div class="header"><h1>📄 Batch Report</h1><p>${esc(base)}${dayLbl}</p></div>
      <div class="card" style="text-align:center;padding:24px;color:#94a3b8;font-size:13px;">No submitted rounds found for this batch-day yet.</div>
      <div class="nav-row no-print">${backBtn}</div>`;
  }

  const byShift = {};
  rowsData.forEach(r => {
    const idx = ROUND_LABELS.indexOf(r["Shift / Sample"]);
    if (idx >= 0) byShift[idx] = r;
  });
  const first = rowsData[0];
  const product = PRODUCTS[first.Product];
  const procs = product ? buildProcesses(first.Product) : [];

  let totalNG = 0;
  const rowsHtml = procs.map((proc) => {
    if (proc.type === "braiding") {
      const n = product.braiding.machines;
      const ms = Array.from({length:n}, (_,i) => `BR-${String(i+1).padStart(2,"0")}`);
      const obsCells = ROUND_LABELS.map((_, i) => {
        const r = byShift[i];
        if (!r) return `<td>—</td>`;
        const detail = ms.map(m => r[`${m} O.D.`]).filter(Boolean).join("  ·  ");
        return `<td style="font-size:9px;">${esc(detail)||"—"}</td>`;
      }).join("");
      const jdgCells = ROUND_LABELS.map((_, i) => {
        const r = byShift[i];
        if (!r) return `<td>—</td>`;
        const vals = ms.map(m => r[`${m} O.D.`]).filter(Boolean);
        if (!vals.length) return `<td>—</td>`;
        const f = vals.filter(v => /FAIL|✗/.test(v)).length;
        const allNoRun = vals.every(v => v === "No Run");
        const cls = allNoRun ? "b-na" : f===0 ? "b-ok" : "b-ng";
        const lbl = allNoRun ? "No Run" : f===0 ? "OK" : "NG";
        if (f > 0) totalNG += f;
        return `<td><span class="badge ${cls}">${lbl}</span></td>`;
      }).join("");
      return `<tr class="first">
        <td style="font-weight:700;color:#1e3a5f;">070</td>
        <td>Wire Braiding</td><td>Wire Braiding</td>
        <td>O.D.</td><td>${esc(product.braiding.od)}</td><td>Vernier Caliper</td>
        ${obsCells}${jdgCells}
      </tr>`;
    }
    return proc.checks.map((c, ci) => {
      const obsCells = ROUND_LABELS.map((_, i) => {
        const r = byShift[i];
        const val = r ? vrSheetValue(r, proc.no, c.key) : null;
        return `<td>${esc(val||"—")}</td>`;
      }).join("");
      const jdgCells = ROUND_LABELS.map((_, i) => {
        const r = byShift[i];
        const val = r ? vrSheetValue(r, proc.no, c.key) : null;
        if (!val) return `<td>—</td>`;
        const j = vrJudge(val);
        if (j.lbl === "NG") totalNG++;
        return `<td><span class="badge ${j.cls}">${j.lbl}</span></td>`;
      }).join("");
      return `<tr ${ci===0?"class='first'":""}>
        <td ${ci===0?`style="font-weight:700;color:#1e3a5f;"`:""}>${ci===0?proc.no:""}</td>
        <td>${ci===0?esc(proc.machine):""}</td>
        <td>${ci===0?esc(proc.name):""}</td>
        <td>${esc(c.key)}</td><td>${esc(c.spec)}</td><td>${esc(c.method)}</td>
        ${obsCells}${jdgCells}
      </tr>`;
    }).join("");
  }).join("");

  const preparedBy = [...new Set(rowsData.map(r => r["Device ID"]).filter(Boolean))].join(", ") || "—";
  const verifiedBy = [...new Set(rowsData.map(r => r["Verified By"]).filter(Boolean))].join(", ") || "—";

  return `
    <div class="alert ${totalNG===0?"green":""}" style="margin-bottom:14px;">
      ${totalNG===0 ? `✅ All submitted checks OK so far` : `⚠ ${totalNG} check(s) flagged NG`}
      · ${rowsData.length} of ${ROUND_LABELS.length} shifts submitted
    </div>
    <div class="card">
      <div style="font-size:16px;font-weight:800;color:#1e3a5f;">INPROCESS INSPECTION REPORT</div>
      <div style="font-size:11px;color:#94a3b8;margin-bottom:14px;">Fmt. No.: F-QA-12 · Rev.01 · Eff. Date: 01.04.19</div>
      <div class="report-meta">
        <div class="meta-item"><div class="meta-lbl">Product</div><div class="meta-val">${esc(first.Product)}</div></div>
        <div class="meta-item"><div class="meta-lbl">Batch No.</div><div class="meta-val">${esc(first["Batch No."]||base)}</div></div>
        <div class="meta-item"><div class="meta-lbl">Date</div><div class="meta-val">${esc(first.Date)}</div></div>
        <div class="meta-item"><div class="meta-lbl">Prepared By (Device ID)</div><div class="meta-val">${esc(preparedBy)}</div></div>
        <div class="meta-item"><div class="meta-lbl">Verified By</div><div class="meta-val">${esc(verifiedBy)}</div></div>
      </div>
      <div style="overflow-x:auto;">
        <table class="report-table">
          <thead><tr>
            <th rowspan="2">Proc.</th><th rowspan="2">Machine</th><th rowspan="2">Process</th>
            <th rowspan="2">Characteristic</th><th rowspan="2">Spec.</th><th rowspan="2">Method</th>
            <th colspan="${ROUND_LABELS.length}" style="text-align:center;">Observation</th>
            <th colspan="${ROUND_LABELS.length}" style="text-align:center;">OK / NG</th>
          </tr><tr>
            ${ROUND_LABELS.map(l=>`<th style="font-size:10px;font-weight:600;">${l}</th>`).join("")}
            ${ROUND_LABELS.map(l=>`<th style="font-size:10px;font-weight:600;">${l}</th>`).join("")}
          </tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>
    <div class="nav-row no-print">
      ${backBtn}
      <button class="btn-outline" onclick="window.print()">🖨 Print / Save PDF</button>
    </div>`;
}

async function runLogSearch() {
  const dateEl = document.getElementById("log-date");
  const productEl = document.getElementById("log-product");
  const searchEl = document.getElementById("log-search");
  S.logFilters = {
    date: dateEl ? dateEl.value : S.logFilters.date,
    product: productEl ? productEl.value : S.logFilters.product,
    search: searchEl ? searchEl.value.trim() : S.logFilters.search
  };
  S.logLoading = true; S.logError = ""; render();
  // Same cold-start exposure noted on refreshSheetBatches()/loadVrList() above — a search
  // with no filters set hits /api/log bare, so it gets the same bound.
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 20000);
  try {
    const params = new URLSearchParams();
    if (S.logFilters.date) params.set("date", S.logFilters.date);
    if (S.logFilters.product && PRODUCTS[S.logFilters.product]) params.set("product", PRODUCTS[S.logFilters.product].label);
    if (S.logFilters.search) params.set("search", S.logFilters.search);
    const res = await fetch(`/api/log?${params.toString()}`, { signal: controller.signal });
    const data = await res.json();
    if (!res.ok) {
      const msg = (data && data.error && (data.error.error?.message || data.error)) || "Search failed";
      throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
    }
    S.logResults = data;
  } catch (err) {
    S.logError = err.name === "AbortError" ? "Timed out reaching the Sheet (it may just be waking up) — try Search again." : err.message;
  } finally {
    clearTimeout(timer);
  }
  S.logLoading = false;
  render();
}

function esc(s) { return (s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

// VERIFY REPORTS — separate, PIN-gated, cross-device sign-off
// The preparer of a report must not be the one who verifies it. This flow works purely
// against the Google Sheet (via /api/log and /api/submit) so it works fine even when the
// verifier is on a completely different device than the operator who did the inspection.
// It writes ONLY to the "Verified By"/"Verified At" columns (appended after all data
// columns), so it can never collide with an operator's own in-progress row updates.
// ═══════════════════════════════════════════════
const VERIFY_PIN = "8396";

function openVerifyReports() {
  S.vrPin = ""; S.vrName = ""; S.vrRows = null; S.vrLoading = false; S.vrError = "";

}

      <button class="btn-outline" onclick="S.screen='setup';render()">← Back to Home</button>

}
function checkVrPin() {

}

function rVrName() {

async function chooseVrName() {
  const name = document.getElementById("vr-name").value;
  const pin  = document.getElementById("vr-name-pin").value;
  if (!name) { alert("Please select your name."); return; }
  if (!pin)  { alert("Please enter your PIN."); return; }
  if (!(await verifyDevicePin(name, pin))) return;

  loadVrList();
}

async function loadVrList() {
  S.vrLoading = true; S.vrError = ""; render();
  // Same cold-start exposure as refreshSheetBatches() above — a slow/stuck first call to
  // /api/log after backend idle time left this stuck on "Loading…" with no way to tell it
  // needed a retry. Bounded to 20s for the same reason.
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 20000);
  try {
    const res = await fetch("/api/log", { signal: controller.signal });
    const data = await res.json();
    if (!res.ok) {
      const msg = (data && data.error && (data.error.error?.message || data.error)) || "Search failed";
      throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
    }
    // Actionable here means "there's new data beyond whatever was verified last time" —
    // NOT just "never verified at all". Verification is cumulative (see "Verified Thru
    // Process" / highestFilledProcess()): a row already verified through Process 030 that's
    // since gained Process 040-070 still needs another pass, just for the new part. A row
    // with nothing filled in yet, or with no new progress since its last verification,
    // doesn't need attention.
    S.vrRows = (data.rows || []).filter(r => {
      const highest = highestFilledProcess(r, r.Product);
      if (!highest) return false;
      return highest !== (r["Verified Thru Process"] || null);
    });
  } catch (err) {
    S.vrError = err.name === "AbortError" ? "Timed out reaching the Sheet (it may just be waking up) — tap Refresh." : err.message;
  } finally {
    clearTimeout(timer);
  }
  S.vrLoading = false;
  S.screen = "vrlist"; render();
}

function rVrList() {
  let bodyHtml;
  if (S.vrLoading) {
    bodyHtml = `<div style="text-align:center;padding:24px;color:#64748b;font-size:13px;">Loading…</div>`;
  } else if (S.vrError) {
    bodyHtml = `<div class="alert">⚠ ${esc(S.vrError)}</div>`;
  } else if (!S.vrRows || !S.vrRows.length) {
    bodyHtml = `<div style="text-align:center;padding:24px;color:#94a3b8;font-size:13px;">Nothing waiting on verification 🎉</div>`;
  } else {
    bodyHtml = S.vrRows.map(r => {
      // Self-verification is blocked by DEVICE, not by shop-floor Operator — "Operator" is
      // the OPERATORS-list worker who ran the process, which is a separate namespace from
      // the DEVICE_USERS person doing the preparing/verifying (see "Device ID" column).
      // Rishab (Admin) is exempt — see SELF_VERIFY_EXEMPT.
      const isOwn = S.vrName !== SELF_VERIFY_EXEMPT && r["Device ID"] && r["Device ID"] === S.vrName;
      const prevThru = r["Verified Thru Process"] || null;
      const progressNote = prevThru
        ? `Previously verified thru Process ${prevThru} — new progress since then`
        : "Not verified yet";
      return `<div class="ver-row">
        <div class="ver-info">
          <div class="sum-proc">${esc(r["Batch No."] || "—")} · ${esc(r.Product||"")}</div>
          <div class="sum-char">${esc(r.Date||"")} · ${esc(r["Shift / Sample"]||"")}</div>
          <div class="sum-obs">Prepared by ${esc(r["Device ID"]||r.Operator||"—")} · ${progressNote}${r["Finalised At"] ? "" : " · not yet finalised"}</div>
        </div>
        <button class="ver-btn" ${isOwn?"disabled":""} onclick="${isOwn?"":"openVrDetail("+r.__row+")"}">
          ${isOwn ? "Own work" : "Review →"}
        </button>
      </div>`;
    }).join("");
  }
  return `
    <div class="header"><h1>🔒 Verify Reports</h1><p>Signed in as ${esc(S.vrName)}</p></div>
    <div class="card">
      <button class="btn-outline" style="margin-bottom:10px;" onclick="loadVrList()">↻ Refresh</button>
      ${bodyHtml}
    </div>
    <button class="btn-outline" onclick="S.screen='setup';render()">← Back to Home</button>`;
}

// Opens the read-through checklist for one Sheet row — reconstructed entirely from the
// row's own column values (plus the shared, static PRODUCTS/buildProcesses spec data),
// since this device never had the operator's in-browser session state to begin with.
function openVrDetail(rowNum) {
  const row = (S.vrRows || []).find(r => r.__row === rowNum);
  if (!row) { alert("Row not found — try refreshing the list."); return; }
  if (S.vrName !== SELF_VERIFY_EXEMPT && row["Device ID"] && row["Device ID"] === S.vrName) {
    alert("You prepared this report — someone else needs to verify it.");
    return;
  }
  S.vrDetailRow = row;
  S.vrJustVerified = false;
  S.screen = "vrdetail";
  render();
}

// Sheet column -> (process, check) mapping, mirroring buildSheetRow()'s g() calls — only
// these checks are captured in the current sheet schema; everything else shows as "—".
function vrSheetValue(row, procNo, checkKey) {
  if (procNo === "040" && checkKey === "O.D.")        return row["O.D. Measured"] || "";
  if (procNo === "040" && checkKey === "I.D.")        return row["I.D. Measured"] || "";
  if (procNo === "040" && checkKey === "Appearance")  return row["Appearance"] || "";
  if (procNo === "090" && checkKey === "Length")      return row["Length"] || "";
  if (procNo === "090" && checkKey === "Wire Cut")    return row["Wire Cut"] || "";
  if (procNo === "090" && checkKey === "Appearance")  return row["Appearance (P090)"] || "";
  if (procNo === "120" && checkKey === "Crimp O.D.")  return row["Crimp O.D. Measured (P120)"] || "";
  return null; // not tracked in the sheet schema
}
function vrJudge(label) {
  if (!label) return { cls:"", lbl:"—" };
  if (label === "No Run") return { cls:"b-na", lbl:"No Run" };
  if (/FAIL|✗|Not Smooth/.test(label)) return { cls:"b-ng", lbl:"NG" };
  return { cls:"b-ok", lbl:"OK" };
}

// The highest process (by pipeline order, e.g. "070") that has ANY data filled in on this
// Sheet row. This is what "reached" means for both the V-XXX display and the progressive
// shift gate — processes are worked sequentially, so the last one with data is treated as
// the frontier. Returns null if the row has no tracked data at all yet.
function highestFilledProcess(row, productKey) {
  const product = PRODUCTS[productKey];
  if (!product) return null;
  const procs = buildProcesses(productKey);
  let highest = null;
  procs.forEach(proc => {
    let hasData;
    if (proc.type === "braiding") {
      const n = product.braiding.machines;
      hasData = Array.from({length:n}, (_,i) => row[`BR-${String(i+1).padStart(2,"0")} O.D.`]).some(Boolean);
    } else {
      hasData = proc.checks.some(c => {
        const v = vrSheetValue(row, proc.no, c.key);
        return v !== null && v !== "";
      });
    }
    if (hasData) highest = proc.no;
  });
  return highest;
}

function rVrDetail() {
  const row = S.vrDetailRow;
  if (!row) return `<div class="header"><h1>🔒 Verify Reports</h1></div>
    <button class="btn-outline" onclick="S.screen='vrlist';render()">← Back</button>`;

  const product = PRODUCTS[row.Product];
  const procs = product ? buildProcesses(row.Product) : [];
  // Verification is cumulative — anything at or before this point was already signed off
  // on a previous pass; everything after it is new since then and is what this review is
  // actually for. See highestFilledProcess()/"Verified Thru Process".
  const prevThru = row["Verified Thru Process"] || null;
  const prevThruIdx = prevThru ? procs.findIndex(p => p.no === prevThru) : -1;

  const rows = procs.map((proc, procIdx) => {
    const isNew = procIdx > prevThruIdx;
    const stageTag = isNew
      ? `<span class="badge b-na" style="background:#faf5ff;color:#7c3aed;">🆕 New</span>`
      : `<span class="badge b-na" style="opacity:.6;">✓ Already verified</span>`;
    if (proc.type === "braiding") {
      const n = product.braiding.machines;
      const vals = Array.from({length:n}, (_,i) => row[`BR-${String(i+1).padStart(2,"0")} O.D.`]).filter(Boolean);
      if (!vals.length) return "";
      const anyFail  = vals.some(v => /FAIL|✗/.test(v));
      const allNoRun = vals.every(v => v === "No Run");
      const cls = allNoRun ? "b-na" : anyFail ? "b-ng" : "b-ok";
      const lbl = allNoRun ? "No Run" : anyFail ? "NG" : "OK";
      return `<div class="ver-row" style="${isNew?"":"opacity:.55;"}">
        <div class="ver-info">
          <div class="sum-proc">Process ${proc.no} ${stageTag}</div>
          <div class="sum-char">Wire Braiding</div>
          <div class="sum-obs">${esc(vals.join(", "))}</div>
        </div>
        <span class="badge ${cls}">${lbl}</span>
      </div>`;
    }
    return proc.checks.map(c => {
      const val = vrSheetValue(row, proc.no, c.key);
      if (val === null) return "";
      const j = vrJudge(val);
      return `<div class="ver-row" style="${isNew?"":"opacity:.55;"}">
        <div class="ver-info">
          <div class="sum-proc">Process ${proc.no} · ${esc(proc.machine)} ${stageTag}</div>
          <div class="sum-char">${esc(c.key)}</div>
          <div class="sum-obs">Spec: ${esc(c.spec||"—")}</div>
        </div>
        <span class="badge ${j.cls}">${j.lbl} · ${esc(val||"—")}</span>
      </div>`;
    }).join("");
  }).join("");

  const confirmBlock = S.vrJustVerified ? `
    <div class="alert green" style="margin-bottom:14px;">✅ Verified by <strong>${esc(S.vrName)}</strong> thru Process ${esc(row["Verified Thru Process"]||"—")} · ${esc(row["Verified At"]||"")}</div>
    <div class="nav-row no-print">
      <button class="btn-outline" onclick="window.print()">🖨 Print / Save PDF</button>
      <button class="btn-primary" style="margin-top:0;" onclick="S.screen='vrlist';loadVrList()">Done → Back to List</button>
    </div>` : `
    <div class="nav-row no-print">
      <button class="btn-back" onclick="S.screen='vrlist';render()">← Back</button>
      <button class="btn-next purple" onclick="verifyVrRow(${row.__row}, '${esc(row["Device ID"]||"")}')">✓ Verify New Progress</button>
    </div>`;

  return `
    <div class="header sup"><h1>🔍 Review Before Verifying</h1><p>${prevThru ? `Previously verified thru Process ${prevThru} — review the 🆕 New items below` : "Go through every entry, then verify"}</p></div>
    <div class="card">
      <div class="report-meta">
        <div class="meta-item"><div class="meta-lbl">Product</div><div class="meta-val">${esc(row.Product)}</div></div>
        <div class="meta-item"><div class="meta-lbl">Batch No.</div><div class="meta-val">${esc(row["Batch No."]||"—")}</div></div>
        <div class="meta-item"><div class="meta-lbl">Date</div><div class="meta-val">${esc(row.Date)}</div></div>
        <div class="meta-item"><div class="meta-lbl">Prepared By (Device ID)</div><div class="meta-val">${esc(row["Device ID"]||row.Operator||"—")}</div></div>
        <div class="meta-item"><div class="meta-lbl">Shift</div><div class="meta-val">${esc(row["Shift / Sample"])}</div></div>
        <div class="meta-item"><div class="meta-lbl">Finalised</div><div class="meta-val" style="font-size:12px;">${esc(row["Finalised At"]||"not yet")}</div></div>
      </div>
      ${rows || `<div style="text-align:center;padding:16px;color:#94a3b8;font-size:13px;">No tracked readings on this row yet.</div>`}
    </div>
    ${confirmBlock}`;
}

async function verifyVrRow(rowNum, deviceId) {
  if (S.vrName !== SELF_VERIFY_EXEMPT && deviceId && deviceId === S.vrName) {
    alert("You prepared this report — someone else needs to verify it.");
    return;
  }
  const row = S.vrDetailRow;
  if (!row) { alert("Row not found — try refreshing the list."); return; }
  try {
    const newThru = highestFilledProcess(row, row.Product);
    const startCol = colLetter(SHEET_DATA_COLS + 1); // "Verified By"
    const endCol   = colLetter(SHEET_DATA_COLS + 2); // "Verified At"
    const range = `${startCol}${rowNum}:${endCol}${rowNum}`;
    const verifiedAt = new Date().toLocaleString("en-IN");
    const res = await fetch("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: "update", range, rows: [[S.vrName, verifiedAt]] })
    });
    const data = await res.json();
    if (!res.ok) {
      const msg = (data && data.error && (data.error.error?.message || data.error)) || "Verify failed";
      throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
    }
    S.vrRows = (S.vrRows || []).filter(r => r.__row !== rowNum);
    if (S.vrDetailRow) {
      S.vrDetailRow["Verified At"] = verifiedAt;
      S.vrDetailRow["Verified Thru Process"] = newThru;
    }
    S.vrJustVerified = true;
    render();

    // Stamp which device verified this row — kept in its OWN column, never sharing a range
    // with the operator's Device ID above, so verifying a row can never overwrite the
    // record of which device originally prepared it. Best-effort, same as the operator-side
    // stamp: never allowed to fail the actual verification.
    const verifierDeviceCol = colLetter(SHEET_DATA_COLS + 4);
    fetch("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      keepalive: true,
      body: JSON.stringify({ mode: "update", range: `${verifierDeviceCol}${rowNum}:${verifierDeviceCol}${rowNum}`, rows: [[S.vrName || ""]] })
    }).catch(() => {});

    // Extend the cumulative "Verified Thru Process" high-water mark — its own isolated
    // column, best-effort, same pattern as above.
    if (newThru) {
      const verifiedThruCol = colLetter(SHEET_DATA_COLS + 23);
      fetch("/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        keepalive: true,
        body: JSON.stringify({ mode: "update", range: `${verifiedThruCol}${rowNum}:${verifiedThruCol}${rowNum}`, rows: [[newThru]] })
      }).catch(() => {});
    }
  } catch (err) {
    alert("Couldn't save verification: " + err.message);
  }
}

// ═══════════════════════════════════════════════
// RESUME PROMPT (shown once at boot if unfinished work is found)
// ═══════════════════════════════════════════════
function fmtSavedAt(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    return d.toLocaleString("en-IN", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" });
  } catch (e) { return iso; }
}

function resumeSession(saved) {
  S = saved;
  render();
  if ((S.screen === "submitted" || S.screen === "report" || S.screen === "paused") && S.submitStatus !== "done") {
    submitToSheet();
  }
}
function discardSession() {
  clearState();
  render();
}

function boot() {
  const saved = loadState();
  if (hasMeaningfulProgress(saved)) {
    window.__resumeData = saved;
    document.getElementById("app").innerHTML = `
      <div class="header">
        <h1>Unfinished Inspection Found</h1>
        <p>Konneckt Hoses \u00b7 Quality Control</p>
      </div>
      <div class="card">
        <div style="font-size:17px;font-weight:800;margin-bottom:4px;">Resume where you left off?</div>
        <div style="font-size:13px;color:#64748b;margin-bottom:16px;">
          ${saved.product ? `Product <strong>${saved.product}</strong> \u00b7 ` : ""}Last saved ${fmtSavedAt(saved.savedAt)}.
        </div>
        <button class="btn-primary" onclick="resumeSession(window.__resumeData)">Resume Inspection \u2192</button>
        <button class="btn-outline" onclick="discardSession()">Discard &amp; Start Fresh</button>
      </div>
      <div style="text-align:center;font-size:11px;color:#94a3b8;margin-top:4px;">F-QA-12 Rev.01 \u00b7 Eff. 01.04.19</div>`;
  } else {
    render();
  }
}

boot();
</script>
