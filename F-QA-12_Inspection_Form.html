      <div style="font-size:12px;color:#64748b;margin-bottom:10px;">Pick a batch worked on a previous day, then select Prepared By, PIN, and Shift above before continuing. This list includes batches worked on any device.</div>
      ${S.sheetBatchRegError ? `<div class="alert" style="font-size:12px;">⚠ Couldn't sync with the Sheet: ${esc(S.sheetBatchRegError)} — showing only what's known on this device. <span style="text-decoration:underline;cursor:pointer;" onclick="refreshSheetBatches()">Retry</span></div>` : ""}
      <label style="margin-top:0;">Search</label>
      <input type="text" placeholder="Search by batch number or product…"
        value="${(S.batchSearch||"").replace(/"/g,"&quot;")}"
        onchange="S.batchSearch=this.value;render()"
        style="width:100%;padding:11px 13px;border:2px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;margin-bottom:10px;">
      <div class="batch-card-list">
        ${contCards || `<div style="text-align:center;font-size:12px;color:#94a3b8;padding:10px 0;">No batches match your search.</div>`}
      </div>
      <button class="btn-outline" style="background:#fff7ed;color:#c2410c;border-color:#f97316;" onclick="continueBatchClicked()">↻ Continue This Batch →</button>
      <button class="btn-outline" style="background:#eff6ff;color:#1d4ed8;border-color:#2563eb;" onclick="viewBatchReportClicked()">📄 View Full Report (All Shifts)</button>
      <button class="btn-outline" style="background:#f1f5f9;color:#334155;border-color:#94a3b8;" onclick="closeBatchClicked()">🔒 Close Batch — Admin only</button>
    </div>` : (S.sheetBatchRegLoading ? `<div style="text-align:center;font-size:12px;color:#94a3b8;margin-top:4px;">Checking for batches from other devices…</div>` : "")}
    ${closedBatchesHtml()}
    <div style="text-align:center;font-size:11px;color:#94a3b8;margin-top:4px;">F-QA-12 Rev.01 · Eff. 01.09.2026</div>`;
}

// Buttons call these instead of startInspection()/continueBatch() directly — PIN check
// happens first, and only on success do we fall through to the real flow. Kept as thin
// wrappers so startInspection()/continueBatch() themselves stay synchronous and unchanged.
async function beginInspectionClicked() {
  const name = document.getElementById("s-op").value;
  const pin  = document.getElementById("s-pin").value;
  if (!name) { alert("Please select who's using this device (Prepared By)."); return; }
  if (!pin)  { alert("Please enter your PIN."); return; }
  if (!(await verifyDevicePin(name, pin))) return;
  try { localStorage.setItem(LAST_DEVICE_USER_KEY, name); } catch (e) {}
  startInspection();
}
async function continueBatchClicked() {
  const name = document.getElementById("s-op").value;
  const pin  = document.getElementById("s-pin").value;
  if (!name) { alert("Please select who's using this device (Prepared By)."); return; }
  if (!pin)  { alert("Please enter your PIN."); return; }
  if (!(await verifyDevicePin(name, pin))) return;
  try { localStorage.setItem(LAST_DEVICE_USER_KEY, name); } catch (e) {}
  try {
    // This device may not know the batch's product yet (stale/failed product list) — refresh
    // it first instead of failing silently.
    const info = mergedBatchRegistry()[S.selectedBatch];
    if (info && info.product && !(await ensureProductKnown(info.product))) {
      alert(`This device doesn't have the product "${info.product}" in its product list yet. Check the internet connection, refresh the page, and try again. If it still fails, ask the admin to check the Products tab.`);
      return;
    }
    continueBatch();
  } catch (e) {
    console.error("continueBatch failed:", e);
    alert("Couldn't continue this batch: " + (e && e.message ? e.message : e) + "\n\nPlease refresh the page and try again. If it keeps happening, tell the admin.");
  }
}

function startInspection() {
  // This function resets S.roundData (below), and render() then persists that reset over
  // the localStorage backup — so a stray tap on "Begin Inspection" while an inspection was
  // still live destroyed every recorded reading, irrecoverably. The batch-already-exists
  // confirm() further down does NOT cover this: registerBatchDay() only runs at
  // pause/submit/finalise time, so an in-progress batch isn't in the registry yet and that
  // branch is skipped entirely. navBack() now refuses to strand an operator here, but this
  // is the authoritative guard — nothing gets wiped without an explicit yes.
  const inProgress = recordedReadingCount();
  if (inProgress > 0 && !confirm(
    `WARNING — an inspection is already in progress with ${inProgress} recorded reading${inProgress === 1 ? "" : "s"}.\n\n` +
    `Starting a new inspection will PERMANENTLY DELETE ${inProgress === 1 ? "it" : "them"}. This cannot be undone.\n\n` +
    `To keep your work, press Cancel and use "⏸ Save Progress & Continue Later" instead.\n\n` +
    `Press OK only if you are sure you want to discard it.`
  )) return;

  S.product  = document.getElementById("s-product").value;
  S.date     = document.getElementById("s-date").value;
  S.operator = document.getElementById("s-op").value;
  if (!S.product)  { alert("Please select a product."); return; }
  if (!S.operator) { alert("Please select an operator."); return; }

  const gateBase = genBatchBase(S.date, PRODUCTS[S.product].label);
  const registry = mergedBatchRegistry();
  let finalBase = gateBase;

  if (registry[gateBase]) {
    // A batch already exists today for this exact product+date. That's normal if you're
    // resuming your own work-in-progress — but that should go through "Continue Existing
    // Batch" below, which is the only path that safely resumes a round. Landing here means
    // either a genuinely separate run (different customer/order sharing the same date and
    // product) or someone forgetting to use Continue — ask, since silently reusing the same
    // Batch No. would overwrite whatever's already saved under it.
    const isSeparateRun = confirm(
      `A batch for ${PRODUCTS[S.product].label} on ${S.date} already exists (${gateBase}).\n\n` +
      `Press OK if this is a SEPARATE run — a different customer or order — it'll be saved ` +
      `as its own new batch (${gateBase}-A, -B, …).\n\n` +
      `Press Cancel if you meant to continue that existing batch — use "Continue Existing ` +
      `Batch" below instead.`
    );
    if (!isSeparateRun) return;
    const suffix = nextBatchSuffix(gateBase, registry);
    if (!suffix) { alert("Too many separate runs for this product today — please contact an admin."); return; }
    finalBase = `${gateBase}-${suffix}`;
    // A brand-new run always starts fresh, regardless of whatever shift happened to be
    // selected before this prompt fired.
    S.shift = ROUND_LABELS[0];
    S.currentRound = 0;
  } else {
    // Defense in depth: the Setup screen's shift buttons already disable everything except
    // Approval Sample until it's been at least partially verified — this re-checks the rule
    // authoritatively regardless of UI state, since Approval Sample must come first for
    // every product. (A brand-new batch has nothing verified yet, so this always blocks —
    // matches today's behavior exactly for that case.)
    if (ROUND_LABELS.indexOf(S.shift) !== 0) {
      alert("Approval Sample must be verified (at least partially) for this batch before any other shift can be started.");
      return;
    }
  }

  S.batchBase = finalBase;
  S.batchDay  = 1;
  S.batchNo   = S.batchBase;
  S.reportedThroughIdx = 0;
  S.dayRowNum = null;
  S.processIdx = 0;
  S.currentRound = Math.max(0, ROUND_LABELS.indexOf(S.shift));
  S.procOperators = {};
  S.roundData = ROUND_LABELS.map(() => emptyRound());
  S.activeBraid = null; S.verified = {};
  S.screen = "process"; render();
}

// Continuing a batch picks up exactly where that SHIFT (= round) left off — process
// progress for that round carries forward (nothing is wiped). Which round is "active" is
// entirely determined by whichever Shift button is selected here, not by an in-app tab.
function continueBatch() {
  const base = S.selectedBatch;
  if (!base) { alert("Please select a batch to continue."); return; }
  const op = document.getElementById("s-op").value;
  if (!op) { alert("Please select an operator (Prepared By)."); return; }
  const reg  = mergedBatchRegistry();
  const info = reg[base];
  if (!info) { alert("Batch not found."); return; }

  const roundIdx  = Math.max(0, ROUND_LABELS.indexOf(S.shift));
  const rounds    = info.rounds || {};
  const roundInfo = rounds[roundIdx];

  const approvalVerified = !!(rounds[0] && rounds[0].verifiedThru);
  if (roundIdx !== 0 && !approvalVerified) {
    alert("Approval Sample must be verified (at least partially) for this batch before other shifts can be continued.");
    return;
  }

  // Defense in depth for the Setup screen's shift-button lock above (findBlockingRound()) —
  // re-checked authoritatively here regardless of UI state. Only blocks starting a round
  // that's NEVER been touched on this batch; resuming an already-started round (even the
  // blocking one itself) is always allowed.
  const blocking = findBlockingRound(info);
  if (!roundInfo && blocking && blocking.idx !== roundIdx) {
    alert(`${blocking.label} used "No Run" on this batch and hasn't been fully verified yet. Please get it verified in Verify Reports before starting a new shift.`);
    return;
  }

  const todayStr = today();

  // A round finalised on an EARLIER day isn't locked forever — see sheetRoundSummary(),
  // which now only looks at the most recent row. Only block reopening it if it was
  // finalised specifically TODAY (nothing left to do, and reopening risks overwriting an
  // already-signed-off row). A round finalised on a past day, selected again on a genuinely
  // new day, starts a brand-new pass at that same shift instead — see startingFreshDay below.
  const finalisedToday = !!(roundInfo && roundInfo.complete && roundInfo.lastDate === todayStr);
  if (finalisedToday) {
    alert(`The "${S.shift}" shift for batch ${base} is already finalised for today.`);
    return;
  }
  const startingFreshDay = !!(roundInfo && roundInfo.complete && roundInfo.lastDate !== todayStr);

  const batchSameDay = info.lastDate === todayStr;

  S.product   = info.product;
  S.operator  = op;
  S.date      = todayStr;
  S.batchBase = base;
  S.batchDay  = batchSameDay ? info.lastDay : info.lastDay + 1;
  S.batchNo   = S.batchDay <= 1 ? base : `${base}-${S.batchDay}`;
  S.currentRound = roundIdx;

  if (startingFreshDay) {
    // The previous day's pass at this shift is done and already signed off — this is a new,
    // independent inspection for it, not a resume. Clear out any of THIS round's data still
    // sitting in memory/localStorage from that earlier finalised day (on this same device)
    // so old answers can't silently pre-fill what's supposed to be a fresh day's readings.
    // Start at Process 1, and never touch the old row — a new row gets appended once this
    // saves, same as any other new day of an existing batch.
    S.roundData[roundIdx] = emptyRound();
    S.processIdx = 0;
    S.reportedThroughIdx = 0;
    S.dayRowNum = null;
  } else if (roundInfo && !roundInfo.knownLocally && roundInfo.sheetRows && roundInfo.sheetRows.length) {
    // This device has never worked on this round — there's no local resume point, but the
    // Sheet already has whatever was captured for it from wherever it WAS worked on. Rebuild
    // that into this round's entries and resume right after the last process it covers.
    //
    // Only TODAY's row(s) for this round go into hydration — not every historical day's row.
    // roundInfo.sheetRows spans every day this round was ever worked; reaching back into an
    // earlier, already-finished day's row here silently carried that day's actual readings
    // (e.g. a completed braiding pass) into today's fresh pass for any check today's own row
    // hasn't reached yet — making unfinished work look already done, with nothing matching
    // in the Sheet to back it up. A round that's genuinely fresh today (no today's row yet)
    // hydrates nothing and starts blank, same as any other new day.
    const todaysSheetRows = roundInfo.sheetRows.filter(r => r.Date === todayStr);
    if (todaysSheetRows.length) hydrateRoundFromSheetRows(roundIdx, todaysSheetRows, info.product);
    const procs = buildProcesses(info.product);
    let resumeIdx = procs.findIndex(p => !isProcDone(p));
    if (resumeIdx < 0) resumeIdx = procs.length - 1;
    S.processIdx = resumeIdx;
    S.reportedThroughIdx = resumeIdx;
    const todaysRow = todaysSheetRows[todaysSheetRows.length - 1] || null;
    S.dayRowNum = todaysRow ? todaysRow.__row : null;
  } else if (roundInfo) {
    const roundSameDay = roundInfo.lastDate === todayStr;
    S.processIdx = roundInfo.resumeIdx || 0;
    S.reportedThroughIdx = roundSameDay ? (roundInfo.dayStartIdx || 0) : (roundInfo.resumeIdx || 0);
    S.dayRowNum = roundSameDay ? (roundInfo.rowNum || null) : null;
  } else {
    // fresh round within an existing batch — never touched before
    S.processIdx = 0;
    S.reportedThroughIdx = 0;
    S.dayRowNum = null;
  }
  S.activeBraid = null;
  // A remembered resume point can sit past the end of this product's process list (the last
  // process was already completed, or the product's process list changed since it was saved).
  // Keep it inside the list so the Process screen always has a process to show.
  {
    const lastIdx = Math.max(0, buildProcesses(S.product).length - 1);
    S.processIdx = Math.min(Math.max(parseInt(S.processIdx, 10) || 0, 0), lastIdx);
    S.reportedThroughIdx = Math.min(Math.max(parseInt(S.reportedThroughIdx, 10) || 0, 0), lastIdx);
  }
  // procOperators / roundData / verified intentionally NOT reset — progress continues.
  S.screen = "process"; render();
}

// ═══════════════════════════════════════════════
// SCREEN 2 — PROCESS
// ═══════════════════════════════════════════════
function rProcess() {
  const procs = buildProcesses(S.product);
  if (!(S.processIdx >= 0 && S.processIdx < procs.length)) S.processIdx = Math.max(0, Math.min(parseInt(S.processIdx, 10) || 0, procs.length - 1));
  const proc  = procs[S.processIdx];
  const total = procs.length;
  const pct   = Math.round((S.processIdx / total) * 100);
  const hasOp = !!S.procOperators[proc.no];
  const done  = hasOp && isProcDone(proc);

  const body = proc.type === "braiding" ? rBraiding(proc) : rChecks(proc);

  // No Run unlocks two ways: continuing an existing batch on a later day (the original
  // rule), or — new — a non-Approval-Sample shift on day 1 itself once Approval Sample has
  // already been verified through this exact process today. See approvalClearedThruProcess().
  const canNoRun = (S.batchDay > 1 || approvalClearedThruProcess(proc.no)) && hasOp && !done;

  // Non-Approval-Sample shifts are capped at wherever Approval Sample's verification
  // currently stands — surface that here so it's not a surprise when "Next" gets blocked.
  const capNote = S.currentRound !== 0 ? (() => {
    const capNo = approvalSampleVerifiedThru();
    return capNo
      ? `<div style="font-size:12px;color:#7c3aed;background:#faf5ff;border:1px solid #e9d5ff;border-radius:8px;padding:8px 12px;margin-bottom:12px;">🔒 This shift is capped at Process ${capNo} — Approval Sample's currently verified point.</div>`
      : `<div style="font-size:12px;color:#c2410c;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:8px 12px;margin-bottom:12px;">🔒 Approval Sample hasn't been verified yet today — this shift can't proceed past this point until it is.</div>`;
  })() : "";

  return `
    <div class="header">
      <h1>Process ${proc.no} · ${proc.name}</h1>
      <p>${PRODUCTS[S.product].label} · ${S.date} · ${S.shift}${S.batchNo?` · Batch ${S.batchNo}`:""}</p>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="step-label">Step ${S.processIdx+1} of ${total}</div>
    </div>
    ${capNote}
    <div class="card">
      <span class="proc-badge">Process ${proc.no}</span>
      <div class="proc-title">${proc.name}</div>
      <div class="proc-machine">${proc.machine}</div>
      <hr class="proc-divider">
      <label style="margin-top:0;">Operator</label>
      <select id="proc-op" onchange="S.procOperators['${proc.no}']=this.value;render()">
        <option value="">— Select operator —</option>
        ${OPERATORS.map(o => `<option value="${o}" ${S.procOperators[proc.no]===o?"selected":""}>${o}</option>`).join("")}
      </select>
      ${hasOp ? `
      <hr class="proc-divider">
      ${body}
      ` : `
      <div class="alert" style="margin-top:14px;">⚠  Select an operator to begin this process.</div>
      `}
    </div>
    ${hasOp && !done ? `<div class="alert">⚠  Complete all checks to continue.</div>` : ""}
    <div class="nav-row no-print">
      <button class="btn-back" onclick="navBack()">← Back</button>
      ${canNoRun ? `<button class="btn-outline" style="width:auto;flex:1.8;margin-top:0;padding:15px 6px;font-size:12px;background:#f8fafc;color:#64748b;border-color:#cbd5e1;" onclick="markProcessNoRun()">⊘ No Run — Didn't Run Today</button>` : ""}
      <button class="btn-next" onclick="navNext()" ${done?"":"disabled"}>
        ${S.processIdx===total-1?"Review All →":"Next →"}
      </button>
    </div>
    <button class="btn-outline no-print" style="background:#fefce8;color:#854d0e;border-color:#eab308;margin-top:10px;" onclick="pauseBatch()">⏸ Save Progress &amp; Continue Later</button>
    <div style="text-align:center;font-size:11px;color:#94a3b8;margin-top:8px;">
      ${S.savedAt ? `&#10003; Saved on this device automatically &middot; ${new Date(S.savedAt).toLocaleTimeString("en-IN", { hour:"2-digit", minute:"2-digit" })}` : ""}
    </div>`;
}

// ── normal checks ──
function rChecks(proc) {
  return proc.checks.map(c => {
    const key      = pkey(proc.no, c.key);
    const e        = curEntries()[key];
    const complete = isCheckDone(c, key);
    const cls      = complete ? (e.result==="PASS" ? "done-pass" : e.result==="NO_RUN" ? "done-na" : "done-fail") : "";

    let body = "";
    if (c.type === "pf") {
      body = `
        <div class="pf-row">
          <button class="pf-btn ${e?.result==="PASS"?"s-pass":""}"
            onclick="recordPF('${key}','PASS','${esc(c.passLabel)}')">✓ ${c.passLabel}</button>
          <button class="pf-btn ${e?.result==="FAIL"?"s-fail":""}"
            onclick="recordPF('${key}','FAIL','${esc(c.failLabel)}')">✗ ${c.failLabel}</button>
        </div>`;

    } else if (c.type === "pf_sub") {
      const passCls = e?.result==="PASS" ? (e.label ? "s-pass" : "s-pass-pending") : "";
      body = `
        <div class="pf-row">
          <button class="pf-btn ${passCls}" onclick="selectPass('${key}')">✓ PASS</button>
          <button class="pf-btn ${e?.result==="FAIL"?"s-fail":""}"
            onclick="recordPF('${key}','FAIL','${esc(c.failLabel)}')">✗ ${c.failLabel}</button>
        </div>`;
      if (e?.result === "PASS") {
        body += `
        <div class="sub-label">Select the measured range:</div>
        <div class="sub-row">
          ${c.passRanges.map(r =>
            `<button class="sub-btn ${e.label===r?"on":""}"
               onclick="recordSub('${key}','${esc(r)}')">${r}</button>`).join("")}
        </div>`;
      }

    } else if (c.type === "pf_manual") {
      const passCls = e?.result==="PASS" ? (e.label ? "s-pass" : "s-pass-pending") : "";
      body = `
        <div class="pf-row">
          <button class="pf-btn ${passCls}" onclick="selectPass('${key}')">✓ ${c.passLabel}</button>
          <button class="pf-btn ${e?.result==="FAIL"?"s-fail":""}"
            onclick="recordPF('${key}','FAIL','${esc(c.failLabel)}')">✗ ${c.failLabel}</button>
        </div>`;
      if (e?.result === "PASS") {
        const val = e?.label || "";
        body += `
        <div class="manual-row">
          <input id="manual_${key}" class="manual-input" type="number" step="0.01"
            placeholder="Enter measured value" value="${val}"
            onkeydown="if(event.key==='Enter')recordManual('${key}')"/>
          <span class="manual-unit">${c.unit||""}</span>
          <button class="manual-confirm" onclick="recordManual('${key}')">✓ Save</button>
        </div>`;
      }

    } else if (c.type === "manual") {
      const val = e?.label || "";
      body = `
        <div class="manual-row">
          <input id="manual_${key}" class="manual-input" type="number" step="0.01"
            placeholder="Enter value" value="${val}"
            onkeydown="if(event.key==='Enter')recordManual('${key}')"/>
          <span class="manual-unit">${c.unit||""}</span>
          <button class="manual-confirm" onclick="recordManual('${key}')">✓ Save</button>
        </div>`;

    } else if (c.type === "gauge") {
      const canNoRunGauge = S.batchDay > 1 || approvalClearedThruProcess(proc.no);
      const noRunG = e?.result === "NO_RUN";
      const inputId = `gauge_${key}`.replace(/[^a-zA-Z0-9_]/g, "_");
      const pr = e?.photoRead;
      const hasVal = typeof e?.value === "number";
      let hint = "";
      if (e?.photoStatus === "uploading") hint = "Uploading the photo…";
      else if (pr && pr.pending) hint = "Reading the number from the photo…";
      else if (hasVal && e.source === "ai") hint = `Read from the photo: ${e.value} ${c.unit}. Correct it below if it's wrong.`;
      else if (e?.photo && !hasVal) hint = "Type the number shown on the display, then tap Save.";
      else if (!e?.photo) hint = "Take a clear photo of the display. The number is read from it.";
      body = `
        <div class="gauge-row">
          <button class="gauge-cam" onclick="openGaugeCamera('${key}')">📷 ${e?.photo ? "Retake photo" : "Take photo of the display"}</button>
          ${canNoRunGauge ? `<button class="band-btn ${noRunG ? "b-norun-on" : "b-norun-opt"}" style="flex:0 0 auto;"
              onclick="recordBand('${key}','NO_RUN','No Run')">⊘ No Run</button>` : ""}
        </div>
        ${noRunG ? "" : `
        <div class="manual-row">
          <input id="${inputId}" class="manual-input" type="number" step="0.01" inputmode="decimal"
            placeholder="Reading" value="${hasVal ? e.value : ""}"
            onkeydown="if(event.key==='Enter')recordGauge('${key}')"/>
          <span class="manual-unit">${c.unit}</span>
          <button class="manual-confirm" onclick="recordGauge('${key}')">✓ Save</button>
        </div>
        <div class="gauge-hint">${hint}</div>
        ${hasVal && e.result ? `<div class="gauge-result ${e.result === "PASS" ? "gr-pass" : "gr-fail"}">
            ${e.result === "PASS" ? "✓ Within limits" : "✗ Outside limits"} (${c.spec})${e.override ? " · changed by operator" : ""}
            <span class="gauge-change" onclick="toggleGaugeResult('${key}')">change result</span></div>` : ""}`}`;

    } else if (c.type === "bands") {
      // Same rule as the process-level "Mark whole process No Run" button — see
      // approvalClearedThruProcess() — so a brand-new day-1 batch can't skip a reading that
      // was never actually taken, unless Approval Sample already verified it today.
      const canNoRunCheck = S.batchDay > 1 || approvalClearedThruProcess(proc.no);
      const noRunSel = e?.result === "NO_RUN";
      body = `
        <div class="bands-label">Select the measured value:</div>
        <div class="bands-row">
          ${c.bands.map(b => {
            const isPass = b.r === "PASS";
            const sel    = e?.label === b.label;
            const base   = isPass ? "b-pass-opt" : "b-fail-opt";
            const on     = sel   ? (isPass ? "b-pass-on" : "b-fail-on") : base;
            return `<button class="band-btn ${on}"
                      onclick="recordBand('${key}','${b.r}','${esc(b.label)}')">${b.label}</button>`;
          }).join("")}
          ${canNoRunCheck ? `<button class="band-btn ${noRunSel?"b-norun-on":"b-norun-opt"}"
                      onclick="recordBand('${key}','NO_RUN','No Run')">⊘ No Run</button>` : ""}
        </div>`;
    }

    const photoInputId = `photo_${key}`.replace(/[^a-zA-Z0-9_]/g, "_");
    const photoHtml = c.photo ? `
      ${rPhotoBadge(e, photoInputId)}
      <input type="file" accept="image/*" capture="environment" id="${photoInputId}" style="display:none"
        onchange="handlePhotoSelect('${key}', this)">` : "";

    return `
      <div class="check-item ${cls}">
        <div class="check-char">${c.key}</div>
        <div class="check-spec">Specification: <strong>${c.spec}</strong></div>
        <div class="check-method">Method: ${c.method}</div>
        ${body}
        ${complete ? `<div class="check-rec"><span>${e.label}</span><span style="color:#94a3b8">${e.time}</span></div>` : ""}
        ${photoHtml}
        ${(c.method === "Vernier Caliper" || c.type === "gauge") ? photoNoteHtml(e) : ""}
      </div>`;
  }).join("");
}

// ── wire braiding ──
function rBraiding(proc) {
  const p  = PRODUCTS[S.product].braiding;
  const n  = p.machines;
  const ms = Array.from({length:n}, (_,i) => `BR-${String(i+1).padStart(2,"0")}`);
  const st = braidStats();

  // machine grid
  const cells = ms.map(m => {
    const entry    = curBraiding()[m];
    const isActive = S.activeBraid === m;
    let cls = "", lbl = "Tap to set";
    if (isActive) { cls = "b-active"; lbl = "Setting…"; }
    else if (entry) {
      if      (entry.result==="PASS") { cls="b-pass"; lbl = entry.label; }
      else if (entry.result==="FAIL") { cls="b-fail"; lbl = "FAIL"; }
      else                            { cls="b-na";   lbl = "No Run"; }
    }
    // 📷 once a photo is attached; ⚠ on a machine that has a reading but no photo yet (photo is
    // compulsory except No Run) — tap the machine, then the "Photo required" line, to take it.
    const needsPhoto = !!entry && !!entry.result && !photoSatisfied({ photo:true }, entry);
    const readNote = photoReadNote(entry);
    const photoDot = readNote      ? `<span class="braid-photo-dot" title="${esc(readNote)}">&#9888;</span>`
                   : entry?.photo  ? `<span class="braid-photo-dot" title="Photo attached">&#128247;</span>`
                   : needsPhoto    ? `<span class="braid-photo-dot" title="Photo required">&#9888;</span>` : "";
    return `<div class="braid-cell ${cls}" onclick="selectBraidMachine('${m}')">
      ${photoDot}
      <div class="braid-machine">${m}</div>
      <div class="braid-status">${lbl}</div>
    </div>`;
  }).join("");

  // selection panel
  let panel = "";
  if (S.activeBraid) {
    const bands    = p.odBands || [];
    const existing = curBraiding()[S.activeBraid];
    const bandBtns = bands.map(b => {
      const on = existing?.label === b.label ? "b-pass-on" : "b-pass-opt";
      return `<button class="braid-opt bo-pass ${on}"
                onclick="recordBraid('${S.activeBraid}','PASS','${esc(b.label)}')">${b.label}</button>`;
    }).join("");
    const failOn = existing?.result==="FAIL" ? "b-fail-on" : "b-fail-opt";
    const naOn   = existing?.result==="NO_RUN"  ? "b-na-on"  : "b-na-opt";
    const braidPhotoInputId = `photo_braid_${S.activeBraid}`.replace(/[^a-zA-Z0-9_]/g, "_");
    panel = `
      <div class="braid-panel">
        <div class="braid-panel-title">📍 ${S.activeBraid} — Select O.D. result:</div>
        <div class="braid-panel-opts">
          ${bandBtns}
          <button class="braid-opt bo-na ${naOn}"
            onclick="recordBraid('${S.activeBraid}','NO_RUN','No Run')">⊘ No Run</button>
          <button class="braid-opt bo-fail ${failOn}"
            onclick="recordBraid('${S.activeBraid}','FAIL','FAIL')">✗ FAIL</button>
        </div>
        ${rPhotoBadge(existing, braidPhotoInputId)}
        ${photoNoteHtml(existing)}
        <div class="braid-panel-cancel" onclick="S.activeBraid=null;render()">✕ Cancel</div>
      </div>`;
  }

  const tallyHtml = (st.passN + st.failN + st.naN) > 0 ? `
    <div class="braid-tally">
      <div class="tally-chip t-pass">✓ ${st.passN} PASS</div>
      <div class="tally-chip t-na">⊘ ${st.naN} No Run</div>
      <div class="tally-chip t-fail">✗ ${st.failN} FAIL</div>
    </div>` : "";

  return `
    <div class="braid-info">
      <strong>O.D. Spec:</strong> ${p.od} &nbsp;·&nbsp; <strong>Pitch:</strong> ${p.pitch}<br>
      <strong>Method:</strong> Vernier Caliper &nbsp;·&nbsp; <span style="color:#94a3b8">Tap a machine to set its result</span>
    </div>
    <div class="braid-grid">${cells}</div>
    ${ms.map(m => `<input type="file" accept="image/*" capture="environment" style="display:none"
        id="${`photo_braid_${m}`.replace(/[^a-zA-Z0-9_]/g, "_")}" onchange="handleBraidPhotoSelect('${m}', this)">`).join("")}
    ${panel}
    ${tallyHtml}`;
}

function selectBraidMachine(m) {
  S.activeBraid = S.activeBraid === m ? null : m;
  render();
}

function recordBraid(m, result, label) {
  const existing = curBraiding()[m] || {};
  curBraiding()[m] = { ...existing, result, label, fromSheet: false };
  S.activeBraid  = null;
  render();   // saves the chosen result locally BEFORE the camera can open
  maybeOpenBraidCamera(m);
}

// Opens the camera for a photo slot, straight from the tap that picked the reading (browsers
// only allow that from a direct user gesture, so this must run synchronously inside the
// handler, after render() so the hidden file input exists). Rules:
//  - never for No Run, and only if a real reading is set;
//  - only the FIRST time for this check (camAsked), so fixing a mis-tap or re-selecting
//    after cancelling the camera doesn't re-open it — the "Photo required" status line is
//    the way back in for that;
//  - not if a photo is already attached or an upload is in flight.
function openCameraFor(entry, inputId) {
  if (!entry || !entry.result || entry.result === "NO_RUN") return;
  if (entry.camAsked || entry.photo || entry.photoStatus === "uploading") return;
  if (S.screen !== "process") return;
  const inp = document.getElementById(inputId);
  if (!inp) return;
  entry.camAsked = true;
  saveState();
  silentCheckpoint();
  inp.click();
}
function maybeOpenCamera(key) {
  openCameraFor(curEntries()[key], `photo_${key}`.replace(/[^a-zA-Z0-9_]/g, "_"));
}
function maybeOpenBraidCamera(m) {
  openCameraFor(curBraiding()[m], `photo_braid_${m}`.replace(/[^a-zA-Z0-9_]/g, "_"));
}

// ── entry recorders ──
// All of these merge onto any existing entry (rather than replacing it outright) so a
// photo already attached via handlePhotoSelect()/handleBraidPhotoSelect() — which itself
// merges — is never silently wiped out just because the operator taps a result afterward.
// Camera opens (see maybeOpenCamera()) on: a band/size pick, Pass/Fail buttons, Crimp O.D.'s
// Pass, and Air Leakage's range pick. `fromSheet:false` marks the value as freshly entered
// now, so a hydrated entry that's re-picked is held to the photo rule like any other.
function recordPF(key, result, label) {
  const existing = curEntries()[key] || {};
  curEntries()[key] = { ...existing, result, label, time: nowTime(), fromSheet: false }; render();
  maybeOpenCamera(key);
}
function selectPass(key) {
  const existing = curEntries()[key] || {};
  curEntries()[key] = { ...existing, result:"PASS", label:"", time: nowTime(), fromSheet: false }; render();
  // Crimp O.D. (pass/fail + typed value): open on PASS. Air Leakage (pass + range) opens
  // later, on the range pick — recordSub().
  const procNo = key.split("_")[0], ck = key.slice(procNo.length + 1);
  const chk = (buildProcesses(S.product).find(p => p.no === procNo)?.checks || []).find(c => c.key === ck);
  if (chk && chk.type === "pf_manual") maybeOpenCamera(key);
}
function recordSub(key, range) {
  const existing = curEntries()[key] || {};
  curEntries()[key] = { ...existing, result:"PASS", label:range, time: nowTime(), fromSheet: false }; render();
  maybeOpenCamera(key);
}
function recordBand(key, result, label) {
  const existing = curEntries()[key] || {};
  curEntries()[key] = { ...existing, result, label, time: nowTime(), fromSheet: false };
  if (key === pkey("090","Length")) {
    // No automatic cascade any more: each process (and each check) is marked No Run on its
    // own with "No Run — Didn't Run Today". Only undo leftovers from an older auto-fill.
    if (result !== "NO_RUN") revertLengthNoRunCascade();
  }
  render();   // saves the chosen value locally BEFORE the camera can open
  maybeOpenCamera(key);
}

// ── Process 120 gauge checks: number read from the photo, confirmed/edited by the operator ──
function gaugeUnitMatches(seen, expected) {
  const norm = u => { u = String(u || "").toLowerCase().replace(/[^a-z]/g, ""); return u === "kg" || u === "kgs" || u === "kgf" ? "kgf" : u; };
  return norm(seen) === norm(expected);
}
function gaugeJudge(chk, v) {
  if (chk.min !== null && chk.min !== undefined && v < chk.min - 1e-9) return "FAIL";
  if (chk.max !== null && chk.max !== undefined) {
    if (chk.maxExclusive ? v >= chk.max - 1e-9 : v > chk.max + 1e-9) return "FAIL";
  }
  return "PASS";
}
function gaugeLabel(chk, v, result, override) {
  return `${+Number(v).toFixed(2)} ${chk.unit}` + (result === "FAIL" ? " ✗ FAIL" : "") + (override ? " (override)" : "");
}
function applyGaugeValue(key, v, source) {
  const chk = findCheckByKey(key); if (!chk) return;
  const existing = curEntries()[key] || {};
  const result = gaugeJudge(chk, v);
  curEntries()[key] = { ...existing, value: +Number(v).toFixed(2), source, gaugeUnit: chk.unit, override: false,
    result, label: gaugeLabel(chk, v, result, false), time: nowTime(), fromSheet: false };
}
function openGaugeCamera(key) {
  const inp = document.getElementById(`photo_${key}`.replace(/[^a-zA-Z0-9_]/g, "_"));
  if (!inp) return;
  const e = curEntries()[key] || {}; e.camAsked = true; curEntries()[key] = e;
  saveState(); silentCheckpoint();
  inp.click();
}
function recordGauge(key) {
  const inp = document.getElementById(`gauge_${key}`.replace(/[^a-zA-Z0-9_]/g, "_"));
  const raw = inp ? String(inp.value).trim() : "";
  const v = parseFloat(raw);
  if (!raw || !isFinite(v) || v < 0) { alert("Enter the number shown on the display."); return; }
  const e = curEntries()[key] || {};
  const same = e.photoRead && e.photoRead.readable && Math.abs(e.photoRead.reading - v) < 0.005;
  applyGaugeValue(key, v, same ? "ai" : "typed");
  render();
  maybeOpenCamera(key);   // photo is compulsory — opens once if none is attached yet
}
function toggleGaugeResult(key) {
  const chk = findCheckByKey(key); const e = curEntries()[key];
  if (!chk || !e || typeof e.value !== "number") return;
  const to = e.result === "PASS" ? "FAIL" : "PASS";
  if (!confirm(`Change this result to ${to}? It will be recorded as changed by the operator.`)) return;
  e.result = to; e.override = to !== gaugeJudge(chk, e.value);
  e.label = gaugeLabel(chk, e.value, to, e.override);
  render();
}
async function readGaugePhoto(key) {
  const chk = findCheckByKey(key);
  const e = curEntries()[key];
  if (!chk || !e || !e.photo) return;
  const url = e.photo;
  e.photoRead = { pending: true };
  render();
  try {
    const res = await fetch("/api/readcaliper", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ imageUrl: url, kind: "gauge", unit: chk.unit })
    });
    const data = await res.json();
    const cur = curEntries()[key];
    if (!cur || cur.photo !== url) return;              // retaken meanwhile — drop it
    if (res.ok && typeof data.readable === "boolean") {
      cur.photoRead = { readable: data.readable, reading: data.reading, confidence: data.confidence, unitSeen: data.unit_on_display || "" };
      cur.gaugeUnit = chk.unit;
      const usable = data.readable && typeof data.reading === "number" && data.confidence !== "low";
      // Don't overwrite something the operator typed themselves unless the photo agrees with it.
      if (usable && !(cur.source === "typed" && typeof cur.value === "number")) applyGaugeValue(key, data.reading, "ai");
    } else {
      delete cur.photoRead;                             // service unavailable — the operator types it
    }
  } catch (err) {
    const cur = curEntries()[key];
    if (cur && cur.photoRead && cur.photoRead.pending) delete cur.photoRead;
  }
  render();
  silentCheckpoint();
}

// If Part Off (090) Length is No Run, the hose was never cut this round, which means
// nothing downstream of it — the rest of 090, and all of 100/120/130 — could have
// happened either. This fills all of that in as No Run too and submits straight for
// verification, skipping the Review screen entirely — there's nothing left for the
// operator to check by hand, so there's no reason to stop and show them a table first.
// (If an earlier process, before 090, isn't done yet, submitForVerification() still
// catches that with its usual alert — same guard as the manual Review flow always had.)
// Entries are tagged {auto:true} so revertLengthNoRunCascade() can safely undo exactly
// what it applied without ever touching anything the operator entered by hand.
function applyLengthNoRunCascade() {
  const procs   = buildProcesses(S.product);
  const idx090  = procs.findIndex(p => p.no === "090");
  const entries = curEntries();
  procs.slice(idx090).forEach(p => {
    if (p.type === "braiding") {
      const n = PRODUCTS[S.product].braiding.machines;
      const brg = curBraiding();
      for (let i = 1; i <= n; i++) {
        const m = `BR-${String(i).padStart(2,"0")}`;
        if (!brg[m] || brg[m].auto) brg[m] = { result:"NO_RUN", label:"No Run", auto:true };
      }
      return;
    }
    p.checks.forEach(c => {
      if (p.no === "090" && c.key === "Length") return; // already set by the caller
      const k = pkey(p.no, c.key);
      if (!entries[k] || entries[k].auto) entries[k] = { result:"NO_RUN", label:"No Run", time: nowTime(), auto:true };
    });
    if (!S.procOperators[p.no]) S.procOperators[p.no] = S.procOperators["090"] || S.operator;
  });
  S.processIdx = procs.length - 1;
  submitForVerification();
}

// Undoes exactly what applyLengthNoRunCascade() auto-filled — only entries still tagged
// {auto:true} are cleared, so anything the operator has since entered for real (which
// overwrites the auto tag) is left completely untouched.
function revertLengthNoRunCascade() {
  const procs   = buildProcesses(S.product);
  const idx090  = procs.findIndex(p => p.no === "090");
  const entries = curEntries();
  procs.slice(idx090).forEach(p => {
    if (p.type === "braiding") {
      const brg = curBraiding();
      Object.keys(brg).forEach(m => { if (brg[m] && brg[m].auto) delete brg[m]; });
      return;
    }
    p.checks.forEach(c => {
      if (p.no === "090" && c.key === "Length") return;
      const k = pkey(p.no, c.key);
      if (entries[k] && entries[k].auto) delete entries[k];
    });
  });
}
function recordManual(key) {
  const val = document.getElementById("manual_" + key)?.value?.trim();
  if (!val) return;
  const existing = curEntries()[key] || {};
  curEntries()[key] = { ...existing, result:"PASS", label: val, time: nowTime() }; render();
}

function navBack() {
  // Back from the FIRST process is the one press that drops an operator onto Setup, where
  // "Begin Inspection" wipes the session. Don't let that happen by accident — offer the
  // checkpoint button that exists for exactly this purpose instead.
  if (S.processIdx === 0) {
    const n = recordedReadingCount();
    if (n > 0) {
      const leave = confirm(
        `Inspection in progress — ${n} reading${n === 1 ? "" : "s"} recorded.\n\n` +
        `Back would leave this inspection.\n\n` +
        `OK — save progress to the Sheet and continue later\n` +
        `Cancel — stay in the inspection`
      );
      if (!leave) return;
      // hasNewProgressToReport() is false when everything here is already checkpointed;
      // pauseBatch() would just alert and refuse, stranding the operator with no way out,
      // so in that case going to Setup is both safe and the only sensible move.
      if (hasNewProgressToReport()) { pauseBatch(); return; }
      S.screen = "setup";
    } else {
      S.screen = "setup";
    }
  } else {
    S.processIdx--;
  }
  S.activeBraid = null; render();
}
function navNext() {
  const procs = buildProcesses(S.product);
  const proc  = procs[S.processIdx];
  if (!S.procOperators[proc.no]) { alert("Please select an operator for this process."); return; }

  // Every check in THIS process must actually be recorded (a real reading or an explicit
  // No Run) before moving on — selecting an operator alone isn't enough. Without this, it
  // was possible to tap through an entire process with nothing entered and only find out
  // at final submission (submitForVerification() already enforces this same rule there),
  // by which point a verifier could be looking at a process that was silently skipped.
  if (!isProcDone(proc)) { alert("Please complete every reading for this process before moving on — each one also needs its photo (or mark it No Run if applicable)."); return; }

  // Every shift EXCEPT Approval Sample is capped at wherever Approval Sample's own
  // verification currently stands — see enforceShiftGate()/approvalSampleVerifiedThru().
  // This only blocks moving FURTHER; anything already recorded stays exactly as it is.
  if (S.currentRound !== 0) {
    const capNo     = approvalSampleVerifiedThru();
    const capIdx    = capNo ? procs.findIndex(p => p.no === capNo) : -1;
    const isLastProc = S.processIdx === procs.length - 1;
    // Process 130 (the last process) has no "further" to move past — the only next screen
    // is Review, which is finishing your OWN round, not starting a new process beyond the
    // cap. So when the shift is sitting exactly at (or before) the cap on the LAST process,
    // finishing it must always be allowed, even though S.processIdx === capIdx there. Every
    // other transition — starting a genuinely new mid-pipeline process beyond the cap —
    // keeps the original >= block untouched.
    const atOrBeforeCap = capIdx >= 0 && S.processIdx <= capIdx;
    const blocked = isLastProc ? !atOrBeforeCap : S.processIdx >= capIdx;
    if (blocked) {
      alert(capNo
        ? `This shift can't move past Process ${proc.no} yet — Approval Sample has only been verified through Process ${capNo}. Check back once that moves further (tap "↻ refresh" on Setup to pull the latest).`
        : `This shift can't proceed yet — Approval Sample hasn't been verified at all today. Check back once at least part of it has been verified.`);
      return;
    }
  }

  S.activeBraid = null;
  if (S.processIdx < procs.length-1) S.processIdx++;
  else S.screen = "review";
  render();
}

// Only available when continuing an existing batch on a later day (S.batchDay > 1).
// Marks every check in the current process as No Run for today's session, then advances.
function markProcessNoRun() {
  const procs = buildProcesses(S.product);
  const proc  = procs[S.processIdx];
  if (proc.type === "braiding") {
    const n  = PRODUCTS[S.product].braiding.machines;
    const ms = Array.from({length:n}, (_,i) => `BR-${String(i+1).padStart(2,"0")}`);
    ms.forEach(m => { curBraiding()[m] = { result:"NO_RUN", label:"No Run" }; });
  } else {
    proc.checks.forEach(c => {
      const key = pkey(proc.no, c.key);
      curEntries()[key] = { result:"NO_RUN", label:"No Run", time: nowTime() };
    });
  }
  // Bulk-marking Part Off (090) No Run this way means the same "nothing downstream
  // happened either" logic applies as when Length alone is marked No Run.
  render();
  navNext();
}

// ═══════════════════════════════════════════════
// SCREEN 3 — REVIEW
// ═══════════════════════════════════════════════
function rReview() {
  const procs  = buildProcesses(S.product);
  // count fails across ALL rounds
  let totalFails = 0;
  S.roundData.forEach(rd => {
    totalFails += Object.values(rd.entries).filter(e=>e.result==="FAIL").length;
    totalFails += Object.values(rd.braiding).filter(v=>v.result==="FAIL").length;
  });
  // Same completeness check submitForVerification() actually enforces — the banner used to
  // only look at totalFails, so it could cheerfully say "ready for verification" while the
  // Submit button turned around and blocked with "X remaining" for the CURRENT round. Now
  // both agree.
  const notDoneCount = procs.filter(p => !isProcDone(p)).length;

  const hdr = ROUND_LABELS.map(l=>`<th style="font-size:11px;padding:4px 6px;">${l}</th>`).join("");

  const rows = procs.map(proc => {
    if (proc.type === "braiding") {
      const cells = S.roundData.map(rd => {
        const vals = Object.values(rd.braiding);
        if (!vals.length) return `<td style="color:#94a3b8;font-size:12px;">—</td>`;
        const f = vals.filter(v=>v.result==="FAIL").length;
        const allNoRun = vals.every(v=>v.result==="NO_RUN");
        const cls = allNoRun ? "b-na" : f===0 ? "b-ok" : "b-ng";
        const lbl = allNoRun ? "No Run" : f===0 ? "OK" : "NG";
        return `<td><span class="badge ${cls}" style="font-size:11px;">${lbl}</span></td>`;
      }).join("");
      return `<tr><td colspan="2" style="font-size:12px;color:#1e3a5f;font-weight:700;">030 Wire Braiding</td>${cells}</tr>`;
    }
    return proc.checks.map((c,ci) => {
      const cells = S.roundData.map(rd => {
        const e = rd.entries[pkey(proc.no, c.key)];
        if (!e) return `<td style="color:#94a3b8;font-size:12px;">—</td>`;
        const cls = e.result==="PASS" ? "b-ok" : e.result==="NO_RUN" ? "b-na" : "b-ng";
        return `<td><span class="badge ${cls}" style="font-size:11px;">${e.label||e.result}</span></td>`;
      }).join("");
      return `<tr>
        <td style="font-size:11px;color:#64748b;">${ci===0?"P"+proc.no:""}</td>
        <td style="font-size:12px;">${c.key}</td>
        ${cells}
      </tr>`;
    }).join("");
  }).join("");

  return `
    <div class="header"><h1>Review — All Readings</h1>
      <p>${PRODUCTS[S.product].label} · ${S.operator} · ${S.date}${S.batchNo?` · Batch ${S.batchNo}`:""}</p></div>
    ${notDoneCount>0
      ? `<div class="alert">⏳ ${notDoneCount} process(es) still need to be completed before you can submit.</div>`
      : totalFails>0
      ? `<div class="alert">⚠  ${totalFails} check(s) FAILED across all readings.</div>`
      : `<div class="alert green">✅ All readings complete. Ready for verification.</div>`}
    <div class="card" style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr style="background:#f1f5f9;">
          <th style="font-size:11px;padding:4px 6px;">Proc</th>
          <th style="font-size:11px;padding:4px 6px;">Check</th>
          ${hdr}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="nav-row no-print">
      <button class="btn-back" onclick="S.processIdx=buildProcesses(S.product).length-1;S.screen='process';render()">← Edit</button>
      <button class="btn-next" onclick="submitForVerification()">Submit for Verification →</button>
    </div>`;
}

// The operator's job ends here: once every process is done, they submit and hand off.
// There is no local "finalise/print" step for them anymore — verification, finalising,
// and printing are all done later by a supervisor via the separate, cross-device
// "Verify Reports" flow (see below). This just needs every process DONE (real data or
// No Run) for the current round/shift.
function submitForVerification() {
  const procs = buildProcesses(S.product);
  const notDone = procs.filter(p => !isProcDone(p));
  if (notDone.length > 0) { alert(`Please complete all processes first — ${notDone.length} remaining.`); return; }
  S.finalisedAt = new Date().toLocaleString("en-IN");
  if (S.batchBase) {
    const procCount = buildProcesses(S.product).length;
    registerBatchDay(S.batchBase, {
      product: S.product,
      batchLastDay: S.batchDay,
      batchLastDate: S.date,
      roundIdx: S.currentRound,
      roundResumeIdx: procCount,
      roundDayStartIdx: S.reportedThroughIdx,
      roundLastDate: S.date,
      roundComplete: true
    });
  }
  S.screen = "submitted"; render();
  submitToSheet(); // fires automatically — no manual step needed
}

// ═══════════════════════════════════════════════
// SCREEN 4 — SUBMITTED (operator's flow ends here; verifier takes it from here)
// ═══════════════════════════════════════════════
function rSubmitted() {
  const submitHtml = S.submitStatus === "loading"
    ? `<div class="alert">⏳ Submitting to Google Sheet…</div>`
    : S.submitStatus === "done"
    ? `<div class="alert green">✅ Submitted to Google Sheet.</div>`
    : S.submitStatus === "error"
    ? `<div class="alert">⚠ Couldn't submit automatically: ${(S.submitError||"").replace(/</g,"&lt;")} · <span style="text-decoration:underline;cursor:pointer;" onclick="submitToSheet()">Retry</span></div>`
    : "";
  return `
    <div class="header">
      <h1>✅ Submitted for Verification</h1>
      <p>${PRODUCTS[S.product] ? PRODUCTS[S.product].label : ""}${S.batchNo?` · Batch ${S.batchNo}`:""}</p>
    </div>
    ${submitHtml}
    <div class="card">
      <div style="font-size:16px;font-weight:800;color:#1e3a5f;margin-bottom:6px;">Nice work — you're done here</div>
      <div style="font-size:13px;color:#64748b;">This report now goes to a supervisor for review, verification and sign-off from a separate device — no further action needed from you.</div>
    </div>
    <button class="btn-primary" onclick="newInspection()">+ New Inspection</button>`;
}

// Saves progress mid-batch without requiring every process to be finished.
// Writes/updates a partial row (today's new work only, for the CURRENT round/shift) and
// marks that round resumable at exactly this process, so it shows up under
// "Continue Existing Batch" + that Shift on Setup.
function pauseBatch() {
  if (!S.batchBase) { alert("No active batch to pause."); return; }
  if (!hasNewProgressToReport()) { alert("Nothing new to save since your last checkpoint."); return; }
  registerBatchDay(S.batchBase, {
    product: S.product,
    batchLastDay: S.batchDay,
    batchLastDate: S.date,
    roundIdx: S.currentRound,
    roundResumeIdx: S.processIdx,
    roundDayStartIdx: S.reportedThroughIdx,
    roundLastDate: S.date,
    roundComplete: false
  });
  S.screen = "paused"; render();
  submitToSheet();
}

// Only the CURRENT round's progress matters here — other rounds of the same batch are
// saved/tracked independently via their own continuations.
function hasNewProgressToReport() {
  const procs = buildProcesses(S.product);
  const procOrder = {};
  procs.forEach((pr, i) => { procOrder[pr.no] = i; });
  const reportedThru = S.reportedThroughIdx || 0;
  const braidProc = procs.find(pr => pr.type === "braiding");
  const braidIdx  = braidProc ? procOrder[braidProc.no] : -1;
  const rd = S.roundData[S.currentRound];
  if (!rd) return false;
  const hasEntry = Object.keys(rd.entries).some(k => (procOrder[k.split("_")[0]] ?? 0) >= reportedThru);
  const hasBraid = braidIdx >= reportedThru && Object.keys(rd.braiding).length > 0;
  return hasEntry || hasBraid;
}

// ═══════════════════════════════════════════════
// MASTER SHEET SCHEMA — shared by xlsx export & Google Sheets submission
// ═══════════════════════════════════════════════
// Laid out in two blocks, in actual process-flow order (030→040→050→060→070→080→090→
// 100→120→130), replacing the old layout where columns were bolted on at the end in
// whatever order each feature was added over time (main 43, then Verified By/At/Device
// ID, then 18 BR photo cols, then Verified Thru Process, then the 13 "extra" checks) —
// which made both the raw Sheet and the code's column math hard to follow.
//
// BLOCK A (columns 1..SHEET_DATA_COLS) — everything the OPERATOR's save ever writes,
// written as ONE atomic range in submitToSheet(). This used to be up to 4 separate
// fire-and-forget requests (main row + Device ID + BR-XX photos + the 13 extra checks);
// that fragmentation is exactly what caused real data loss in production (see the
// 2026-08-11 incident: Device ID and 12 of the 13 extra checks came back blank on
// submitted, finalised, even verified rows, because those follow-up requests fired but
// were never awaited, so the app moved on before confirming they'd landed). Collapsing
// to a single awaited write removes that failure mode instead of just patching around it.
//
// BLOCK B (columns SHEET_DATA_COLS+1..end) — everything the separate, cross-device
// Verify Reports flow writes, in verifyVrRow(). Kept in its own block, never overlapping
// Block A, so an operator's save and a verifier's save (possibly from different devices,
// possibly minutes or days apart) can never collide or overwrite each other.
const SHEET_HEADERS = [
  // ── meta ──
  "Date","Product","Batch No.","Shift / Sample","Operator","Device ID","Supervisor","Finalised At",
  // ── 030 Mixing Mill ──
  "Hardness (P030)","Tensile (P030)","Button Weight (P030)","TS2 (P030)","TC90 (P030)",
  // ── 040 Rubber Extruder ──
  "O.D. Spec","O.D. Measured","O.D. Photo","I.D. Spec","I.D. Measured","I.D. Photo","Appearance",
  // ── 050 Vulcanizer ──
  "Pressure (P050)","Pressure Photo (P050)",
  // ── 060 Air Compressor ──
  "Leakage (P060)","Pressure (P060)",
  // ── 070 Wire Braiding — each machine's O.D. reading, then its own photo, then the
  // legacy packed "Braiding Photos" cell kept for backward compatibility with rows
  // submitted before per-machine photo columns existed ──
  ...Array.from({length:18}, (_,i) => `BR-${String(i+1).padStart(2,"0")} O.D.`),
  ...Array.from({length:18}, (_,i) => `BR-${String(i+1).padStart(2,"0")} Photo`),
  "Braiding Photos",
  // ── 080 Bundle Counter ──
  "O.D. Ring Die (P080)","Wire Cut (P080)","Appearance (P080)",
  // ── 090 Cutting Machine ──
  "Length","Length Photo (P090)","Wire Cut","Appearance (P090)",
  // ── 100 Manual / Fitting ──
  "Assembly (P100)",
  // ── 120 Crimping ──
  "Crimp O.D. Measured (P120)","Crimp O.D. Photo (P120)","Pressure Testing Photo (P120)","Fitting Load Test Photo (P120)","Air Leakage Photo (P120)",
  // ── 130 Final Appearance ──
  "Appearance (P130)",
  // ── Block B: Verify Reports only, see above ──
  "Verified By","Verified At","Verified Device ID","Verified Thru Process",
  // ── Block C: operator-written, like Block A, but deliberately placed AFTER Block B
  // instead of inside it. Block A's write range is a single contiguous
  // A1:{SHEET_DATA_COLS} block — inserting a column anywhere inside it (or between it and
  // Block B) would shift every column after the insertion point, which requires physically
  // moving every existing row's data in the live Sheet, not just adding a column. Appending
  // past Block B needs no such migration: it's pure growth, nothing existing moves. ──
  "Last Saved At",
  // ── Block C continued: Process 120 gauge readings (number read from the photo + unit) ──
  "Pressure Testing (P120)","Fitting Load Test (P120)","Air Leakage (P120)"
];
const GAUGE_COLS = ["Pressure Testing (P120)","Fitting Load Test (P120)","Air Leakage (P120)"];
const GAUGE_COL_BY_CHECK = { "Pressure Testing":"Pressure Testing (P120)", "Fitting Load Test":"Fitting Load Test (P120)", "Air Leakage":"Air Leakage (P120)" };
// Number of columns in Block A (the operator's single atomic write). Everything from here
// to the end of SHEET_HEADERS is Block B (Verify Reports' single atomic write).
const SHEET_DATA_COLS = 75;
// Block C (see comment above) — where each save's own timestamp goes.
const LAST_SAVED_COL_NAME = "Last Saved At";
function colLetter(n) { // 1-indexed column number -> spreadsheet letter(s)
  let s = "";
  while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
const LAST_SAVED_COL = colLetter(SHEET_HEADERS.indexOf(LAST_SAVED_COL_NAME) + 1);
// Block C = Last Saved At + the three gauge readings, written together in one range.
const BLOCK_C_END_COL = colLetter(SHEET_HEADERS.indexOf(LAST_SAVED_COL_NAME) + 1 + GAUGE_COLS.length);

// ═══════════════════════════════════════════════
// CLOSE BATCH → FINAL REPORT (groundwork for the PDIR)
// ═══════════════════════════════════════════════
// Admin closes a finished batch. Every day of it is merged into ONE averaged "final sheet"
// (one row per shift, in the "Final Reports" tab); the original daily rows are copied to
// the "Closed Batches" tab and then removed from Sheet1. The batch then sits under
// "Closed — awaiting invoice" on the home screen until an invoice number is entered (by
// Admin or any PIN-verified verifier), after which it moves to "Finished batches".
// Nothing is ever deleted from Sheet1 until BOTH new tabs have been written AND read back
// with the expected row counts.
const FINAL_TAB   = "Final Reports";
const ARCHIVE_TAB = "Closed Batches";
const ADMIN_NAME  = SELF_VERIFY_EXEMPT; // "Rishab (Admin)"
const FINAL_EXTRA_HEADERS = ["Days Worked","Work Dates","Closed By","Closed At","Invoice No.","Invoice Entered By","Invoice Entered At"];
// Gauge columns go AFTER the extras so tabs created before they existed only need columns appended.
const FINAL_HEADERS = [...SHEET_HEADERS.slice(0, SHEET_DATA_COLS), ...FINAL_EXTRA_HEADERS, ...GAUGE_COLS];

function quoteTab(t) { return "'" + String(t).replace(/'/g, "''") + "'"; }
function isBlankCell(v) { return v === undefined || v === null || String(v).trim() === ""; }
function isPhotoHeader(h) { return /Photo/i.test(h); }

// Reads one reading cell into a number when it is a measured band ("13.60-13.64" → 13.62),
// an out-of-range bound ("<11.00 FAIL" → 11.00, flagged), or a plain number. Anything else
// (OK / NG style labels) returns null and is treated as pass/fail.
function parseReadingNumber(v) {
  const s = String(v).trim();
  const num = "(-?\\d+(?:\\.\\d+)?)";
  const dec = x => (String(x).split(".")[1] || "").length;
  let m = s.match(new RegExp("^" + num + "\\s*[-–]\\s*" + num + "(?:\\s*(FAIL|✗))?$", "i"));
  if (m) return { n: (parseFloat(m[1]) + parseFloat(m[2])) / 2, dec: Math.max(dec(m[1]), dec(m[2])), fail: !!m[3] };
  m = s.match(new RegExp("^[<>≤≥]\\s*" + num + "(?:\\s*(FAIL|✗))?$", "i"));
  if (m) return { n: parseFloat(m[1]), dec: dec(m[1]), fail: true };
  // plain number, optionally with a unit and the FAIL / override markers written by gauge checks
  m = s.match(new RegExp("^" + num + "\\s*(?:bar|kgf|kg|psi|mm)?\\s*(✗\\s*FAIL|FAIL|✗)?\\s*(?:\\(override\\))?$", "i"));
  if (m) return { n: parseFloat(m[1]), dec: dec(m[1]), fail: !!m[2] };
  return null;
}

// Averages one check across the days a shift was worked. `values` = that check's cell from
// each day's row (blank cells already removed). Returns the text for the final sheet.
function aggregateReading(values) {
  const total = values.length;
  if (!total) return "";
  const ran = values.filter(v => String(v).trim() !== "No Run");
  const noRun = total - ran.length;
  if (!ran.length) return "No Run";
  const parsed = ran.map(parseReadingNumber);
  if (parsed.every(p => p)) {
    const mean = parsed.reduce((a, p) => a + p.n, 0) / parsed.length;
    let dec = Math.max(...parsed.map(p => p.dec));
    if (dec === 0 && Math.abs(mean - Math.round(mean)) > 1e-9) dec = 1;
    const ng = parsed.filter(p => p.fail).length;
    return `${mean.toFixed(dec)} (${ran.length}/${total})` + (ng ? ` · NG ${ng}` : "");
  }
  const ng = ran.filter(v => /FAIL|✗|Not Smooth|NG/.test(String(v))).length;
  const ok = ran.length - ng;
  return `OK ${ok}/${total}` + (ng ? ` · NG ${ng}` : "") + (noRun ? ` · No Run ${noRun}` : "");
}

function nonBlankCount(r) { return Object.keys(r).filter(k => k !== "__row" && !isBlankCell(r[k])).length; }

// Rows of Sheet1 that belong to one batch (any day), keyed/grouped by day-batch number + shift.
// If the same shift on the same day has more than one row (past duplicates), only the most
// complete one counts for readiness and averaging; every row is still archived.
function batchRowsFromSheet(allRows, base) {
  const mine = (allRows || []).filter(r => ROUND_LABELS.includes(r["Shift / Sample"]) && parseBatchNo(r["Batch No."] || "").base === base);
  const best = {};
  mine.forEach(r => {
    const k = (r["Batch No."] || "") + "|" + r["Shift / Sample"];
    const cur = best[k];
    if (!cur || nonBlankCount(r) > nonBlankCount(cur) || (nonBlankCount(r) === nonBlankCount(cur) && r.__row > cur.__row)) best[k] = r;
  });
  return { all: mine, chosen: Object.values(best) };
}

// Everything that must be true before Admin may close: every counted row finalised and
// verified all the way through its last filled process.
function closeBlockers(chosen, product) {
  const issues = [];
  chosen.forEach(r => {
    const label = `${r["Batch No."]} · ${r["Shift / Sample"]}`;
    const vt = String(r["Verified Thru Process"] || "").trim();
    if (!r["Finalised At"]) { issues.push(`${label}: not finalised yet`); return; }
    if (!vt) { issues.push(`${label}: not verified`); return; }
    const hi = highestFilledProcess(r, product);
    if (hi && vt !== String(hi)) issues.push(`${label}: verified only thru ${vt} (filled thru ${hi})`);
  });
  return issues;
}

function uniqJoin(vals) { return [...new Set(vals.filter(v => !isBlankCell(v)).map(v => String(v).trim()))].join(", "); }

function buildFinalReportRows(base, product, chosen, closedBy, closedAtIso) {
  const out = [];
  ROUND_LABELS.forEach(label => {
    const rows = chosen.filter(r => r["Shift / Sample"] === label)
      .sort((a, b) => String(a.Date || "").localeCompare(String(b.Date || "")) || a.__row - b.__row);
    if (!rows.length) return;
    const dates = [...new Set(rows.map(r => r.Date).filter(Boolean))];
    const line = FINAL_HEADERS.map(h => {
      if (h === "Date") return dates.length > 1 ? `${dates[0]} to ${dates[dates.length - 1]}` : (dates[0] || "");
      if (h === "Product") return product;
      if (h === "Batch No.") return base;
      if (h === "Shift / Sample") return label;
      if (h === "Operator" || h === "Device ID" || h === "Supervisor") return uniqJoin(rows.map(r => r[h]));
      if (h === "Finalised At") return [...rows.map(r => r[h]).filter(Boolean)].pop() || "";
      if (h === "O.D. Spec" || h === "I.D. Spec") return [...rows.map(r => r[h]).filter(v => !isBlankCell(v))].pop() || "";
      if (h === "Days Worked") return dates.length;
      if (h === "Work Dates") return dates.join(", ");
      if (h === "Closed By") return closedBy;
      if (h === "Closed At") return closedAtIso;
      if (h === "Invoice No." || h === "Invoice Entered By" || h === "Invoice Entered At") return "";
      if (h === "Pressure Testing Photo (P120)" || h === "Fitting Load Test Photo (P120)" || h === "Air Leakage Photo (P120)") {
        // Photo-only checks: the Sheet stores no reading for these, only the photo (or "No Run"),
        // so the final sheet shows how many days have photo evidence.
        const v = rows.map(r => r[h]).filter(x => !isBlankCell(x));
        if (!v.length) return "";
        const photos = v.filter(x => /^https?:/i.test(String(x).trim())).length;
        const nr = v.filter(x => String(x).trim() === "No Run").length;
        if (!photos && nr === v.length) return "No Run";
        return `Photo ${photos}/${rows.length}` + (nr ? ` · No Run ${nr}` : "");
      }
      if (isPhotoHeader(h) || h === "Braiding Photos") return "";
      return aggregateReading(rows.map(r => r[h]).filter(v => !isBlankCell(v)));
    });
    out.push(line);
  });
  return out;
}

async function sheetApi(body) {
  const res = await fetch("/api/submit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = (data && data.error && (data.error.error?.message || data.error)) || "Sheet request failed";
    throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
  }
  return data;
}
async function readTab(title, query) {
  const res = await fetch(`/api/log?sheet=${encodeURIComponent(title)}${query || ""}`, { cache: "no-store" });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error("Couldn't read the " + title + " tab");
  return data; // { headers, rows, total }
}
// Creates the tab if missing, makes sure it has enough columns, and writes the header row once.
async function ensureTab(title, headers) {
  const made = await sheetApi({ mode: "createSheet", title });
  const meta = await sheetApi({ mode: "meta" });
  const props = (meta.sheets || []).find(p => p.title === title);
  const cols = props && props.gridProperties && props.gridProperties.columnCount;
  if (props && cols && cols < headers.length) await sheetApi({ mode: "grow", sheetId: props.sheetId, addColumns: headers.length - cols });
  let hdr = [];
  try { hdr = (await readTab(title)).headers || []; } catch (e) { hdr = []; }
  if (!hdr.length) await sheetApi({ mode: "update", range: `${quoteTab(title)}!A1:${colLetter(headers.length)}1`, rows: [headers] });
  else if (hdr.length < headers.length && hdr.every((h, i) => h === headers[i])) {
    // Tab made by an older version: append only the newer header cells (nothing existing moves).
    await sheetApi({ mode: "update", range: `${quoteTab(title)}!${colLetter(hdr.length + 1)}1:${colLetter(headers.length)}1`, rows: [headers.slice(hdr.length)] });
  }
  return made;
}

let closingBusy = false;
function showBusy(msg) {
  let el = document.getElementById("busy-note");
  if (!el) { el = document.createElement("div"); el.id = "busy-note"; el.style.cssText = "position:fixed;left:12px;right:12px;bottom:16px;background:#1e293b;color:#fff;padding:12px 14px;border-radius:10px;font-size:13px;z-index:9999;text-align:center;"; document.body.appendChild(el); }
  el.textContent = msg;
}
function hideBusy() { const el = document.getElementById("busy-note"); if (el && el.parentNode) el.parentNode.removeChild(el); }

async function closeBatchFlow(base, closedBy) {
  // 1. Fresh read of Sheet1 — never trust a cached copy for something that deletes rows.
  const res = await fetch("/api/log", { cache: "no-store" });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error("Couldn't read the Sheet. Check your connection and try again.");
  const { all, chosen } = batchRowsFromSheet(data.rows || [], base);
  if (!all.length) throw new Error("No rows found for this batch in Sheet1 (it may already be closed).");
  const product = all[0].Product;
  if (!(await ensureProductKnown(product))) throw new Error(`This device doesn't know product "${product}". Refresh the page and try again.`);
  const issues = closeBlockers(chosen, product);
  if (issues.length) {
    const e = new Error("This batch can't be closed yet:\n\n• " + issues.slice(0, 8).join("\n• ") + (issues.length > 8 ? `\n…and ${issues.length - 8} more` : "") + "\n\nEvery shift on every day must be finalised and fully verified.");
    e.userFacing = true; throw e;
  }
  const closedAt = new Date().toISOString();
  const finalRows = buildFinalReportRows(base, product, chosen, closedBy, closedAt);

  // 2. Write the two new tabs (idempotent if a previous attempt got part-way).
  showBusy("Closing batch… preparing tabs");
  await ensureTab(FINAL_TAB, FINAL_HEADERS);
  await ensureTab(ARCHIVE_TAB, SHEET_HEADERS);

  showBusy("Closing batch… saving final report");
  const existingFinal = (await readTab(FINAL_TAB)).rows.filter(r => r["Batch No."] === base);
  if (existingFinal.length && existingFinal.length !== finalRows.length) throw new Error("The Final Reports tab already has a different set of rows for this batch. Ask the admin to check it before closing again.");
  if (!existingFinal.length) await sheetApi({ rows: finalRows, range: `${quoteTab(FINAL_TAB)}!A1` });

  showBusy("Closing batch… archiving daily rows");
  const archived = (await readTab(ARCHIVE_TAB)).rows.filter(r => parseBatchNo(r["Batch No."] || "").base === base);
  if (archived.length && archived.length !== all.length) throw new Error("The Closed Batches tab already holds part of this batch. Ask the admin to check it before closing again.");
  if (!archived.length) {
    const archiveRows = all.slice().sort((a, b) => a.__row - b.__row).map(r => SHEET_HEADERS.map(h => (r[h] === undefined || r[h] === null) ? "" : String(r[h])));
    await sheetApi({ rows: archiveRows, range: `${quoteTab(ARCHIVE_TAB)}!A1` });
  }

  // 3. Read both back; only continue if the counts are exactly right.
  showBusy("Closing batch… checking copies");
  const finalBack   = (await readTab(FINAL_TAB)).rows.filter(r => r["Batch No."] === base).length;
  const archiveBack = (await readTab(ARCHIVE_TAB)).rows.filter(r => parseBatchNo(r["Batch No."] || "").base === base).length;
  if (finalBack !== finalRows.length || archiveBack !== all.length) {
    throw new Error(`Copy check failed (final ${finalBack}/${finalRows.length}, archive ${archiveBack}/${all.length}). Nothing was removed from Sheet1.`);
  }

  // 4. Remove the daily rows from Sheet1 — re-read first so row numbers are current, and the
  // server refuses the whole delete if any row no longer holds the expected Batch No.
  showBusy("Closing batch… removing from Sheet1");
  const res2 = await fetch("/api/log", { cache: "no-store" });
  const data2 = await res2.json().catch(() => ({}));
  if (!res2.ok) throw new Error("Couldn't re-read Sheet1 before removing rows. The report is saved; try Close Batch again.");
  const nowRows = batchRowsFromSheet(data2.rows || [], base).all;
  if (nowRows.length !== all.length) throw new Error("Sheet1 changed while closing (row count differs). The report is saved; try Close Batch again.");
  await sheetApi({ mode: "deleteRows", rows: nowRows.map(r => ({ row: r.__row, batchNo: r["Batch No."] })) });
  return { shifts: finalRows.length, rows: all.length };
}

async function closeBatchClicked() {
  if (closingBusy) return;
  const base = S.selectedBatch;
  if (!base) { alert("Select a batch from the list first."); return; }
  const name = document.getElementById("s-op").value;
  const pin  = document.getElementById("s-pin").value;
  if (!name) { alert("Please select who's using this device (Prepared By)."); return; }
  if (name !== ADMIN_NAME) { alert("Only Admin (" + ADMIN_NAME + ") can close a batch."); return; }
  if (!pin) { alert("Please enter your PIN."); return; }
  if (!(await verifyDevicePin(name, pin))) return;
  if (!confirm(`Close batch ${base}?\n\nAll days will be merged into one averaged final report and moved out of the working sheet. It will then wait for an invoice number.`)) return;
  closingBusy = true;
  try {
    const r = await closeBatchFlow(base, name);
    hideBusy();
    S.selectedBatch = "";
    alert(`Batch ${base} is closed.\n\n${r.shifts} shift${r.shifts === 1 ? "" : "s"} averaged · ${r.rows} daily row${r.rows === 1 ? "" : "s"} archived.\nEnter its invoice number under "Closed — awaiting invoice".`);
  } catch (e) {
    hideBusy();
    console.error("closeBatch failed:", e);
    alert(e.userFacing ? e.message : "Couldn't close the batch: " + (e && e.message ? e.message : e));
  } finally {
    closingBusy = false;
    refreshSheetBatches();
  }
}

// ── Closed / finished lists on the home screen ──
function closedBatchGroups() {
  const groups = {};
  (S.closedRows || []).forEach(r => {
    const b = r["Batch No."]; if (!b) return;
    (groups[b] = groups[b] || []).push(r);
  });
  Object.values(groups).forEach(list => list.sort((a, b) => ROUND_LABELS.indexOf(a["Shift / Sample"]) - ROUND_LABELS.indexOf(b["Shift / Sample"])));
  return groups;
}
function groupInvoice(rows) { const r = rows.find(x => !isBlankCell(x["Invoice No."])); return r ? String(r["Invoice No."]) : ""; }

function closedBatchesHtml() {
  const groups = closedBatchGroups();
  const bases = Object.keys(groups).sort((a, b) => String(groups[b][0]["Closed At"] || "").localeCompare(String(groups[a][0]["Closed At"] || "")));
  if (!bases.length) return "";
  const card = (b, finished) => {
    const rows = groups[b], f = rows[0];
    const inv = groupInvoice(rows);
    const label = (PRODUCTS[f.Product] && PRODUCTS[f.Product].label) || f.Product || "";
    const closedOn = (f["Closed At"] || "").slice(0, 10);
    return `<div style="border:1.5px solid ${finished ? "#bbf7d0" : "#fed7aa"};border-radius:12px;padding:10px 12px;margin-bottom:8px;background:${finished ? "#f0fdf4" : "#fff7ed"};">
      <div style="display:flex;justify-content:space-between;gap:8px;"><div style="font-weight:700;font-size:14px;">${label}</div><div style="font-size:11px;color:#64748b;">${b}</div></div>
      <div style="font-size:12px;color:#64748b;margin-top:2px;">${f["Days Worked"] || "?"} day(s) · closed ${closedOn} by ${f["Closed By"] || "—"}</div>
      <div style="margin-top:6px;font-size:12px;font-weight:700;color:${finished ? "#15803d" : "#c2410c"};">${finished ? "Invoice " + inv + " · PDIR ready" : "Invoice number missing"}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
        ${finished
          ? `<button class="btn-outline" style="width:auto;flex:1;margin:0;padding:9px 6px;font-size:12px;" onclick="openFinalSheet('${esc(b)}')">📄 View final sheet</button>
             <button class="btn-outline" style="width:auto;flex:1;margin:0;padding:9px 6px;font-size:12px;" onclick="invoiceClicked('${esc(b)}')">✎ Edit invoice (Admin)</button>`
          : `<button class="btn-primary" style="width:auto;flex:1.4;margin:0;padding:9px 6px;font-size:12px;" onclick="invoiceClicked('${esc(b)}')">Enter invoice number</button>
             <button class="btn-outline" style="width:auto;flex:1;margin:0;padding:9px 6px;font-size:12px;" onclick="openFinalSheet('${esc(b)}')">📄 View final sheet</button>`}
      </div></div>`;
  };
  const waiting  = bases.filter(b => !groupInvoice(groups[b]));
  const finished = bases.filter(b => groupInvoice(groups[b]));
  return `
    ${waiting.length ? `<div class="card">
      <div style="font-weight:700;font-size:15px;margin-bottom:4px;">🧾 Closed — awaiting invoice</div>
      <div style="font-size:12px;color:#64748b;margin-bottom:10px;">Enter the invoice number (Prepared By + PIN above) to move a batch to Finished. Admin or any verifier can enter it.</div>
      ${waiting.map(b => card(b, false)).join("")}
    </div>` : ""}
    ${finished.length ? `<div class="card">
      <div style="font-weight:700;font-size:15px;margin-bottom:8px;">✅ Finished batches</div>
      ${finished.map(b => card(b, true)).join("")}
    </div>` : ""}`;
}

async function invoiceClicked(base) {
  const name = document.getElementById("s-op").value;
  const pin  = document.getElementById("s-pin").value;
  if (!name) { alert("Please select who's using this device (Prepared By)."); return; }
  if (!pin)  { alert("Please enter your PIN."); return; }
  if (!(await verifyDevicePin(name, pin))) return;
  try {
    const data = await readTab(FINAL_TAB);
    const rows = (data.rows || []).filter(r => r["Batch No."] === base);
    if (!rows.length) { alert("This batch wasn't found in Final Reports."); return; }
    const existing = groupInvoice(rows);
    if (existing && name !== ADMIN_NAME) { alert(`An invoice number (${existing}) is already entered. Only Admin can change it.`); return; }
    const entered = prompt(existing ? `Current invoice number: ${existing}\n\nNew invoice number for ${base}:` : `Invoice number for ${base}:`, existing || "");
    if (entered === null) return;
    const inv = entered.trim();
    if (!inv) { alert("Invoice number can't be blank."); return; }
    if (inv.length > 40) { alert("Invoice number is too long (40 characters max)."); return; }
    if (inv === existing) return;
    const c0 = FINAL_HEADERS.indexOf("Invoice No.");
    const stamp = new Date().toISOString();
    showBusy("Saving invoice number…");
    for (const r of rows) {
      await sheetApi({ mode: "update", range: `${quoteTab(FINAL_TAB)}!${colLetter(c0 + 1)}${r.__row}:${colLetter(c0 + 3)}${r.__row}`, rows: [[inv, name, stamp]] });
    }
    hideBusy();
    alert(`Invoice ${inv} saved for ${base}.`);
  } catch (e) {
    hideBusy();
    alert("Couldn't save the invoice number: " + (e && e.message ? e.message : e));
  } finally {
    refreshSheetBatches();
  }
}
