    const blob = await stampImage(file);
    const url = await uploadToCloudinary(blob, photoContext(`machine=${m}`));
    const b1 = curBraiding()[m] || {};
    b1.photo = url;
    b1.photoStatus = "done";
    curBraiding()[m] = b1;
  } catch (err) {
    const b1 = curBraiding()[m] || {};
    b1.photoStatus = "error";
    b1.photoError = err.message;
    curBraiding()[m] = b1;
  }
  render();
}

function rPhotoBadge(entry, inputId) {
  const status = entry?.photoStatus;
  let badge;
  if (status === "uploading") badge = `<span class="photo-badge photo-uploading">&#8987; Uploading&hellip;</span>`;
  else if (status === "error") badge = `<span class="photo-badge photo-error">&#9888; Upload failed &middot; tap to retry</span>`;
  else if (entry?.photo) badge = `<span class="photo-badge photo-done">&#128247; Photo attached &#10003;</span>`;
  else badge = `<span class="photo-badge photo-empty">&#128247; Add photo (optional)</span>`;
  return `<div class="photo-row" onclick="document.getElementById('${inputId}').click()">${badge}</div>`;
}

function saveState() {
  try {
    S.savedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
  } catch (e) { /* storage unavailable or full — fail silently */ }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function clearState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}
function hasMeaningfulProgress(saved) {
  return !!saved && (saved.screen !== "setup" || !!saved.product);
}

let S = {
  screen:"setup", product:"", date:today(), shift:ROUND_LABELS[0], operator:"",
  processIdx:0,
  currentRound:0,
  procOperators:{},
  roundData:ROUND_LABELS.map(() => emptyRound()),
  activeBraid:null,
  supName:"", verified:{}, finalisedAt:"",
  submitStatus:"", submitError:"",
  batchBase:"", batchNo:"", batchDay:1, reportedThroughIdx:0, dayRowNum:null,
  sheetBatchReg:null, sheetBatchRegLoading:false, sheetBatchRegError:"",
  logFilters:{date:"",product:"",search:""}, logResults:null, logLoading:false, logError:"", logDetailRow:null,
  batchReportFrom:"setup", batchReportBase:"", batchReportDay:1, batchReportRows:null, batchReportLoading:false, batchReportError:"",
  vrPin:"", vrName:"", vrRows:null, vrLoading:false, vrError:"", vrDetailRow:null, vrJustVerified:false
};

// helpers so rest of code stays concise
function curEntries()  { return S.roundData[S.currentRound].entries;  }
function curBraiding() { return S.roundData[S.currentRound].braiding; }

// Uses LOCAL calendar date (not UTC) — toISOString() would silently roll back to
// "yesterday" for any IST user working between midnight and 5:30am, which would corrupt
// same-day-upsert / batch-day-suffix logic right when night-shift batches need it most.
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function nowTime() { return new Date().toTimeString().slice(0,5); }
function pkey(no, ch) { return `${no}_${ch}`; }

function isCheckDone(chk, key) {
  const e = curEntries()[key];
  if (!e) return false;
  if (e.result === "NO_RUN") return true;
  if (chk.type === "pf_sub") return !!e.label;
  if (chk.type === "manual") return !!e.label;
  if (chk.type === "pf_manual") return e.result==="FAIL" || !!e.label;
  return true;
}

// ═══════════════════════════════════════════════
// BATCH NUMBERS
// Base: YYYY + reverse(DDMM) + "-" + ProductCode  (day the batch is first created)
// Continuing on a later calendar date appends "-N" (N = which day of work this is)
// ═══════════════════════════════════════════════
const BATCH_REG_KEY = "fqa12_batch_registry_v1";

function genBatchBase(dateStr, productCode) {
  const [y, m, d] = dateStr.split("-");
  const ddmm = `${d}${m}`;
  const reversed = ddmm.split("").reverse().join("");
  return `${y}${reversed}-${productCode}`;
}

// Two SEPARATE runs of the same product on the same date (e.g. two different customers'
// orders) would otherwise generate the identical Batch No. and silently overwrite each
// other's Sheet rows. When startInspection() detects that collision, it appends the next
// unused letter here — first extra run gets "-A", next "-B", and so on — making each one
// its own distinct batch identity from that point on (its own "Continue Existing Batch"
// entry, its own Approval Sample gate, its own Sheet rows).
function nextBatchSuffix(base, registry) {
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for (const letter of letters) {
    if (!registry[`${base}-${letter}`]) return letter;
  }
  return null;
}

function loadBatchRegistry() {
  try { return JSON.parse(localStorage.getItem(BATCH_REG_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveBatchRegistry(reg) {
  try { localStorage.setItem(BATCH_REG_KEY, JSON.stringify(reg)); }
  catch (e) { /* storage unavailable — fail silently */ }
}
// Registry is per-batch, but progress within a batch is tracked per-round (a "round" is
// now exactly whichever Shift was selected on Setup/Continue when that pass was done).
// reg[base] = { product, lastDay, lastDate, rounds: { [roundIdx]: {resumeIdx, dayStartIdx, lastDate, rowNum, complete} } }
function registerBatchDay(base, opts) {
  const reg = loadBatchRegistry();
  const existing = reg[base] || { rounds: {} };
  const rounds = Object.assign({}, existing.rounds);
  if (opts.roundIdx != null) {
    const prevRound = rounds[opts.roundIdx] || {};
    rounds[opts.roundIdx] = {
      resumeIdx:   opts.roundResumeIdx  != null ? opts.roundResumeIdx  : prevRound.resumeIdx || 0,
      dayStartIdx: opts.roundDayStartIdx!= null ? opts.roundDayStartIdx: prevRound.dayStartIdx || 0,
      lastDate:    opts.roundLastDate   || prevRound.lastDate || "",
      rowNum:      opts.roundRowNum     !== undefined ? opts.roundRowNum : (prevRound.rowNum || null),
      complete:    opts.roundComplete  != null ? !!opts.roundComplete : !!prevRound.complete
    };
  }
  reg[base] = {
    product:  opts.product,
    lastDay:  opts.batchLastDay,
    lastDate: opts.batchLastDate,
    rounds
  };
  saveBatchRegistry(reg);
}

// ═══════════════════════════════════════════════
// DEVICE IDENTIFICATION
// Which of the 4 DEVICE_USERS is submitting/verifying is tracked so rows can be traced
// back to a person, not a browser. Each person has their OWN PIN, stored in a small
// "PINs" tab in the Sheet (Name | PIN) — not localStorage — so it follows them to
// whichever device they pick up, rather than being tied to one browser. First use for a
// name self-sets its PIN (typed twice, to catch typos becoming a permanent lockout);
// every use after that must match. This is a mistake-guard, not real security: the
// backend has no server-side auth at all, so a PIN here only stops someone accidentally
// selecting the wrong person's name, same as it would on a shared shop-floor tablet.
// Setup remembers the last-used name per browser (see LAST_DEVICE_USER_KEY) purely as a
// convenience pre-fill; the PIN must still be entered every time regardless.
// ═══════════════════════════════════════════════
const PINS_TAB = "PINs";
const LAST_DEVICE_USER_KEY = "fqa12_last_device_user_v1";

async function fetchDevicePins() {
  const res = await fetch(`/api/log?sheet=${encodeURIComponent(PINS_TAB)}`, { cache: "no-store" });
  const data = await res.json();
  if (!res.ok) throw new Error((data && data.error && (data.error.error?.message || data.error)) || "Couldn't reach the PIN list.");
  return data.rows || [];
}

// Returns true once `name` is confirmed as whoever is actually using this device right
// now — either by matching their existing PIN, or, the first time a name has no PIN on
// record yet, by self-setting one (re-entered once to confirm). Shows its own alerts on
// failure, so callers just need to check the boolean.
async function verifyDevicePin(name, enteredPin) {
  let rows;
  try {
    rows = await fetchDevicePins();
  } catch (err) {
    alert("Couldn't check your PIN right now: " + err.message + " — try again.");
    return false;
  }
  const row = rows.find(r => r.Name === name);
  if (!row) {
    alert(`"${name}" isn't set up in the PINs list yet — ask an admin to add it.`);
    return false;
  }
  const stored = (row.PIN || "").trim();
  if (!stored) {
    const confirmPin = prompt(`No PIN set for ${name} yet on this list. Re-enter your new PIN to confirm it:`);
    if (confirmPin === null) return false; // cancelled
    if (confirmPin.trim() !== enteredPin.trim()) {
      alert("PINs didn't match — try again.");
      return false;
    }
    try {
      const res = await fetch("/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: "update", range: `${PINS_TAB}!B${row.__row}:B${row.__row}`, rows: [[enteredPin.trim()]] })
      });
      const data = await res.json();
      if (!res.ok) throw new Error((data && data.error && (data.error.error?.message || data.error)) || "Couldn't save your PIN.");
    } catch (err) {
      alert("Couldn't save your PIN: " + err.message + " — try again.");
      return false;
    }
    return true;
  }
  if (stored !== enteredPin.trim()) {
    alert(`Incorrect PIN for ${name}.`);
    return false;
  }
  return true;
}

// ═══════════════════════════════════════════════
// CROSS-DEVICE BATCH VISIBILITY
// localStorage's batch registry only knows about batches THIS browser has touched, so
// "Continue Existing Batch" showed a different list on every device — the phone only saw
// what the phone had worked on, the laptop only what the laptop had. The Sheet itself
// already has every submitted/paused round from every device, so this rebuilds an
// equivalent registry straight from /api/log and merges it with the local one: the Sheet
// wins on "does this batch/round exist" and "is it finalised" (that's the actual submitted
// truth, regardless of device); the local registry wins on "which process to resume at"
// since that resume point is never written to the Sheet.
// ═══════════════════════════════════════════════
// A batch that runs more than one calendar day gets a distinct "Batch No." per day —
// day 1 is the bare base (e.g. "20267062-14ESBB60"), day 2+ appends "-<day>". Used both
// to build the registry below and to identify exactly which day's rows belong to a
// specific batch report (see openBatchReport()).
function parseBatchNo(rawBatch) {
  const s = (rawBatch || "").trim();
  const m = s.match(/^(.*)-(\d+)$/);
  return m ? { base: m[1], day: parseInt(m[2], 10) } : { base: s, day: 1 };
}

function buildSheetBatchRegistry(rows) {
  const reg = {};
  (rows || []).forEach(r => {
    const rawBatch = (r["Batch No."] || "").trim();
    if (!rawBatch) return;
    const { base, day } = parseBatchNo(rawBatch);
    const roundIdx = ROUND_LABELS.indexOf(r["Shift / Sample"]);
    if (roundIdx < 0) return;
    const entry = reg[base] || { product: "", lastDay: 0, lastDate: "", rounds: {} };
    if (day >= entry.lastDay) { entry.lastDay = day; entry.lastDate = r["Date"] || entry.lastDate; entry.product = r["Product"] || entry.product; }
    if (!entry.rounds[roundIdx]) entry.rounds[roundIdx] = [];
    entry.rounds[roundIdx].push(r);
    reg[base] = entry;
  });
  // Oldest → newest per round, since a multi-day round gets one Sheet row per day
  // (buildSheetRow() windows each day's write to just that day's new checks).
  Object.values(reg).forEach(entry => {
    Object.values(entry.rounds).forEach(list => list.sort((a, b) => (a.Date || "").localeCompare(b.Date || "")));
  });
  return reg;
}

// Collapses one round's (possibly multi-day) Sheet rows into the same shape the local
// registry uses, so both can be compared/merged uniformly.
function sheetRoundSummary(rowsForRound) {
  if (!rowsForRound || !rowsForRound.length) return null;
  const last = rowsForRound[rowsForRound.length - 1];
  return {
    complete: rowsForRound.some(r => !!r["Finalised At"]),
    lastDate: last.Date || "",
    rowNum:   last.__row,
    verifiedThru: last["Verified Thru Process"] || null
  };
}

// The very first hit to /api/log after the backend has sat idle can be slow — a cold
// serverless start plus a fresh Google Sheets auth handshake measured 10s+ in testing,
// while every call right after returned in well under a second. Without a timeout, a
// slow/stuck first call left this screen stuck on "syncing…" forever with no visible
// signal that a retry was needed. 20s comfortably covers a cold start without making
// operators wait unreasonably long for a genuinely dead endpoint.
async function refreshSheetBatches() {
  S.sheetBatchRegLoading = true; S.sheetBatchRegError = ""; render();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 20000);
  try {
    const res = await fetch("/api/log", { cache: "no-store", signal: controller.signal });
    const data = await res.json();
    if (!res.ok) throw new Error((data && data.error && (data.error.error?.message || data.error)) || "Couldn't load batches");
    S.sheetBatchReg = buildSheetBatchRegistry(data.rows || []);
  } catch (err) {
    S.sheetBatchRegError = err.name === "AbortError"
      ? "Timed out reaching the Sheet (it may just be waking up) — tap Retry."
      : (err.message || "Couldn't load batches from the Sheet.");
  } finally {
    clearTimeout(timer);
  }
  S.sheetBatchRegLoading = false;
  render();
}

function mergedBatchRegistry() {
  const local = loadBatchRegistry();
  const sheetKnown = S.sheetBatchReg !== null;
  const sheet = S.sheetBatchReg || {};
  // Once the Sheet has been read at least once, it's the authority on what still exists —
  // a batch this device remembers locally but the Sheet no longer has (e.g. someone
  // cleared it out) should disappear from the list, not linger forever just because this
  // browser once touched it. Before the Sheet has loaded even once (S.sheetBatchReg still
  // null), fall back to local-only so something still shows instead of a blank list while
  // the very first sync is in flight.
  const bases = sheetKnown ? new Set(Object.keys(sheet)) : new Set(Object.keys(local));
  const merged = {};
  bases.forEach(base => {
    const l = local[base];
    const s = sheet[base];
    const roundKeys = new Set([
      ...(l ? Object.keys(l.rounds || {}) : []),
      ...(s ? Object.keys(s.rounds || {}) : [])
    ]);
    const rounds = {};
    roundKeys.forEach(riStr => {
      const ri = Number(riStr);
      const lr = l && l.rounds && l.rounds[ri];
      const sRows = s && s.rounds && s.rounds[ri];
      const sSummary = sheetRoundSummary(sRows);
      rounds[ri] = {
        resumeIdx:    lr ? (lr.resumeIdx || 0) : 0,
        dayStartIdx:  lr ? (lr.dayStartIdx || 0) : 0,
        lastDate:     (sSummary && sSummary.lastDate) || (lr && lr.lastDate) || "",
        rowNum:       (sSummary && sSummary.rowNum) || (lr && lr.rowNum) || null,
        complete:     sSummary ? sSummary.complete : !!(lr && lr.complete),
        verifiedThru: (sSummary && sSummary.verifiedThru) || null,
        knownLocally: !!lr,
        sheetRows:    sRows || null
      };
    });
    merged[base] = {
      product:  (s && s.product) || (l && l.product) || "",
      lastDay:  Math.max((s && s.lastDay) || 0, (l && l.lastDay) || 0),
      lastDate: (s && s.lastDate) || (l && l.lastDate) || "",
      rounds
    };
  });
  return merged;
}

// A round this device has never touched has no local resume point — this rebuilds
// whatever the Sheet's own summary schema captured for it (see vrSheetValue(), the same
// mapping the Verify Reports read-through view uses) directly into curEntries()/
// curBraiding(), tagged {fromSheet:true} for traceability. Checks the Sheet schema never
// tracks in the first place (most non-headline fields) stay blank regardless of device —
// that data was simply never sent. Rows are merged oldest → newest so a later day's value
// wins if a field were ever duplicated across days.
function hydrateRoundFromSheetRows(roundIdx, rows, productKey) {
  const rd = S.roundData[roundIdx];
  const product = PRODUCTS[productKey];
  const procs = buildProcesses(productKey);
  rows.forEach(row => {
    procs.forEach(p => {
      if (p.type === "braiding") {
        const n = product.braiding.machines;
        for (let i = 1; i <= n; i++) {
          const mKey = `BR-${String(i).padStart(2,"0")}`;
          const val = row[`${mKey} O.D.`];
          if (val) rd.braiding[mKey] = { result: inferResultFromLabel(val), label: val === "No Run" ? "No Run" : val, fromSheet: true };
        }
        return;
      }
      p.checks.forEach(c => {
        const val = vrSheetValue(row, p.no, c.key);
        if (val) {
          const k = pkey(p.no, c.key);
          rd.entries[k] = { result: inferResultFromLabel(val), label: val === "No Run" ? "" : val, time: row.Date || "", fromSheet: true };
        }
      });
    });
    if (row.Operator) {
      procs.forEach(p => { if (!S.procOperators[p.no]) S.procOperators[p.no] = row.Operator; });
    }
  });
}

// Mirrors vrJudge()'s classification of a raw Sheet label so hydrated entries carry a
// result code consistent with the rest of the app (NO_RUN badges, FAIL counts, etc.).
function inferResultFromLabel(label) {
  if (!label) return null;
  if (label === "No Run") return "NO_RUN";
  if (/FAIL|✗|Not Smooth/.test(label)) return "FAIL";
  return "PASS";
}

function braidStats() {
  const vals = Object.values(curBraiding());
  return {
    passN: vals.filter(v => v.result === "PASS").length,
    failN: vals.filter(v => v.result === "FAIL").length,
    naN:   vals.filter(v => v.result === "NO_RUN").length
  };
}

function isProcDone(proc) {
  if (proc.type === "braiding") {
    const n   = PRODUCTS[S.product].braiding.machines;
    const ms  = Array.from({length:n}, (_,i) => `BR-${String(i+1).padStart(2,"0")}`);
    const brg = curBraiding();
    return ms.every(m => brg[m] && brg[m].result);
  }
  return proc.checks.every(c => isCheckDone(c, pkey(proc.no, c.key)));
}

function allEntryKeys() {
  const keys = [];
  buildProcesses(S.product).forEach(p => {
    if (p.type === "braiding") keys.push(`${p.no}_braiding`);
    else p.checks.forEach(c => keys.push(pkey(p.no, c.key)));
  });
  return keys;
}

// ═══════════════════════════════════════════════
// RENDER ROUTER
// ═══════════════════════════════════════════════
function render() {
  const fns = { setup:rSetup, process:rProcess, review:rReview, submitted:rSubmitted, report:rReport, log:rLog, logdetail:rLogDetail,
    batchreport:rBatchReport, paused:rPaused, vrpin:rVrPin, vrname:rVrName, vrlist:rVrList, vrdetail:rVrDetail };
  document.getElementById("app").innerHTML = fns[S.screen]();
  saveState();
}

// ═══════════════════════════════════════════════
// SCREEN 1 — SETUP
// ═══════════════════════════════════════════════
// Approval Sample (ROUND_LABELS[0]) must be completed before any other shift can be
// started/continued, for every product, within a given batch. The bar to unlock is
// Approval Sample having been VERIFIED through at least one process — not fully finished —
// so a batch stuck on Process 040 all day doesn't have to sit completely idle: as soon as
// a verifier has signed off on whatever Approval Sample has reached so far, other shifts
// unlock (capped at that same verified point — see approvalSampleVerifiedThru()/navNext()).
// If Approval Sample hasn't been verified at all yet, the gate still fully applies, exactly
// like before. This both reports that fact AND snaps S.shift back to Approval Sample if it
// had drifted onto a locked one.
function enforceShiftGate() {
  const base = (S.product && S.date) ? genBatchBase(S.date, PRODUCTS[S.product].label) : null;
  const reg  = base ? mergedBatchRegistry()[base] : null;
  const approvalVerified = !!(reg && reg.rounds && reg.rounds[0] && reg.rounds[0].verifiedThru);
  const locked = !!base && !approvalVerified;
  if (locked && ROUND_LABELS.indexOf(S.shift) !== 0) {
    S.shift = ROUND_LABELS[0];
    S.currentRound = 0;
  }
  return locked;
}

// Where Approval Sample's verification currently stands for the ACTIVE batch (S.batchBase)
// — the ceiling every other shift is capped at. Null means nothing verified yet.
function approvalSampleVerifiedThru() {
  if (!S.batchBase) return null;
  const info = mergedBatchRegistry()[S.batchBase];
  return (info && info.rounds && info.rounds[0] && info.rounds[0].verifiedThru) || null;
}

function rSetup() {
  // Sheet-backed batch list is fetched once per app load (and on manual refresh) so
  // "Continue Existing Batch" shows the same batches regardless of which device is asking.
  if (S.sheetBatchReg === null && !S.sheetBatchRegLoading && !S.sheetBatchRegError) refreshSheetBatches();

  const pOpts = Object.keys(PRODUCTS).map(k =>
    `<option value="${k}" ${S.product===k?"selected":""}>${PRODUCTS[k].label} — ${PRODUCTS[k].desc}</option>`).join("");

  // Pre-fill "Prepared By" with whoever last confirmed a PIN on this browser — pure
  // convenience, the PIN is still required every time (see verifyDevicePin()).
  if (!S.operator) {
    const last = (() => { try { return localStorage.getItem(LAST_DEVICE_USER_KEY); } catch (e) { return null; } })();
    if (last && DEVICE_USERS.includes(last)) S.operator = last;
  }
  const duOpts = DEVICE_USERS.map(o =>
    `<option value="${o}" ${S.operator===o?"selected":""}>${o}</option>`).join("");

  const batchPreview = (S.product && S.date) ? genBatchBase(S.date, PRODUCTS[S.product].label) : "";
  const shiftLocked = enforceShiftGate();

  const registry  = mergedBatchRegistry();
  const batchKeys = Object.keys(registry);
  const contOpts  = batchKeys.map(b => {
    const rounds = registry[b].rounds || {};
    const roundSummary = ROUND_LABELS.map((lbl, i) => {
      const r = rounds[i];
      if (!r) return null;
      return `${lbl}: ${r.verifiedThru ? "V-" + r.verifiedThru : "not verified yet"}`;
    }).filter(Boolean).join(", ");
    return `<option value="${b}">${b} — ${registry[b].product} (day ${registry[b].lastDay} last done ${registry[b].lastDate})${roundSummary ? " · " + roundSummary : ""}</option>`;
  }).join("");

  return `
    <div class="header">
      <h1>F-QA-12 · Inprocess Inspection</h1>
      <p>Konneckt Hoses · Quality Control</p>
    </div>
    <div class="card">
      <div style="font-size:17px;font-weight:800;margin-bottom:4px;">Start Inspection</div>
      <div style="font-size:13px;color:#64748b;margin-bottom:16px;">Select details below to begin.</div>
      <label>Product</label>
      <select id="s-product" onchange="S.product=this.value;render()"><option value="">— Select product —</option>${pOpts}</select>
      <label>Date</label>
      <input type="date" id="s-date" value="${S.date}" onchange="S.date=this.value;render()">
      ${batchPreview ? `<div style="font-size:12px;color:#64748b;margin-top:6px;">Batch No. (auto): <strong>${batchPreview}</strong></div>` : ""}
      <label>Shift</label>
      <div class="shift-row">
        ${ROUND_LABELS.map((sh,shi) => {
          const isLocked = shiftLocked && shi !== 0;
          const cls = `shift-btn ${S.shift===sh?"on":""} ${isLocked?"locked":""}`;
          const click = isLocked
            ? `alert('Approval Sample must be verified (at least partially) for this batch before other shifts can be selected.')`
            : `S.shift='${sh}';S.currentRound=${shi};render()`;
          return `<div class="${cls}" onclick="${click}">${sh}</div>`;
        }).join("")}
      </div>
      ${shiftLocked ? `<div style="font-size:12px;color:#c2410c;margin-top:6px;">🔒 Approval Sample must be verified by Verify Reports (at least partially) before other shifts unlock.</div>` : ""}
      <label>Prepared By (Device ID)</label>
      <select id="s-op" onchange="S.operator=this.value;render()"><option value="">— Select —</option>${duOpts}</select>
      <label>PIN</label>
      <input type="password" inputmode="numeric" id="s-pin" placeholder="Your PIN"
        style="width:100%;padding:13px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px;outline:none;">
      <div style="font-size:11px;color:#94a3b8;margin-top:4px;">First time on any device? Type a new PIN — you'll confirm it once.</div>
      <button class="btn-primary" onclick="beginInspectionClicked()">Begin Inspection →</button>
      <button class="btn-outline" onclick="S.screen='log';render()">📊 View Inspection Log</button>
      <button class="btn-outline" style="background:#faf5ff;color:#7e22ce;border-color:#9333ea;" onclick="openVerifyReports()">🔒 Verify Reports</button>
    </div>
    ${batchKeys.length ? `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div style="font-weight:700;font-size:15px;">↻ Continue Existing Batch</div>
        <span style="font-size:11px;color:#94a3b8;cursor:pointer;" onclick="refreshSheetBatches()">${S.sheetBatchRegLoading ? "⏳ syncing…" : "↻ refresh"}</span>
      </div>
      <div style="font-size:12px;color:#64748b;margin-bottom:10px;">Pick a batch worked on a previous day, then select Prepared By, PIN, and Shift above before continuing. This list includes batches worked on any device.</div>
      ${S.sheetBatchRegError ? `<div class="alert" style="font-size:12px;">⚠ Couldn't sync with the Sheet: ${esc(S.sheetBatchRegError)} — showing only what's known on this device. <span style="text-decoration:underline;cursor:pointer;" onclick="refreshSheetBatches()">Retry</span></div>` : ""}
      <label style="margin-top:0;">Batch Number</label>
      <select id="s-batch"><option value="">— Select batch —</option>${contOpts}</select>
      <button class="btn-outline" style="background:#fff7ed;color:#c2410c;border-color:#f97316;" onclick="continueBatchClicked()">↻ Continue This Batch →</button>
      <button class="btn-outline" style="background:#eff6ff;color:#1d4ed8;border-color:#2563eb;" onclick="viewBatchReportClicked()">📄 View Full Report (All Shifts)</button>
    </div>` : (S.sheetBatchRegLoading ? `<div style="text-align:center;font-size:12px;color:#94a3b8;margin-top:4px;">Checking for batches from other devices…</div>` : "")}
    <div style="text-align:center;font-size:11px;color:#94a3b8;margin-top:4px;">F-QA-12 Rev.01 · Eff. 01.04.19</div>`;
}

// Buttons call these instead of startInspection()/continueBatch() directly — PIN check
// happens first, and only on success do we fall through to the real flow. Kept as thin
// wrappers so startInspection()/continueBatch() themselves stay synchronous and unchanged.
async function beginInspectionClicked() {
  const name = document.getElementById("s-op").value;
  const pin  = document.getElementById("s-pin").value;
  if (!name) { alert("Please select who's using this device (Prepared By)."); return; }
  if (!pin)  { alert("Please enter your PIN."); return; }
  if (!(await verifyDevicePin(name, pin))) return;
  try { localStorage.setItem(LAST_DEVICE_USER_KEY, name); } catch (e) {}
  startInspection();
}
async function continueBatchClicked() {
  const name = document.getElementById("s-op").value;
  const pin  = document.getElementById("s-pin").value;
  if (!name) { alert("Please select who's using this device (Prepared By)."); return; }
  if (!pin)  { alert("Please enter your PIN."); return; }
  if (!(await verifyDevicePin(name, pin))) return;
  try { localStorage.setItem(LAST_DEVICE_USER_KEY, name); } catch (e) {}
  continueBatch();
}

function startInspection() {
  S.product  = document.getElementById("s-product").value;
  S.date     = document.getElementById("s-date").value;
  S.operator = document.getElementById("s-op").value;
  if (!S.product)  { alert("Please select a product."); return; }
  if (!S.operator) { alert("Please select an operator."); return; }

  const gateBase = genBatchBase(S.date, PRODUCTS[S.product].label);
  const registry = mergedBatchRegistry();
  let finalBase = gateBase;

  if (registry[gateBase]) {
    // A batch already exists today for this exact product+date. That's normal if you're
    // resuming your own work-in-progress — but that should go through "Continue Existing
    // Batch" below, which is the only path that safely resumes a round. Landing here means
    // either a genuinely separate run (different customer/order sharing the same date and
    // product) or someone forgetting to use Continue — ask, since silently reusing the same
    // Batch No. would overwrite whatever's already saved under it.
    const isSeparateRun = confirm(
      `A batch for ${PRODUCTS[S.product].label} on ${S.date} already exists (${gateBase}).\n\n` +
      `Press OK if this is a SEPARATE run — a different customer or order — it'll be saved ` +
      `as its own new batch (${gateBase}-A, -B, …).\n\n` +
      `Press Cancel if you meant to continue that existing batch — use "Continue Existing ` +
      `Batch" below instead.`
    );
    if (!isSeparateRun) return;
    const suffix = nextBatchSuffix(gateBase, registry);
    if (!suffix) { alert("Too many separate runs for this product today — please contact an admin."); return; }
    finalBase = `${gateBase}-${suffix}`;
    // A brand-new run always starts fresh, regardless of whatever shift happened to be
    // selected before this prompt fired.
    S.shift = ROUND_LABELS[0];
    S.currentRound = 0;
  } else {
    // Defense in depth: the Setup screen's shift buttons already disable everything except
    // Approval Sample until it's been at least partially verified — this re-checks the rule
    // authoritatively regardless of UI state, since Approval Sample must come first for
    // every product. (A brand-new batch has nothing verified yet, so this always blocks —
    // matches today's behavior exactly for that case.)
    if (ROUND_LABELS.indexOf(S.shift) !== 0) {
      alert("Approval Sample must be verified (at least partially) for this batch before any other shift can be started.");
      return;
    }
  }

  S.batchBase = finalBase;
  S.batchDay  = 1;
  S.batchNo   = S.batchBase;
  S.reportedThroughIdx = 0;
  S.dayRowNum = null;
  S.processIdx = 0;
  S.currentRound = Math.max(0, ROUND_LABELS.indexOf(S.shift));
  S.procOperators = {};
  S.roundData = ROUND_LABELS.map(() => emptyRound());
  S.activeBraid = null; S.verified = {};
  S.screen = "process"; render();
}

// Continuing a batch picks up exactly where that SHIFT (= round) left off — process
// progress for that round carries forward (nothing is wiped). Which round is "active" is
// entirely determined by whichever Shift button is selected here, not by an in-app tab.
function continueBatch() {
  const base = document.getElementById("s-batch").value;
  if (!base) { alert("Please select a batch to continue."); return; }
  const op = document.getElementById("s-op").value;
  if (!op) { alert("Please select an operator (Prepared By)."); return; }
  const reg  = mergedBatchRegistry();
  const info = reg[base];
  if (!info) { alert("Batch not found."); return; }

  const roundIdx  = Math.max(0, ROUND_LABELS.indexOf(S.shift));
  const rounds    = info.rounds || {};
  const roundInfo = rounds[roundIdx];

  const approvalVerified = !!(rounds[0] && rounds[0].verifiedThru);
  if (roundIdx !== 0 && !approvalVerified) {
    alert("Approval Sample must be verified (at least partially) for this batch before other shifts can be continued.");
    return;
  }

  if (roundInfo && roundInfo.complete) {
    alert(`The "${S.shift}" shift for batch ${base} is already finalised.`);
    return;
  }

  const todayStr    = today();
  const batchSameDay = info.lastDate === todayStr;

  S.product   = info.product;
  S.operator  = op;
  S.date      = todayStr;
  S.batchBase = base;
  S.batchDay  = batchSameDay ? info.lastDay : info.lastDay + 1;
  S.batchNo   = S.batchDay <= 1 ? base : `${base}-${S.batchDay}`;
  S.currentRound = roundIdx;

  if (roundInfo && !roundInfo.knownLocally && roundInfo.sheetRows && roundInfo.sheetRows.length) {
    // This device has never worked on this round — there's no local resume point, but the
    // Sheet already has whatever was captured for it from wherever it WAS worked on. Rebuild
    // that into this round's entries and resume right after the last process it covers.
    hydrateRoundFromSheetRows(roundIdx, roundInfo.sheetRows, info.product);
    const procs = buildProcesses(info.product);
    let resumeIdx = procs.findIndex(p => !isProcDone(p));
    if (resumeIdx < 0) resumeIdx = procs.length - 1;
    S.processIdx = resumeIdx;
    S.reportedThroughIdx = resumeIdx;
    const todaysRow = roundInfo.sheetRows.find(r => r.Date === todayStr);
    S.dayRowNum = todaysRow ? todaysRow.__row : null;
  } else if (roundInfo) {
    const roundSameDay = roundInfo.lastDate === todayStr;
    S.processIdx = roundInfo.resumeIdx || 0;
    S.reportedThroughIdx = roundSameDay ? (roundInfo.dayStartIdx || 0) : (roundInfo.resumeIdx || 0);
    S.dayRowNum = roundSameDay ? (roundInfo.rowNum || null) : null;
  } else {
    // fresh round within an existing batch — never touched before
    S.processIdx = 0;
    S.reportedThroughIdx = 0;
    S.dayRowNum = null;
  }
  S.activeBraid = null;
  // procOperators / roundData / verified intentionally NOT reset — progress continues.
  S.screen = "process"; render();
}

// ═══════════════════════════════════════════════
// SCREEN 2 — PROCESS
// ═══════════════════════════════════════════════
function rProcess() {
  const procs = buildProcesses(S.product);
  const proc  = procs[S.processIdx];
  const total = procs.length;
  const pct   = Math.round((S.processIdx / total) * 100);
  const hasOp = !!S.procOperators[proc.no];
  const done  = hasOp && isProcDone(proc);

  const body = proc.type === "braiding" ? rBraiding(proc) : rChecks(proc);

  const canNoRun = S.batchDay > 1 && hasOp && !done;

  // Non-Approval-Sample shifts are capped at wherever Approval Sample's verification
  // currently stands — surface that here so it's not a surprise when "Next" gets blocked.
  const capNote = S.currentRound !== 0 ? (() => {
    const capNo = approvalSampleVerifiedThru();
    return capNo
      ? `<div style="font-size:12px;color:#7c3aed;background:#faf5ff;border:1px solid #e9d5ff;border-radius:8px;padding:8px 12px;margin-bottom:12px;">🔒 This shift is capped at Process ${capNo} — Approval Sample's currently verified point.</div>`
      : `<div style="font-size:12px;color:#c2410c;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:8px 12px;margin-bottom:12px;">🔒 Approval Sample hasn't been verified yet today — this shift can't proceed past this point until it is.</div>`;
  })() : "";

  return `
    <div class="header">
      <h1>Process ${proc.no} · ${proc.name}</h1>
      <p>${PRODUCTS[S.product].label} · ${S.date} · ${S.shift}${S.batchNo?` · Batch ${S.batchNo}`:""}</p>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="step-label">Step ${S.processIdx+1} of ${total}</div>
    </div>
    ${capNote}
    <div class="card">
      <span class="proc-badge">Process ${proc.no}</span>
      <div class="proc-title">${proc.name}</div>
      <div class="proc-machine">${proc.machine}</div>
      <hr class="proc-divider">
      <label style="margin-top:0;">Operator</label>
      <select id="proc-op" onchange="S.procOperators['${proc.no}']=this.value;render()">
        <option value="">— Select operator —</option>
        ${OPERATORS.map(o => `<option value="${o}" ${S.procOperators[proc.no]===o?"selected":""}>${o}</option>`).join("")}
      </select>
      ${hasOp ? `
      <hr class="proc-divider">
      ${body}
      ` : `
      <div class="alert" style="margin-top:14px;">⚠  Select an operator to begin this process.</div>
      `}
    </div>
    ${hasOp && !done ? `<div class="alert">⚠  Complete all checks to continue.</div>` : ""}
    <div class="nav-row no-print">
      <button class="btn-back" onclick="navBack()">← Back</button>
      ${canNoRun ? `<button class="btn-outline" style="width:auto;flex:1.8;margin-top:0;padding:15px 6px;font-size:12px;background:#f8fafc;color:#64748b;border-color:#cbd5e1;" onclick="markProcessNoRun()">⊘ No Run — Didn't Run Today</button>` : ""}
      <button class="btn-next" onclick="navNext()" ${done?"":"disabled"}>
        ${S.processIdx===total-1?"Review All →":"Next →"}
      </button>
    </div>
    <button class="btn-outline no-print" style="background:#fefce8;color:#854d0e;border-color:#eab308;margin-top:10px;" onclick="pauseBatch()">⏸ Save Progress &amp; Continue Later</button>`;
}

// ── normal checks ──
function rChecks(proc) {
  return proc.checks.map(c => {
    const key      = pkey(proc.no, c.key);
    const e        = curEntries()[key];
    const complete = isCheckDone(c, key);
    const cls      = complete ? (e.result==="PASS" ? "done-pass" : e.result==="NO_RUN" ? "done-na" : "done-fail") : "";

    let body = "";
    if (c.type === "pf") {
      body = `
        <div class="pf-row">
          <button class="pf-btn ${e?.result==="PASS"?"s-pass":""}"
            onclick="recordPF('${key}','PASS','${esc(c.passLabel)}')">✓ ${c.passLabel}</button>
          <button class="pf-btn ${e?.result==="FAIL"?"s-fail":""}"
            onclick="recordPF('${key}','FAIL','${esc(c.failLabel)}')">✗ ${c.failLabel}</button>
        </div>`;

    } else if (c.type === "pf_sub") {
      const passCls = e?.result==="PASS" ? (e.label ? "s-pass" : "s-pass-pending") : "";
      body = `
        <div class="pf-row">
          <button class="pf-btn ${passCls}" onclick="selectPass('${key}')">✓ PASS</button>
          <button class="pf-btn ${e?.result==="FAIL"?"s-fail":""}"
            onclick="recordPF('${key}','FAIL','${esc(c.failLabel)}')">✗ ${c.failLabel}</button>
        </div>`;
      if (e?.result === "PASS") {
        body += `
        <div class="sub-label">Select the measured range:</div>
        <div class="sub-row">
          ${c.passRanges.map(r =>
            `<button class="sub-btn ${e.label===r?"on":""}"
               onclick="recordSub('${key}','${esc(r)}')">${r}</button>`).join("")}
        </div>`;
      }

    } else if (c.type === "pf_manual") {
      const passCls = e?.result==="PASS" ? (e.label ? "s-pass" : "s-pass-pending") : "";
      body = `
        <div class="pf-row">
          <button class="pf-btn ${passCls}" onclick="selectPass('${key}')">✓ ${c.passLabel}</button>
          <button class="pf-btn ${e?.result==="FAIL"?"s-fail":""}"
            onclick="recordPF('${key}','FAIL','${esc(c.failLabel)}')">✗ ${c.failLabel}</button>
        </div>`;
      if (e?.result === "PASS") {
        const val = e?.label || "";
        body += `
        <div class="manual-row">
          <input id="manual_${key}" class="manual-input" type="number" step="0.01"
            placeholder="Enter measured value" value="${val}"
            onkeydown="if(event.key==='Enter')recordManual('${key}')"/>
          <span class="manual-unit">${c.unit||""}</span>
          <button class="manual-confirm" onclick="recordManual('${key}')">✓ Save</button>
        </div>`;
      }

    } else if (c.type === "manual") {
      const val = e?.label || "";
      body = `
        <div class="manual-row">
          <input id="manual_${key}" class="manual-input" type="number" step="0.01"
            placeholder="Enter value" value="${val}"
            onkeydown="if(event.key==='Enter')recordManual('${key}')"/>
          <span class="manual-unit">${c.unit||""}</span>
          <button class="manual-confirm" onclick="recordManual('${key}')">✓ Save</button>
        </div>`;

    } else if (c.type === "bands") {
      // No Run is only offered when continuing an existing batch on a later day — same
      // rule as the process-level "Mark whole process No Run" button — so a brand-new
      // day-1 batch can't skip a reading that was never actually taken.
      const canNoRunCheck = S.batchDay > 1;
      const noRunSel = e?.result === "NO_RUN";
      body = `
        <div class="bands-label">Select the measured value:</div>
        <div class="bands-row">
          ${c.bands.map(b => {
            const isPass = b.r === "PASS";
            const sel    = e?.label === b.label;
            const base   = isPass ? "b-pass-opt" : "b-fail-opt";
            const on     = sel   ? (isPass ? "b-pass-on" : "b-fail-on") : base;
            return `<button class="band-btn ${on}"
                      onclick="recordBand('${key}','${b.r}','${esc(b.label)}')">${b.label}</button>`;
          }).join("")}
          ${canNoRunCheck ? `<button class="band-btn ${noRunSel?"b-norun-on":"b-norun-opt"}"
                      onclick="recordBand('${key}','NO_RUN','No Run')">⊘ No Run</button>` : ""}
        </div>`;
    }

    const photoInputId = `photo_${key}`.replace(/[^a-zA-Z0-9_]/g, "_");
    const photoHtml = c.photo ? `
      ${rPhotoBadge(e, photoInputId)}
      <input type="file" accept="image/*" capture="environment" id="${photoInputId}" style="display:none"
        onchange="handlePhotoSelect('${key}', this)">` : "";

    return `
      <div class="check-item ${cls}">
        <div class="check-char">${c.key}</div>
        <div class="check-spec">Specification: <strong>${c.spec}</strong></div>
        <div class="check-method">Method: ${c.method}</div>
        ${body}
        ${complete ? `<div class="check-rec"><span>${e.label}</span><span style="color:#94a3b8">${e.time}</span></div>` : ""}
        ${photoHtml}
      </div>`;
  }).join("");
}

// ── wire braiding ──
function rBraiding(proc) {
  const p  = PRODUCTS[S.product].braiding;
  const n  = p.machines;
  const ms = Array.from({length:n}, (_,i) => `BR-${String(i+1).padStart(2,"0")}`);
  const st = braidStats();

  // machine grid
  const cells = ms.map(m => {
    const entry    = curBraiding()[m];
    const isActive = S.activeBraid === m;
    let cls = "", lbl = "Tap to set";
    if (isActive) { cls = "b-active"; lbl = "Setting…"; }
    else if (entry) {
      if      (entry.result==="PASS") { cls="b-pass"; lbl = entry.label; }
      else if (entry.result==="FAIL") { cls="b-fail"; lbl = "FAIL"; }
      else                            { cls="b-na";   lbl = "No Run"; }
    }
    const photoDot = entry?.photo ? `<span class="braid-photo-dot" title="Photo attached">&#128247;</span>` : "";
    return `<div class="braid-cell ${cls}" onclick="selectBraidMachine('${m}')">
      ${photoDot}
      <div class="braid-machine">${m}</div>
      <div class="braid-status">${lbl}</div>
    </div>`;
  }).join("");

  // selection panel
  let panel = "";
  if (S.activeBraid) {
    const bands    = p.odBands || [];
    const existing = curBraiding()[S.activeBraid];
    const bandBtns = bands.map(b => {
      const on = existing?.label === b.label ? "b-pass-on" : "b-pass-opt";
      return `<button class="braid-opt bo-pass ${on}"
                onclick="recordBraid('${S.activeBraid}','PASS','${esc(b.label)}')">${b.label}</button>`;
    }).join("");
    const failOn = existing?.result==="FAIL" ? "b-fail-on" : "b-fail-opt";
    const naOn   = existing?.result==="NO_RUN"  ? "b-na-on"  : "b-na-opt";
    const braidPhotoInputId = `photo_braid_${S.activeBraid}`.replace(/[^a-zA-Z0-9_]/g, "_");
    panel = `
      <div class="braid-panel">
        <div class="braid-panel-title">📍 ${S.activeBraid} — Select O.D. result:</div>
        <div class="braid-panel-opts">
          ${bandBtns}
          <button class="braid-opt bo-fail ${failOn}"
            onclick="recordBraid('${S.activeBraid}','FAIL','FAIL')">✗ FAIL</button>
          <button class="braid-opt bo-na ${naOn}"
            onclick="recordBraid('${S.activeBraid}','NO_RUN','No Run')">⊘ No Run</button>
        </div>
        ${rPhotoBadge(existing, braidPhotoInputId)}
        <input type="file" accept="image/*" capture="environment" id="${braidPhotoInputId}" style="display:none"
          onchange="handleBraidPhotoSelect('${S.activeBraid}', this)">
        <div class="braid-panel-cancel" onclick="S.activeBraid=null;render()">✕ Cancel</div>
      </div>`;
  }

  const tallyHtml = (st.passN + st.failN + st.naN) > 0 ? `
    <div class="braid-tally">
      <div class="tally-chip t-pass">✓ ${st.passN} PASS</div>
      <div class="tally-chip t-fail">✗ ${st.failN} FAIL</div>
      <div class="tally-chip t-na">⊘ ${st.naN} No Run</div>
    </div>` : "";

  return `
    <div class="braid-info">
      <strong>O.D. Spec:</strong> ${p.od} &nbsp;·&nbsp; <strong>Pitch:</strong> ${p.pitch}<br>
      <strong>Method:</strong> Vernier Caliper &nbsp;·&nbsp; <span style="color:#94a3b8">Tap a machine to set its result</span>
    </div>
    <div class="braid-grid">${cells}</div>
    ${panel}
    ${tallyHtml}`;
}

function selectBraidMachine(m) {
  S.activeBraid = S.activeBraid === m ? null : m;
  render();
}

function recordBraid(m, result, label) {
  const existing = curBraiding()[m] || {};
  curBraiding()[m] = { ...existing, result, label };
  S.activeBraid  = null;
  render();
}

// ── entry recorders ──
// All of these merge onto any existing entry (rather than replacing it outright) so a
// photo already attached via handlePhotoSelect()/handleBraidPhotoSelect() — which itself
// merges — is never silently wiped out just because the operator taps a result afterward.
function recordPF(key, result, label) {
  const existing = curEntries()[key] || {};
  curEntries()[key] = { ...existing, result, label, time: nowTime() }; render();
}
function selectPass(key) {
  const existing = curEntries()[key] || {};
  curEntries()[key] = { ...existing, result:"PASS", label:"", time: nowTime() }; render();
}
function recordSub(key, range) {
  const existing = curEntries()[key] || {};
  curEntries()[key] = { ...existing, result:"PASS", label:range, time: nowTime() }; render();
}
function recordBand(key, result, label) {
  const existing = curEntries()[key] || {};
  curEntries()[key] = { ...existing, result, label, time: nowTime() };
  if (key === pkey("090","Length")) {
    if (result === "NO_RUN") applyLengthNoRunCascade();
    else revertLengthNoRunCascade();
  }
  render();
}

// If Part Off (090) Length is No Run, the hose was never cut this round, which means
// nothing downstream of it — the rest of 090, and all of 100/120/130 — could have
// happened either. This fills all of that in as No Run too and submits straight for
// verification, skipping the Review screen entirely — there's nothing left for the
// operator to check by hand, so there's no reason to stop and show them a table first.
// (If an earlier process, before 090, isn't done yet, submitForVerification() still
// catches that with its usual alert — same guard as the manual Review flow always had.)
// Entries are tagged {auto:true} so revertLengthNoRunCascade() can safely undo exactly
// what it applied without ever touching anything the operator entered by hand.
function applyLengthNoRunCascade() {
  const procs   = buildProcesses(S.product);
  const idx090  = procs.findIndex(p => p.no === "090");
  const entries = curEntries();
  procs.slice(idx090).forEach(p => {
    if (p.type === "braiding") {
      const n = PRODUCTS[S.product].braiding.machines;
      const brg = curBraiding();
      for (let i = 1; i <= n; i++) {
        const m = `BR-${String(i).padStart(2,"0")}`;
        if (!brg[m] || brg[m].auto) brg[m] = { result:"NO_RUN", label:"No Run", auto:true };
      }
      return;
    }
    p.checks.forEach(c => {
      if (p.no === "090" && c.key === "Length") return; // already set by the caller
      const k = pkey(p.no, c.key);
      if (!entries[k] || entries[k].auto) entries[k] = { result:"NO_RUN", label:"No Run", time: nowTime(), auto:true };
    });
    if (!S.procOperators[p.no]) S.procOperators[p.no] = S.procOperators["090"] || S.operator;
  });
  S.processIdx = procs.length - 1;
  submitForVerification();
}

// Undoes exactly what applyLengthNoRunCascade() auto-filled — only entries still tagged
// {auto:true} are cleared, so anything the operator has since entered for real (which
// overwrites the auto tag) is left completely untouched.
function revertLengthNoRunCascade() {
  const procs   = buildProcesses(S.product);
  const idx090  = procs.findIndex(p => p.no === "090");
  const entries = curEntries();
  procs.slice(idx090).forEach(p => {
    if (p.type === "braiding") {
      const brg = curBraiding();
      Object.keys(brg).forEach(m => { if (brg[m] && brg[m].auto) delete brg[m]; });
      return;
    }
    p.checks.forEach(c => {
      if (p.no === "090" && c.key === "Length") return;
      const k = pkey(p.no, c.key);
      if (entries[k] && entries[k].auto) delete entries[k];
    });
  });
}
function recordManual(key) {
  const val = document.getElementById("manual_" + key)?.value?.trim();
  if (!val) return;
  const existing = curEntries()[key] || {};
  curEntries()[key] = { ...existing, result:"PASS", label: val, time: nowTime() }; render();
}

function navBack() {
  if (S.processIdx===0) S.screen="setup"; else S.processIdx--;
  S.activeBraid = null; render();
}
function navNext() {
  const procs = buildProcesses(S.product);
  const proc  = procs[S.processIdx];
  if (!S.procOperators[proc.no]) { alert("Please select an operator for this process."); return; }

  // Every shift EXCEPT Approval Sample is capped at wherever Approval Sample's own
  // verification currently stands — see enforceShiftGate()/approvalSampleVerifiedThru().
  // This only blocks moving FURTHER; anything already recorded stays exactly as it is.
  if (S.currentRound !== 0) {
    const capNo  = approvalSampleVerifiedThru();
    const capIdx = capNo ? procs.findIndex(p => p.no === capNo) : -1;
    if (S.processIdx >= capIdx) {
      alert(capNo
        ? `This shift can't move past Process ${proc.no} yet — Approval Sample has only been verified through Process ${capNo}. Check back once that moves further (tap "↻ refresh" on Setup to pull the latest).`
        : `This shift can't proceed yet — Approval Sample hasn't been verified at all today. Check back once at least part of it has been verified.`);
      return;
    }
  }

  S.activeBraid = null;
  if (S.processIdx < procs.length-1) S.processIdx++;
  else S.screen = "review";
  render();
}

// Only available when continuing an existing batch on a later day (S.batchDay > 1).
// Marks every check in the current process as No Run for today's session, then advances.
function markProcessNoRun() {
  const procs = buildProcesses(S.product);
  const proc  = procs[S.processIdx];
  if (proc.type === "braiding") {
    const n  = PRODUCTS[S.product].braiding.machines;
    const ms = Array.from({length:n}, (_,i) => `BR-${String(i+1).padStart(2,"0")}`);
    ms.forEach(m => { curBraiding()[m] = { result:"NO_RUN", label:"No Run" }; });
  } else {
    proc.checks.forEach(c => {
      const key = pkey(proc.no, c.key);
      curEntries()[key] = { result:"NO_RUN", label:"No Run", time: nowTime() };
    });
  }
  // Bulk-marking Part Off (090) No Run this way means the same "nothing downstream
  // happened either" logic applies as when Length alone is marked No Run.
  if (proc.no === "090") { applyLengthNoRunCascade(); render(); return; }
  render();
  navNext();
}

// ═══════════════════════════════════════════════
// SCREEN 3 — REVIEW
// ═══════════════════════════════════════════════
function rReview() {
  const procs  = buildProcesses(S.product);
  // count fails across ALL rounds
  let totalFails = 0;
  S.roundData.forEach(rd => {
    totalFails += Object.values(rd.entries).filter(e=>e.result==="FAIL").length;
    totalFails += Object.values(rd.braiding).filter(v=>v.result==="FAIL").length;
  });

  const hdr = ROUND_LABELS.map(l=>`<th style="font-size:11px;padding:4px 6px;">${l}</th>`).join("");

  const rows = procs.map(proc => {
    if (proc.type === "braiding") {
      const cells = S.roundData.map(rd => {
        const vals = Object.values(rd.braiding);
        if (!vals.length) return `<td style="color:#94a3b8;font-size:12px;">—</td>`;
        const f = vals.filter(v=>v.result==="FAIL").length;
        const allNoRun = vals.every(v=>v.result==="NO_RUN");
        const cls = allNoRun ? "b-na" : f===0 ? "b-ok" : "b-ng";
        const lbl = allNoRun ? "No Run" : f===0 ? "OK" : "NG";
        return `<td><span class="badge ${cls}" style="font-size:11px;">${lbl}</span></td>`;
      }).join("");
      return `<tr><td colspan="2" style="font-size:12px;color:#1e3a5f;font-weight:700;">030 Wire Braiding</td>${cells}</tr>`;
    }
    return proc.checks.map((c,ci) => {
      const cells = S.roundData.map(rd => {
        const e = rd.entries[pkey(proc.no, c.key)];
        if (!e) return `<td style="color:#94a3b8;font-size:12px;">—</td>`;
        const cls = e.result==="PASS" ? "b-ok" : e.result==="NO_RUN" ? "b-na" : "b-ng";
        return `<td><span class="badge ${cls}" style="font-size:11px;">${e.label||e.result}</span></td>`;
      }).join("");
      return `<tr>
        <td style="font-size:11px;color:#64748b;">${ci===0?"P"+proc.no:""}</td>
        <td style="font-size:12px;">${c.key}</td>
        ${cells}
      </tr>`;
    }).join("");
  }).join("");

  return `
    <div class="header"><h1>Review — All Readings</h1>
      <p>${PRODUCTS[S.product].label} · ${S.operator} · ${S.date}${S.batchNo?` · Batch ${S.batchNo}`:""}</p></div>
    ${totalFails>0
      ? `<div class="alert">⚠  ${totalFails} check(s) FAILED across all readings.</div>`
      : `<div class="alert green">✅ All readings complete. Ready for verification.</div>`}
    <div class="card" style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr style="background:#f1f5f9;">
          <th style="font-size:11px;padding:4px 6px;">Proc</th>
          <th style="font-size:11px;padding:4px 6px;">Check</th>
          ${hdr}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="nav-row no-print">
      <button class="btn-back" onclick="S.processIdx=buildProcesses(S.product).length-1;S.screen='process';render()">← Edit</button>
      <button class="btn-next" onclick="submitForVerification()">Submit for Verification →</button>
    </div>`;
}

// The operator's job ends here: once every process is done, they submit and hand off.
// There is no local "finalise/print" step for them anymore — verification, finalising,
// and printing are all done later by a supervisor via the separate, cross-device
// "Verify Reports" flow (see below). This just needs every process DONE (real data or
// No Run) for the current round/shift.
function submitForVerification() {
  const procs = buildProcesses(S.product);
  const notDone = procs.filter(p => !isProcDone(p));
  if (notDone.length > 0) { alert(`Please complete all processes first — ${notDone.length} remaining.`); return; }
  S.finalisedAt = new Date().toLocaleString("en-IN");
  if (S.batchBase) {
    const procCount = buildProcesses(S.product).length;
    registerBatchDay(S.batchBase, {
      product: S.product,
      batchLastDay: S.batchDay,
      batchLastDate: S.date,
      roundIdx: S.currentRound,
      roundResumeIdx: procCount,
      roundDayStartIdx: S.reportedThroughIdx,
      roundLastDate: S.date,
      roundComplete: true
    });
  }
  S.screen = "submitted"; render();
  submitToSheet(); // fires automatically — no manual step needed
}

// ═══════════════════════════════════════════════
// SCREEN 4 — SUBMITTED (operator's flow ends here; verifier takes it from here)
// ═══════════════════════════════════════════════
function rSubmitted() {
  const submitHtml = S.submitStatus === "loading"
    ? `<div class="alert">⏳ Submitting to Google Sheet…</div>`
    : S.submitStatus === "done"
    ? `<div class="alert green">✅ Submitted to Google Sheet.</div>`
    : S.submitStatus === "error"
    ? `<div class="alert">⚠ Couldn't submit automatically: ${(S.submitError||"").replace(/</g,"&lt;")} · <span style="text-decoration:underline;cursor:pointer;" onclick="submitToSheet()">Retry</span></div>`
    : "";
  return `
    <div class="header">
      <h1>✅ Submitted for Verification</h1>
      <p>${PRODUCTS[S.product] ? PRODUCTS[S.product].label : ""}${S.batchNo?` · Batch ${S.batchNo}`:""}</p>
    </div>
    ${submitHtml}
    <div class="card">
      <div style="font-size:16px;font-weight:800;color:#1e3a5f;margin-bottom:6px;">Nice work — you're done here</div>
      <div style="font-size:13px;color:#64748b;">This report now goes to a supervisor for review, verification and sign-off from a separate device — no further action needed from you.</div>
    </div>
    <button class="btn-primary" onclick="newInspection()">+ New Inspection</button>`;
}

// Saves progress mid-batch without requiring every process to be finished.
// Writes/updates a partial row (today's new work only, for the CURRENT round/shift) and
// marks that round resumable at exactly this process, so it shows up under
// "Continue Existing Batch" + that Shift on Setup.
function pauseBatch() {
  if (!S.batchBase) { alert("No active batch to pause."); return; }
  if (!hasNewProgressToReport()) { alert("Nothing new to save since your last checkpoint."); return; }
  registerBatchDay(S.batchBase, {
    product: S.product,
    batchLastDay: S.batchDay,
    batchLastDate: S.date,
    roundIdx: S.currentRound,
    roundResumeIdx: S.processIdx,
    roundDayStartIdx: S.reportedThroughIdx,
    roundLastDate: S.date,
    roundComplete: false
  });
  S.screen = "paused"; render();
  submitToSheet();
}

// Only the CURRENT round's progress matters here — other rounds of the same batch are
// saved/tracked independently via their own continuations.
function hasNewProgressToReport() {
  const procs = buildProcesses(S.product);
  const procOrder = {};
  procs.forEach((pr, i) => { procOrder[pr.no] = i; });
  const reportedThru = S.reportedThroughIdx || 0;
  const braidProc = procs.find(pr => pr.type === "braiding");
  const braidIdx  = braidProc ? procOrder[braidProc.no] : -1;
  const rd = S.roundData[S.currentRound];
  if (!rd) return false;
  const hasEntry = Object.keys(rd.entries).some(k => (procOrder[k.split("_")[0]] ?? 0) >= reportedThru);
  const hasBraid = braidIdx >= reportedThru && Object.keys(rd.braiding).length > 0;
  return hasEntry || hasBraid;
}

// ═══════════════════════════════════════════════
// MASTER SHEET SCHEMA — shared by xlsx export & Google Sheets submission
// ═══════════════════════════════════════════════
const SHEET_HEADERS = [
  "Date","Product","Shift / Sample","Operator",
  "O.D. Spec","O.D. Measured","I.D. Spec","I.D. Measured","Appearance",
  ...Array.from({length:18}, (_,i) => `BR-${String(i+1).padStart(2,"0")} O.D.`),
  "Length","Wire Cut","Appearance (P090)",
  "O.D. Photo","I.D. Photo","Pressure Photo (P050)","Length Photo (P090)",
  "Crimp O.D. Photo (P120)","Pressure Testing Photo (P120)","Fitting Load Test Photo (P120)","Air Leakage Photo (P120)",
  "Braiding Photos","Supervisor","Finalised At","Crimp O.D. Measured (P120)","Batch No.",
  "Verified By","Verified At","Device ID","Verified Device ID",
  ...Array.from({length:18}, (_,i) => `BR-${String(i+1).padStart(2,"0")} Photo`),
  "Verified Thru Process"
];
// "Verified Thru Process" is a cumulative high-water mark, not a one-time stamp: it holds
// the highest process number (e.g. "070") that had any data on it the last time someone
// verified this row. verifyVrRow() only ever moves it forward — a verifier reviewing a row
// again later is reviewing just the NEW processes since this value, not redoing the whole
// row. See highestFilledProcess() and loadVrList().
// The legacy "Braiding Photos" column (packed "BR-01: url; BR-02: url; ..." single cell)
// is kept exactly as-is for backward compatibility with historical rows — reflowing/removing
// a column in the middle of a live sheet with existing data is too risky. The 18 columns
// below give each machine its own dedicated photo cell going forward; see
// currentBraidPhotoCols() and its isolated write in submitToSheet().
// Number of DATA columns the operator's own writes ever touch (through "Batch No.").
// "Verified By"/"Verified At" are appended afterward and are only ever written by the
// separate, cross-device Verify Reports flow — kept out of this range so the two sides
// can never overwrite each other. A1=col1 ... "Batch No." is the 43rd column = AQ.
// Columns 46/47 ("Device ID"/"Verified Device ID") follow the same isolation pattern —
// each is its own single-cell write (see verifyDevicePin(), submitToSheet(), verifyVrRow()),
// so neither can collide with the main data write or with each other.
const SHEET_DATA_COLS = 43;
function colLetter(n) { // 1-indexed column number -> spreadsheet letter(s)
  let s = "";
  while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

// Local/export snapshot — shows the FULL current picture across all rounds, unwindowed.
// Used only by exportToLog(); the actual Sheet submission uses buildSheetRow() below.
function buildSheetRows() {
  const p = PRODUCTS[S.product];
  if (!p) return [];
  return S.roundData.map((rd, i) => {
    if (!rd || !Object.keys(rd.entries).length) return null;
    const g = (no, key) => rd.entries[pkey(no, key)] || {};
    const brCols = Array.from({length:18}, (_, bi) => {
      const m = `BR-${String(bi+1).padStart(2,"0")}`;
      return (rd.braiding[m] && rd.braiding[m].label) || "";
    });
    const braidPhotos = Object.keys(rd.braiding)
      .filter(m => rd.braiding[m] && rd.braiding[m].photo)
      .map(m => `${m}: ${rd.braiding[m].photo}`)
      .join("; ");
    return [
      S.date, p.label, ROUND_LABELS[i], S.procOperators["040"] || S.operator,
      p.extruder.od, g("040","O.D.").label || "",
      p.extruder.id, g("040","I.D.").label || "",
      g("040","Appearance").label || "",
      ...brCols,
      g("090","Length").label || "", g("090","Wire Cut").label || "", g("090","Appearance").label || "",
      g("040","O.D.").photo || "", g("040","I.D.").photo || "", g("050","Pressure").photo || "", g("090","Length").photo || "",
      g("120","Crimp O.D.").photo || "", g("120","Pressure Testing").photo || "", g("120","Fitting Load Test").photo || "", g("120","Air Leakage").photo || "",
      braidPhotos, S.supName, S.finalisedAt, g("120","Crimp O.D.").label || "", S.batchNo || ""
    ];
  }).filter(Boolean);
}

// Sheet-submission row — CURRENT round only, windowed to just what's new since the last
// save (pause or finalise) for this round, so a same-day update never re-writes stale data.
function buildSheetRow() {
  const p = PRODUCTS[S.product];
  if (!p) return null;
  const rd = S.roundData[S.currentRound];
  if (!rd || !Object.keys(rd.entries).length) return null;

  const procs = buildProcesses(S.product);
  const procOrder = {};
  procs.forEach((pr, i) => { procOrder[pr.no] = i; });
  const reportedThru = S.reportedThroughIdx || 0;
  const braidProc = procs.find(pr => pr.type === "braiding");
  const braidIdx  = braidProc ? procOrder[braidProc.no] : -1;
  const braidWindowedOut = braidIdx >= 0 && braidIdx < reportedThru;

  const g = (no, key) => {
    if ((procOrder[no] ?? 0) < reportedThru) return {};
    return rd.entries[pkey(no, key)] || {};
  };
  const brCols = Array.from({length:18}, (_, bi) => {
    if (braidWindowedOut) return "";
    const m = `BR-${String(bi+1).padStart(2,"0")}`;
    return (rd.braiding[m] && rd.braiding[m].label) || "";
  });
  const braidPhotos = braidWindowedOut ? "" : Object.keys(rd.braiding)
    .filter(m => rd.braiding[m] && rd.braiding[m].photo)
    .map(m => `${m}: ${rd.braiding[m].photo}`)
    .join("; ");

  return [
    S.date, p.label, ROUND_LABELS[S.currentRound], S.procOperators["040"] || S.operator,
    p.extruder.od, g("040","O.D.").label || "",
    p.extruder.id, g("040","I.D.").label || "",
    g("040","Appearance").label || "",
    ...brCols,
    g("090","Length").label || "", g("090","Wire Cut").label || "", g("090","Appearance").label || "",
    g("040","O.D.").photo || "", g("040","I.D.").photo || "", g("050","Pressure").photo || "", g("090","Length").photo || "",
    g("120","Crimp O.D.").photo || "", g("120","Pressure Testing").photo || "", g("120","Fitting Load Test").photo || "", g("120","Air Leakage").photo || "",
    braidPhotos, S.supName, S.finalisedAt, g("120","Crimp O.D.").label || "", S.batchNo || ""
  ];
}

// Per-machine braiding photo URLs (BR-01..BR-18) for the CURRENT round, one dedicated cell
// each — written separately from buildSheetRow() via its own isolated range (see
// submitToSheet()), same pattern as Device ID. Mirrors buildSheetRow()'s windowing: if this
// round's braiding step was already reported in an earlier same-day save, everything comes
// back blank so a later save can never blank out photos already committed to the Sheet.
function currentBraidPhotoCols() {
  const p = PRODUCTS[S.product];
  if (!p) return Array.from({length:18}, () => "");
  const rd = S.roundData[S.currentRound];
  if (!rd) return Array.from({length:18}, () => "");

  const procs = buildProcesses(S.product);
  const procOrder = {};
  procs.forEach((pr, i) => { procOrder[pr.no] = i; });
  const reportedThru = S.reportedThroughIdx || 0;
  const braidProc = procs.find(pr => pr.type === "braiding");
  const braidIdx  = braidProc ? procOrder[braidProc.no] : -1;
  const braidWindowedOut = braidIdx >= 0 && braidIdx < reportedThru;
  if (braidWindowedOut) return Array.from({length:18}, () => "");

  return Array.from({length:18}, (_, bi) => {
    const m = `BR-${String(bi+1).padStart(2,"0")}`;
    return (rd.braiding[m] && rd.braiding[m].photo) || "";
  });
}

// A row number cached in S.dayRowNum / the batch registry can go stale if someone deletes
// or inserts rows directly in the Sheet UI (every row below the edit point shifts). Before
// trusting a cached row number for an update, re-check it against a fresh read: if the row
// no longer has this batch's Batch No. + Shift, search for the row that actually does; if no
// row anywhere still matches, return null so the caller appends a fresh row instead of
// silently overwriting whatever unrelated data now sits at the stale row number.
async function locateRow(rowNum, expectBatchNo, expectShift, expectDate) {
  try {
    const res = await fetch(`/api/log?date=${encodeURIComponent(expectDate || "")}`, { cache: "no-store" });
    if (!res.ok) return rowNum || null; // can't verify — fall back to trusting the cached number
    const data = await res.json();
    const rows = (data && data.rows) || [];
    const matches = r => (r["Batch No."] || "") === expectBatchNo && (r["Shift / Sample"] || "") === expectShift;
    if (rowNum) {
      const atRow = rows.find(r => r.__row === rowNum);
      if (atRow && matches(atRow)) return rowNum; // still correct — nothing shifted
    }
    const found = rows.find(matches);
    return found ? found.__row : null;
  } catch (e) {
    return rowNum || null; // network hiccup — don't block the save, fall back to old behavior
  }
}

// Same-day upsert: the FIRST save of a given calendar day for this round appends a fresh
// row (and remembers its row number); any LATER save on that SAME calendar date updates
// that exact row in place instead of appending another one. A genuinely new calendar
// date (continuing tomorrow, etc.) always appends a fresh row via continueBatch().
async function submitToSheet(isRetry) {
  if (!isRetry) { S.submitStatus = "loading"; S.submitError = ""; render(); }
  try {
    const row = buildSheetRow();
    if (!row) throw new Error("No data to submit for this round yet.");

    let rowNum = S.dayRowNum || null;
    if (rowNum) {
      const verified = await locateRow(rowNum, S.batchNo, ROUND_LABELS[S.currentRound], S.date);
      if (verified !== rowNum) { rowNum = verified; S.dayRowNum = rowNum; }
    }
    let data;
    if (rowNum) {
      const range = `A${rowNum}:${colLetter(SHEET_DATA_COLS)}${rowNum}`;
      const res = await fetch("/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: "update", range, rows: [row] })
      });
      data = await res.json();
      if (!res.ok) {
        const msg = (data && data.error && (data.error.error?.message || data.error)) || "Submit failed";
        throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
      }
    } else {
      const res = await fetch("/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rows: [row] })
      });
      data = await res.json();
      if (!res.ok) {
        const msg = (data && data.error && (data.error.error?.message || data.error)) || "Submit failed";
        throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
      }
      const updatedRange = data.result && data.result.updatedRange;
      const m = updatedRange && updatedRange.match(/![A-Z]+(\d+)/);
      if (m) { rowNum = parseInt(m[1], 10); S.dayRowNum = rowNum; }
    }

    // Persist the row number + resume point into the registry for this round so a later
    // same-day save (or a same-day re-open) can find and update the same row.
    if (S.batchBase && rowNum) {
      registerBatchDay(S.batchBase, {
        product: S.product,
        batchLastDay: S.batchDay,
        batchLastDate: S.date,
        roundIdx: S.currentRound,
        roundRowNum: rowNum,
        roundLastDate: S.date
      });
    }

    // Stamp which device made this save — its own isolated single-cell write, appended
    // after Verified By/At (see DEVICE IDENTIFICATION above), so it can never misalign the
    // main data columns. Best-effort: a failure here must never block the real submission.
    // keepalive:true matters here — without it, a plain fetch() can get silently dropped by
    // the browser the instant the page navigates to the next screen (which happens almost
    // immediately after a save on a phone), so this write would "fire" but never land. That
    // was confirmed in production: every submitted row had a blank Device ID despite this
    // code running every time — the self-verification check in Verify Reports depends on
    // this column actually being populated, so a dropped write here is a real gap, not just
    // a cosmetic one.
    if (rowNum) {
      const deviceCol = colLetter(SHEET_DATA_COLS + 3);
      fetch("/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        keepalive: true,
        body: JSON.stringify({ mode: "update", range: `${deviceCol}${rowNum}:${deviceCol}${rowNum}`, rows: [[S.operator || ""]] })
      }).catch(() => {});
    }

    // Per-machine braiding photos (BR-01..BR-18), each in its own dedicated column after
    // Verified Device ID — isolated write, best-effort, never blocks the real submission.
    // Skipped entirely if there's nothing to write (also naturally true when this round's
    // braiding step was already reported in an earlier same-day save).
    if (rowNum) {
      const braidCols = currentBraidPhotoCols();
      if (braidCols.some(v => v)) {
        const startCol = colLetter(SHEET_DATA_COLS + 5);
        const endCol   = colLetter(SHEET_DATA_COLS + 22);
        fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          keepalive: true,
          body: JSON.stringify({ mode: "update", range: `${startCol}${rowNum}:${endCol}${rowNum}`, rows: [braidCols] })
        }).catch(() => {});
      }
    }

    // NOTE: reportedThroughIdx is deliberately NOT advanced here — it represents "start of
    // today" for this round and must stay fixed across multiple same-day saves, since each
    // save now UPDATES the same row (a full snapshot of today's work), not just an increment.
    // It only moves forward when a genuinely new calendar day begins (see continueBatch()).
    S.submitStatus = "done";
    render();
  } catch (err) {
    if (!isRetry) {
      setTimeout(() => submitToSheet(true), 4000);
      return;
    }
    S.submitStatus = "error";
    S.submitError = err.message;
    render();
  }
}

function exportToLog() {
  const rows = buildSheetRows();

  const ws = XLSX.utils.aoa_to_sheet([SHEET_HEADERS, ...rows]);
  const wb = XLSX.utils.book_new();

    totalF += Object.values(rd.entries).filter(e=>e.result==="FAIL").length;

  const obsHdr = ROUND_LABELS.map(l=>`<th>${l}</th>`).join("");
  const jdgHdr = ROUND_LABELS.map(l=>`<th>OK/NG</th>`).join("");

  const rows = procs.map((proc) => {
    if (proc.type === "braiding") {
      const p   = PRODUCTS[S.product].braiding;

      const ms  = Array.from({length:n}, (_,i) => `BR-${String(i+1).padStart(2,"0")}`);
      const obsCells = S.roundData.map(rd => {
        const detail = ms.map(m => rd.braiding[m]?.label).filter(Boolean).join("  ·  ");

      const jdgCells = S.roundData.map(rd => {

        const cls = allNoRun ? "b-na" : f===0 ? "b-ok" : "b-ng";
        const lbl = allNoRun ? "No Run" : f===0 ? "OK" : "NG";
        return `<td><span class="badge ${cls}">${lbl}</span></td>`;
      }).join("");

        <td>${S.procOperators[proc.no]||S.operator}</td><td>${S.supName}</td>
      </tr>`;
    }
    return proc.checks.map((c, ci) => {
      const obsCells = S.roundData.map(rd => {
        const e = rd.entries[pkey(proc.no, c.key)];

      const jdgCells = S.roundData.map(rd => {

      return `<tr ${ci===0?"class='first'":""}>

  return `

// photo columns buildSheetRow() writes. Used by rLogDetail() to show a photo link next
// to each reading, same idea as vrSheetValue() does for the reading itself.
function logPhotoValue(procNo, checkKey, row) {
  const col = {
    "040|O.D.": "O.D. Photo", "040|I.D.": "I.D. Photo",
    "050|Pressure": "Pressure Photo (P050)",
    "090|Length": "Length Photo (P090)",
    "120|Crimp O.D.": "Crimp O.D. Photo (P120)",
    "120|Pressure Testing": "Pressure Testing Photo (P120)",
    "120|Fitting Load Test": "Fitting Load Test Photo (P120)",
    "120|Air Leakage": "Air Leakage Photo (P120)"
  }[`${procNo}|${checkKey}`];
  return col ? (row[col] || "") : "";
}

// A machine's photo, preferring its own dedicated "BR-xx Photo" column; falls back to
// parsing the legacy packed "Braiding Photos" cell for rows submitted before that column
// existed.
function logBraidPhoto(row, m) {
  const dedicated = row[`${m} Photo`];
  if (dedicated) return dedicated;
  const packed = row["Braiding Photos"] || "";
  const hit = packed.split(";").map(s => s.trim()).find(s => s.startsWith(`${m}:`));
  return hit ? hit.split(":").slice(1).join(":").trim() : "";
}

// ═══════════════════════════════════════════════
// BATCH REPORT — all 6 shifts of one batch-day, side by side on one printable page.
// Pulls live from the Sheet (not S.roundData) so it works regardless of which device(s)
// did which shift. One page per batch-DAY: a batch that ran 3 days gets 3 separate
// reports (matching the paper form, which is per-day), not one page cramming every day.
// ═══════════════════════════════════════════════
async function openBatchReport(base, day, fromScreen) {
  S.batchReportFrom = fromScreen || S.screen;
  S.batchReportBase = base;
  S.batchReportDay = day;
  S.batchReportRows = null;
  S.batchReportLoading = true;
  S.batchReportError = "";
  S.screen = "batchreport";
  render();

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 20000);
  try {
    const res = await fetch(`/api/log?search=${encodeURIComponent(base)}`, { signal: controller.signal });
    const data = await res.json();
    if (!res.ok) {
      const msg = (data && data.error && (data.error.error?.message || data.error)) || "Couldn't load this batch.";
      throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
    }
    // The search above is a broad substring match server-side; narrow to rows whose
    // Batch No. parses to exactly this base+day (a day-2+ batch no. contains the base as
    // a substring too, so this exact check is what actually pins down the right day).
    S.batchReportRows = (data.rows || []).filter(r => {
      const parsed = parseBatchNo(r["Batch No."]);
      return parsed.base === base && parsed.day === day;
    });
  } catch (err) {
    S.batchReportError = err.name === "AbortError"
      ? "Timed out reaching the Sheet (it may just be waking up) — try again."
      : err.message;
  } finally {
    clearTimeout(timer);
  }
  S.batchReportLoading = false;
  render();
}

// Reads the batch selected in the "Continue Existing Batch" dropdown and opens its report.
// Prompts for which day if the batch has run more than one (rare — most batches finish in
// a single day), since each day is its own page.
function viewBatchReportClicked() {
  const sel = document.getElementById("s-batch");
  const base = sel ? sel.value : "";
  if (!base) { alert("Please select a batch from the list first."); return; }
  const info = mergedBatchRegistry()[base];
  const lastDay = (info && info.lastDay) || 1;
  let day = 1;
  if (lastDay > 1) {
    const input = prompt(`This batch has ${lastDay} day(s) of work. Which day's report do you want to view? (1-${lastDay})`, String(lastDay));
    if (input === null) return;
    day = parseInt(input, 10);
    if (!Number.isInteger(day) || day < 1 || day > lastDay) { alert("Please enter a valid day number."); return; }
  }
  openBatchReport(base, day, "setup");
}

function rBatchReport() {
  const base = S.batchReportBase;

  const dayLbl = day > 1 ? ` · Day ${day}` : "";
